<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>0</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8f4f8; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; padding: 12px; box-sizing: border-box; gap: 10px; }
  #top { display: flex; justify-content: space-between; font-size: 13px; color: #7fd6ff; }
  #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; align-content: center; }
  .cell { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: clamp(10px, 2.2vw, 16px); border: 1px solid #14323f; border-radius: 3px; cursor: pointer; user-select: none; transition: background .25s, color .25s, border-color .25s; }
  .cell:hover { border-color: #7fd6ff; }
  .cell.hit { background: #7fd6ff; color: #000; border-color: #7fd6ff; }
  .cell.out { opacity: .15; }
  .cell.sym { color: #ffb86b; }
  #bins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bin { border: 1px solid #14323f; border-radius: 4px; min-height: 52px; padding: 6px; font-size: 12px; color: #7fd6ff; overflow: hidden; word-break: break-all; line-height: 1.5; }
  #ctl { display: flex; justify-content: center; gap: 14px; }
  button { background: #000; color: #7fd6ff; border: 1px solid #7fd6ff; border-radius: 4px; padding: 10px 22px; font: inherit; font-size: 18px; cursor: pointer; }
  button:active { background: #7fd6ff; color: #000; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="n">0</span><span id="t">0</span></div>
  <div id="grid"></div>
  <div>
    <div id="bins"><div class="bin" id="b0"></div><div class="bin" id="b1"></div></div>
    <div id="ctl" style="margin-top:10px"><button id="go">▶</button><button id="rst">◌</button></div>
  </div>
</div>
<script>
(() => {
  const SYM = ['∆','◊','∑','⌘','◦','▲','⊗','≈','∞','⊕','◐','◑'];
  const DIG = '0123456789';
  const N = 100;
  const grid = document.getElementById('grid');
  const bins = [document.getElementById('b0'), document.getElementById('b1')];
  const nEl = document.getElementById('n');
  const tEl = document.getElementById('t');
  const cells = [];
  let count = 0, tick = 0, timer = null;

  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const newVal = () => Math.random() < 0.18 ? rnd(SYM) : String(Math.floor(Math.random() * 100)).padStart(2, '0');
  const isSym = v => SYM.includes(v);

  for (let i = 0; i < N; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.v = newVal();
    c.textContent = c.dataset.v;
    if (isSym(c.dataset.v)) c.classList.add('sym');
    c.addEventListener('click', () => refine(c));
    grid.appendChild(c);
    cells.push(c);
  }

  function refine(c) {
    if (c.classList.contains('out')) return;
    const v = c.dataset.v;
    const bin = isSym(v) ? 1 : 0;
    bins[bin].textContent += (bins[bin].textContent ? ' ' : '') + v;
    c.classList.add('out');
    count++;
    nEl.textContent = count;
    tEl.textContent = tick;
    if (count === N) reset(true);
  }

  function reset(fresh) {
    cells.forEach(c => {
      c.classList.remove('out', 'hit', 'sym');
      c.dataset.v = newVal();
      c.textContent = c.dataset.v;
      if (isSym(c.dataset.v)) c.classList.add('sym');
    });
    bins.forEach(b => b.textContent = '');
    count = 0;
    nEl.textContent = 0;
    if (fresh) tick++;
    tEl.textContent = tick;
  }

  function step() {
    const c = rnd(cells);
    c.classList.add('hit');
    setTimeout(() => c.classList.remove('hit'), 400);
  }

  document.getElementById('go').addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; return; }
    timer = setInterval(step, 180);
  });
  document.getElementById('rst').addEventListener('click', () => reset(false));
})();
</script>
</body>
</html>
