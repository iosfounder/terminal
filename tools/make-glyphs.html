<!doctype html>
<meta charset="utf-8">
<title>make glyphs</title>
<style>@font-face{font-family:"Dotsies";src:url("../DotsiesRect.ttf")}body{background:#000;color:#fff;font:14px monospace;padding:12px}canvas{background:#222;image-rendering:pixelated}</style>
<!-- One-off tool: draws DotsiesRect.ttf into MapLibre's glyph format (signed distance fields, protobuf) and
     uploads it to fonts/dots/0-255.pbf through the local dev server. Open at http://localhost:8190/tools/make-glyphs.html -->
<pre id="log"></pre>
<canvas id="prev"></canvas>
<script>
const FS = 24, BUF = 3, RAD = 8, CUT = .25, INF = 1e20;
const log = t => { document.getElementById("log").textContent += t + "\n"; };

function edt1d(f, v, z, n) {                       // Felzenszwalb squared distance transform, one row
  let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF; const d = new Float64Array(n);
  for (let q = 1; q < n; q++) {
    let s; do { const p = v[k]; s = ((f[q] + q * q) - (f[p] + p * p)) / (2 * q - 2 * p); } while (s <= z[k] && --k > -1);
    k++; v[k] = q; z[k] = s; z[k + 1] = INF;
  }
  k = 0; for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) ** 2 + f[v[k]]; }
  return d;
}
function edt(grid, w, h) {
  const v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1), col = new Float64Array(h), row = new Float64Array(w);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) col[y] = grid[y * w + x]; const d = edt1d(col, v, z, h); for (let y = 0; y < h; y++) grid[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) row[x] = grid[y * w + x]; const d = edt1d(row, v, z, w); for (let x = 0; x < w; x++) grid[y * w + x] = d[x]; }
}

function glyph(ch) {
  const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true });
  x.font = FS + "px Dotsies"; const m = x.measureText(ch), adv = Math.round(m.width);
  const asc = Math.ceil(m.actualBoundingBoxAscent || 0), desc = Math.ceil(m.actualBoundingBoxDescent || 0);
  const left = Math.floor(-(m.actualBoundingBoxLeft || 0)), right = Math.ceil(m.actualBoundingBoxRight || 0);
  const gw = Math.max(0, right - left), gh = asc + desc;
  if (gw <= 0 || gh <= 0) return { id: ch.charCodeAt(0), w: 0, h: 0, left: 0, top: 0, adv: adv || Math.round(FS / 3), bmp: new Uint8Array(0) };
  const W = gw + 2 * BUF, H = gh + 2 * BUF; c.width = W; c.height = H;
  x.font = FS + "px Dotsies"; x.textBaseline = "alphabetic"; x.fillStyle = "#fff"; x.fillText(ch, BUF - left, BUF + asc);
  const id = x.getImageData(0, 0, W, H).data, outer = new Float64Array(W * H), inner = new Float64Array(W * H);
  for (let i = 0; i < W * H; i++) { const a = id[i * 4 + 3] / 255; outer[i] = a === 1 ? 0 : a === 0 ? INF : Math.max(0, .5 - a) ** 2; inner[i] = a === 1 ? INF : a === 0 ? 0 : Math.max(0, a - .5) ** 2; }
  edt(outer, W, H); edt(inner, W, H);
  const bmp = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { const d = Math.sqrt(outer[i]) - Math.sqrt(inner[i]); bmp[i] = Math.max(0, Math.min(255, Math.round(255 - 255 * (d / RAD + CUT)))); }
  return { id: ch.charCodeAt(0), w: gw, h: gh, left, top: asc - 26 /* the engine's baseline offset, measured from the Noto glyph file: top = ascent - 26 */, adv, bmp };
}

// protobuf
const bytes = [];
const vi = n => { n >>>= 0; while (n > 127) { bytes.push((n & 127) | 128); n >>>= 7; } bytes.push(n); };
const zz = n => (n << 1) ^ (n >> 31);
function enc(glyphs, name, range) {
  const out = []; const put = a => { for (const b of a) out.push(b); };
  const sub = fn => { const save = bytes.length; fn(); const part = bytes.splice(save); return part; };
  const tag = (f, t) => vi((f << 3) | t);
  const stack = sub(() => {
    tag(1, 2); const nb = new TextEncoder().encode(name); vi(nb.length); put.call(null, []); nb.forEach(b => bytes.push(b));
    tag(2, 2); const rb = new TextEncoder().encode(range); vi(rb.length); rb.forEach(b => bytes.push(b));
    for (const g of glyphs) {
      const body = sub(() => {
        tag(1, 0); vi(g.id); if (g.bmp.length) { tag(2, 2); vi(g.bmp.length); g.bmp.forEach(b => bytes.push(b)); }   // blank glyphs carry no bitmap
        tag(3, 0); vi(g.w); tag(4, 0); vi(g.h); tag(5, 0); vi(zz(g.left)); tag(6, 0); vi(zz(g.top)); tag(7, 0); vi(g.adv);
      });
      tag(3, 2); vi(body.length); body.forEach(b => bytes.push(b));
    }
  });
  tag(1, 2); vi(stack.length); stack.forEach(b => bytes.push(b));
  return new Uint8Array(bytes.splice(0));
}

(async () => {
  await document.fonts.load(FS + "px Dotsies"); await document.fonts.ready;
  const chars = []; for (let i = 32; i < 256; i++) if (i < 127 || i > 159) chars.push(String.fromCharCode(i));
  const gs = chars.map(glyph);
  log("glyphs: " + gs.length + "   with ink: " + gs.filter(g => g.w).length);
  log("sample  a: " + JSON.stringify({ ...gs.find(g => g.id === 97), bmp: undefined }));
  log("sample  A: " + JSON.stringify({ ...gs.find(g => g.id === 65), bmp: undefined }));
  log("sample  e: " + JSON.stringify({ ...gs.find(g => g.id === 101), bmp: undefined }));
  log("same ink for a/A?  " + (JSON.stringify([...gs.find(g => g.id === 97).bmp]) === JSON.stringify([...gs.find(g => g.id === 65).bmp])));
  const pb = enc(gs, "Dots", "0-255"); log("bytes: " + pb.length);
  const r = await fetch("../fonts/dots/0-255.pbf", { method: "PUT", body: pb }); log("upload: " + r.status);
  // preview of the SDF for the letters "terminal"
  const p = document.getElementById("prev"), px = p.getContext("2d"); p.width = 520; p.height = 60; let ox = 4;
  for (const ch of "terminal 0123") { const g = gs.find(q => q.id === ch.charCodeAt(0)); if (!g.w) { ox += g.adv + 2; continue; } const W = g.w + 2 * BUF, H = g.h + 2 * BUF, im = px.createImageData(W, H);
    for (let i = 0; i < W * H; i++) { const v = g.bmp[i] > 128 ? 255 : 0; im.data.set([v, v, v, 255], i * 4); } px.putImageData(im, ox, 20); ox += W + 2; }
})();
</script>
