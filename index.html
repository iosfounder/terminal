<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="locator">
<meta name="mobile-web-app-capable" content="yes">
<title>locator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css">
<style>
@font-face{font-family:"Dotsies";src:url("DotsiesRect.ttf") format("truetype");font-display:swap}
:root{--k:#000;--w:#fff;--g:#777;--c:#4ff3ff;--i:#8a7dff;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;position:fixed;inset:0;width:100%;background:var(--k);color:var(--w);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
  font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:lowercase}
html[data-dots="1"] body{font-family:"Dotsies",ui-monospace,monospace;letter-spacing:.2em}   /* the font packs letters edge to edge; a gap of one dot makes words readable */
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;border-radius:0;text-transform:inherit}
button{cursor:pointer;border:1.5px solid var(--w);user-select:none;-webkit-user-select:none;transition:background .18s,color .18s,transform .18s var(--ease),opacity .25s,border-color .25s}
button:active,button.on{background:var(--w);color:var(--k)}
button:active{transform:scale(.94)}
:focus-visible{outline:1px solid var(--w);outline-offset:2px}
[hidden]{display:none!important}
.o{width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center}
.o.sm{width:40px;height:40px;font-size:18px}
.o.xl{width:80px;height:80px;font-size:34px;border-width:2px}
.g{color:var(--g)}
.o,#kp .mut{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important}   /* symbol buttons stay readable in Dots mode */
.dw{font-family:"Dotsies",ui-monospace,monospace!important;letter-spacing:.2em;font-size:34px;line-height:1}   /* the word "dots" is always written in Dots */

/* map + layers */
#map{position:fixed;inset:0;background:var(--k);animation:wipe .9s var(--ease) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.maplibregl-map{background:var(--k);font:inherit}
.maplibregl-canvas{outline:0}
.maplibregl-ctrl-attrib{background:transparent!important;color:var(--g)!important;font:10px/1.3 ui-monospace,monospace!important;text-transform:lowercase;margin:0 4px calc(var(--sab) + 4px)!important}
.maplibregl-ctrl-attrib a{color:var(--g)!important}
.maplibregl-ctrl-attrib-button{background-color:transparent!important;filter:invert(.5)}
.maplibregl-ctrl-bottom-right{z-index:600}
.maplibregl-marker{will-change:transform}
#grid{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.06;
  background:linear-gradient(var(--w) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--w) 1px,transparent 1px) 0 0/48px 48px;
  animation:gridin 1.4s var(--ease) both}
@keyframes gridin{from{clip-path:circle(0 at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
#rcv{position:fixed;inset:0;z-index:610;pointer-events:none;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:620;pointer-events:none}
#dim{position:fixed;inset:0;z-index:690;pointer-events:none;background:rgba(0,0,0,.55);opacity:0;transition:opacity .5s ease}
body[data-st="intent"] #dim{opacity:1}
#tint{position:fixed;inset:0;z-index:860;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,rgba(var(--tc,255,255,255),0) 25%,rgba(var(--tc,255,255,255),.38) 100%)}
#tint.go{animation:tint 1.1s ease-out}
@keyframes tint{0%{opacity:0}28%{opacity:1}100%{opacity:0}}

/* markers */
.mkw{background:none!important;border:0!important;width:0;height:0}
.mk{display:block;width:24px;height:24px;margin:-12px 0 0 -12px;font-size:20px;line-height:24px;text-align:center;font-weight:400;text-shadow:0 0 4px #000,0 0 4px #000}
.mk.l1{color:var(--i);text-shadow:0 0 8px var(--i),0 0 3px #000}
.mk.l2{color:var(--c);text-shadow:0 0 9px var(--c),0 0 3px #000}
.mk.o2{opacity:.7}
.mk.drop{animation:drop .8s var(--ease) both}
@keyframes drop{from{transform:translateY(-34px) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.me i,.tgm i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--w);box-shadow:0 0 10px rgba(255,255,255,.8)}
.me b,.tgm b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:1px solid var(--c);border-radius:50%;animation:pulse 2.4s ease-out infinite}
.tgm i{background:none;border:1.5px solid var(--c);width:16px;height:16px;left:-8px;top:-8px;box-shadow:0 0 12px var(--c)}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.me em.sw{position:absolute;left:-110px;top:-110px;width:220px;height:220px;border:1px solid var(--c);border-radius:50%;opacity:0;animation:sweep 6s ease-out infinite 2s}
@keyframes sweep{0%{transform:scale(.05);opacity:.5}75%{opacity:0}100%{transform:scale(1);opacity:0}}
.mk.rip{animation:rip .8s var(--ease) both;animation-delay:var(--rd,0ms)}
@keyframes rip{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
.rpl{position:absolute;left:-250px;top:-250px;width:500px;height:500px;border:1.5px solid var(--c);border-radius:50%;animation:rpl 1.9s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes rpl{from{transform:scale(.02);opacity:.9}to{transform:scale(3);opacity:0}}

/* open: sign in */
#open{position:fixed;inset:0;z-index:800;background:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 10px)}
#boxes{display:flex;gap:12px}
#boxes i{width:54px;height:72px;border:1.5px solid var(--w);border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:38px;transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
#boxes i.f{border-color:var(--c);box-shadow:0 0 14px rgba(79,243,255,.3)}
#boxes i.cur::after{content:"_";animation:blink 1.1s ease-in-out infinite}
#boxes.busy i{animation:blink .5s ease-in-out infinite}
#boxes.inv i{background:var(--w);color:var(--k)}
#boxes.shake{animation:shake .42s var(--ease)}
@keyframes blink{50%{opacity:.25}}
@keyframes shake{20%{transform:translateX(-9px)}50%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
#orow{display:flex;gap:18px;align-items:center;margin-top:4px}
#bgo{width:60px;height:60px;font-size:26px;border-width:2px;border-color:var(--c);color:var(--c)}
#bgo:active{background:var(--c);color:var(--k)}
#oerr{min-height:1.4em;color:var(--g);font-size:15px}
#kp{display:grid;grid-template-columns:repeat(3,76px);gap:10px;margin-top:6px}
#kp button{height:58px;border-radius:14px;font-size:26px;border-color:#555}
#kp button:active{background:var(--w);border-color:var(--w)}
#kp .gh{visibility:hidden}
#kp button.mut{font-size:20px;color:var(--g)}
#ack{margin-top:10px}
.o.pri{background:var(--w);color:var(--k)}

/* menu: one button that blooms */
#bm{position:fixed;top:calc(var(--sat) + 12px);right:12px;z-index:730;width:46px;height:46px;border-radius:50%;font-size:20px;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
#bm.on{background:var(--w);color:var(--k);transform:rotate(90deg)}
#bm.flick{animation:flick 1.2s ease 1}
@keyframes flick{0%,40%,80%{box-shadow:0 0 0 0 var(--c)}20%,60%{box-shadow:0 0 0 12px rgba(79,243,255,0)}}
#mn{position:fixed;top:calc(var(--sat) + 66px);right:12px;z-index:725;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#mn>*{opacity:0;transform:translate(8px,-20px) scale(.5);transform-origin:top right;transition:transform .42s cubic-bezier(.2,1.25,.3,1),opacity .25s;pointer-events:none}
#mn.open>*{opacity:1;transform:none;pointer-events:auto}
#mn.open>*:nth-child(2){transition-delay:.04s}#mn.open>*:nth-child(3){transition-delay:.08s}#mn.open>*:nth-child(4){transition-delay:.12s}#mn.open>*:nth-child(5){transition-delay:.16s}
#mid{font-size:15px;letter-spacing:.06em;padding:6px 12px;border:1px solid #444;border-radius:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
#mn .o{background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
#mn .o.on{background:var(--w)}
body:not([data-st="home"]) #bm,body:not([data-st="home"]) #mn{display:none}

/* toast: only for problems */
#toast{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 118px);z-index:700;text-align:center;color:var(--g);font-size:14px;pointer-events:none;opacity:0;transition:opacity .5s ease}
#toast.on{opacity:1}

/* dock */
#dockhome{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 24px);z-index:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
#dockhome>*{pointer-events:auto}
#brec{position:absolute;left:20px;bottom:18px;background:rgba(0,0,0,.5)}
#bspin{background:rgba(0,0,0,.35);box-shadow:0 0 22px rgba(79,243,255,.18)}
#bspin.pulse1{animation:ring 2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(79,243,255,.6)}100%{box-shadow:0 0 0 30px rgba(79,243,255,0)}}

/* everything that disappears when you tap the map */
#bm,#mn,#dockhome,#toast{transition:opacity .45s ease}
body[data-hide="1"] #bm,body[data-hide="1"] #mn,body[data-hide="1"] #dockhome,body[data-hide="1"] #toast{opacity:0!important;pointer-events:none}

/* walking: small, top right, no bar */
.cmp svg{width:100%;height:100%;display:block}
.cmp .ar{display:none}.cmp.has .ar{display:block}
#hud{position:fixed;top:calc(var(--sat) + 12px);right:12px;z-index:700;width:92px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;animation:down .6s var(--ease) both}
@keyframes down{from{transform:translateY(-18px);opacity:0}}
#hud .cmp{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.5);filter:drop-shadow(0 0 8px rgba(79,243,255,.35))}
#dist{font-size:23px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000,0 0 3px #000}
#rinfo{font-size:15px;color:#cfcfcf;text-shadow:0 0 6px #000,0 0 3px #000}
#tfoot{position:fixed;left:20px;right:20px;bottom:calc(var(--sab) + 24px);z-index:710;display:flex;justify-content:space-between;align-items:center}
#tfoot .o{background:rgba(0,0,0,.5)}
.hold{position:relative;isolation:isolate;overflow:hidden}
.hold::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--w);transform:scaleY(0);transform-origin:bottom;transition:transform .15s linear}
.hold.press::before{transform:scaleY(1);transition:transform .9s linear}
.hold.press{color:var(--k)}
body:not([data-st="travel"]) #hud,body:not([data-st="travel"]) #tfoot{display:none}

/* feedback */
#verd{position:fixed;inset:0;z-index:850;display:grid;place-items:center;font-size:44vw;pointer-events:none;text-shadow:0 0 6px #000;animation:verd 1s ease both}
@keyframes verd{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#open.out{animation:oout .5s var(--ease) forwards}
@keyframes oout{to{opacity:0;transform:scale(1.2)}}

/* intention: type, with our own keyboard */
#int{position:fixed;left:0;right:0;bottom:0;z-index:760;padding:20px 12px calc(var(--sab) + 12px);background:linear-gradient(to bottom,rgba(0,0,0,0),#000 22%);transform:translateY(105%);transition:transform .55s var(--ease)}
body[data-st="intent"] #int{transform:none}
#icancel{position:absolute;right:14px;top:-4px;background:rgba(0,0,0,.6)}
#itx{min-height:3.2em;padding:8px 52px 14px 6px;font-size:26px;line-height:1.25;word-break:break-word;border-bottom:1px solid #333;margin-bottom:12px}
html[data-dots="1"] #itx{font-size:44px}
#itx::after{content:"";display:inline-block;width:.5em;height:1px;border-bottom:2px solid var(--c);margin-left:2px;animation:blink 1.1s ease-in-out infinite}
.kr{display:flex;gap:6px;justify-content:center;margin-bottom:7px}
.kk{flex:1 1 0;max-width:42px;min-width:0;height:46px;border-radius:11px;font-size:20px;border-color:#555}
.kk.wide{max-width:none;flex:4 1 0}
.kk.go{max-width:none;flex:2 1 0;border-color:var(--c);color:var(--c);font-size:24px}
.kk.go:active{background:var(--c);color:var(--k)}
.kk.sp{font-family:ui-monospace,monospace!important;font-size:18px}
html[data-dots="1"] .kk{font-size:36px}
html[data-dots="1"] .kk.go,html[data-dots="1"] .kk.sp{font-size:20px}

/* arrival: classify, then confirm */
#rep{position:fixed;left:0;right:0;bottom:0;z-index:750;padding:22px 16px calc(var(--sab) + 20px);background:linear-gradient(to bottom,rgba(0,0,0,0),#000 24%);display:flex;flex-direction:column;gap:18px;align-items:center;animation:up .7s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
#rep .info{width:100%;display:flex;justify-content:space-between;font-size:15px;color:var(--g)}
#lv{display:flex;gap:26px;justify-content:center}
.lvb{border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:#aaa;transition:transform .4s var(--ease),opacity .4s,filter .4s;opacity:.85}
.lvb:active{background:none;color:inherit}
.lvb i{width:66px;height:66px;border-radius:50%;border:2px solid var(--lc);box-shadow:0 0 18px color-mix(in srgb,var(--lc) 45%,transparent);transition:background .4s,box-shadow .4s}
.lvb[data-l="0"]{--lc:#fff}.lvb[data-l="1"]{--lc:var(--i)}.lvb[data-l="2"]{--lc:var(--c)}
#lv.chosen .lvb{opacity:.28;transform:scale(.85)}
#lv.chosen .lvb.sel{opacity:1;transform:scale(1.18)}
.lvb.sel i{background:var(--lc);box-shadow:0 0 34px var(--lc)}
#vr{display:flex;gap:26px;align-items:center;justify-content:center;opacity:.25;pointer-events:none;transition:opacity .5s}
#vr.ready{opacity:1;pointer-events:auto}
#vr .o{width:60px;height:60px;font-size:26px}
#rep .pv{display:flex;gap:12px;align-items:center}
#rep img{width:60px;height:60px;object-fit:cover;border:1px solid var(--w);filter:grayscale(1) contrast(1.1)}
#nx{position:fixed;left:0;right:0;bottom:0;z-index:750;padding:30px 16px calc(var(--sab) + 26px);background:linear-gradient(to bottom,rgba(0,0,0,0),#000 40%);display:flex;gap:44px;justify-content:center;animation:up .7s var(--ease) both}
#nxgo{border-color:var(--c);color:var(--c);box-shadow:0 0 24px rgba(79,243,255,.25)}
#nxgo:active{background:var(--c);color:var(--k)}
#sheet img{max-width:100%;max-height:34vh;display:block;border:1px solid var(--w)}
#sheet img.gray{filter:grayscale(1) contrast(1.1)}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:740;max-height:72vh;overflow:auto;background:var(--k);border-top:1px solid #555;border-radius:18px 18px 0 0;
  padding:58px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .5s var(--ease)}
#sheet.open{transform:none}
#sheet .x{position:absolute;right:10px;top:8px}
#sheet h2{font-size:18px;font-weight:400;margin-bottom:10px}
#sheet .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #222;cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
#sheet .li:active{background:var(--w);color:var(--k)}
#sheet .bl{display:flex;flex-direction:column;gap:10px}
#sheet p{white-space:pre-wrap;word-break:break-word}
#sheet .st{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #222}
#sheet .st.hp{justify-content:flex-start;gap:14px;padding:9px 0}
.ld{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;vertical-align:middle;margin-right:6px}
.ld.l1{border-color:var(--i);background:var(--i)}.ld.l2{border-color:var(--c);background:var(--c)}

/* film look */
#grain{position:fixed;inset:0;z-index:880;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:160px 160px}
#vig{position:fixed;inset:0;z-index:640;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.6) 100%);transition:opacity .8s ease}
body[data-near="1"] #vig{background:radial-gradient(ellipse at 50% 45%,transparent 36%,rgba(0,0,0,.8) 100%)}
body[data-lite="1"] #grain{display:none}
#scan{position:fixed;left:0;right:0;top:-4px;height:2px;z-index:870;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,var(--c) 50%,transparent);box-shadow:0 0 22px var(--c)}
#scan.go{animation:scan 1.1s cubic-bezier(.5,0,.3,1)}
@keyframes scan{0%{top:-4px;opacity:.8}100%{top:100%;opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-st="home" data-hide="0">
<div id="map"></div>
<div id="grid" aria-hidden="true"></div>
<canvas id="rcv" aria-hidden="true"></canvas>
<canvas id="fx" hidden aria-hidden="true"></canvas>
<div id="dim" aria-hidden="true"></div>
<div id="tint" aria-hidden="true"></div>
<div id="vig" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="scan" aria-hidden="true"></div>

<section id="open">
  <div id="boxes"><i></i><i></i><i></i><i></i></div>
  <div id="orow">
    <button id="bmode" class="o sm" type="button" aria-label="New agent">+</button>
    <button id="bgo" class="o" type="button" aria-label="Sign in">→</button>
    <button id="dice" class="o sm" type="button" aria-label="Random ID" hidden>⟳</button>
  </div>
  <p id="oerr" role="alert"></p>
  <div id="kp">
    <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
    <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
    <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
    <button type="button" id="klast" class="mut gh" aria-label="Last ID">↺</button><button type="button" data-d="0">0</button><button type="button" id="kdel" class="mut" aria-label="Delete">⌫</button>
  </div>
  <button id="ack" class="o xl" type="button" aria-label="Stored" hidden>✓</button>
</section>

<div id="app" hidden>
  <button id="bm" type="button" aria-label="Menu">◉</button>
  <nav id="mn">
    <div id="mid"></div>
    <button id="bglobal" class="o sm" type="button" aria-label="All agents">⊕</button>
    <button id="blist" class="o sm" type="button" aria-label="Reports">≡</button>
    <button id="bhelp" class="o sm" type="button" aria-label="Help">?</button>
    <button id="bset" class="o sm" type="button" aria-label="Settings">⚙</button>
  </nav>

  <div id="dockhome">
    <button id="brec" class="o sm" type="button" aria-label="Centre" hidden>⌖</button>
    <button id="bspin" class="o xl" type="button" aria-label="Spin">◎</button>
  </div>
  <p id="toast"></p>

  <section id="hud" hidden>
    <div class="cmp" id="cmpt"></div>
    <div id="dist">–</div>
    <div id="rinfo"></div>
  </section>
  <div id="tfoot" hidden>
    <button id="babort" class="o hold" type="button" aria-label="Hold to end">✕</button>
    <button id="bhere" class="o sm" type="button" aria-label="Here" hidden>⚑</button>
    <button id="brec2" class="o sm" type="button" aria-label="Centre">⌖</button>
  </div>
  <div id="verd" hidden></div>

  <section id="int">
    <button id="icancel" class="o sm" type="button" aria-label="Cancel">✕</button>
    <div id="itx"></div>
    <div id="kb"></div>
  </section>

  <section id="rep" hidden>
    <div class="info"><span id="rid"></span><span id="rtype"></span></div>
    <div id="lv">

  sbody.dataset.k = "list";
  sbody.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { listAll = b.dataset.t === "1"; sfx.key(); if (listAll) subAll(); renderList(); }));
  sbody.querySelectorAll(".li").forEach(b => b.addEventListener("click", () => { const r = (mine.get(b.dataset.r) || allDocs.get(b.dataset.r)); if (r) { follow = false; if (mapReady) map.flyTo({ center: [r.lng, r.lat], zoom: 15.8, duration: 800 }); openReport(r); } }));
}
$("blist").addEventListener("click", () => {
  if (sheet.classList.contains("open") && sbody.dataset.k === "list") { closeSheet(); return; }
  if (listAll) subAll(); renderList(); sfx.open();
});

function openReport(r) {
  const head = "<h2>" + esc(r.rid) + " " + vg(r) + " " + TG[r.type] + ' <span class="g">' + esc(fmtT(r)) + " · " + esc(r.src || "") + "</span></h2>";
  let b = '<div class="bl">';
  if (r.intention) b += "<p>" + esc(r.intention) + "</p>";
  if (r.status === "done") b += '<p class="g">' + ldot(r) + esc(LV[r.level || 0]) + "</p>";
  if (r.photo) b += '<img class="gray" src="' + esc(r.photo) + '" alt="">';
  openSheet(head + b + "</div>"); sbody.dataset.k = "rep"; sfx.open();
}

$("bset").addEventListener("click", () => {
  if (sheet.classList.contains("open") && sbody.dataset.k === "set") { closeSheet(); return; }
  const on = document.documentElement.dataset.dots === "1";
  openSheet('<div class="st"><span class="dw">dots</span><button id="sdots" class="o' + (on ? " on" : "") + '" type="button">' + (on ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>♪</span><button id="smute" class="o' + (!muted ? " on" : "") + '" type="button">' + (!muted ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>' + (units === "mi" ? "mi" : "km") + '</span><button id="sunit" class="o" type="button">⇄</button></div>' +
    '<div class="st"><span>' + (routeMode === "car" ? "ⓓ" : "ⓦ") + '</span><button id="smode" class="o" type="button">⇄</button></div>' +
    '<div class="st"><span>⋰</span><button id="sdm" class="o' + (DOTMAP ? " on" : "") + '" type="button">' + (DOTMAP ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>⏻</span><button id="sout" class="o" type="button">⏻</button></div>' +
    '<div class="st g"><span>' + BUILD + "</span></div>");
  sbody.dataset.k = "set"; sfx.open();
  $("sdots").addEventListener("click", e => { const v = document.documentElement.dataset.dots !== "1"; setDots(v); applyDots(); sfx.key(); e.currentTarget.classList.toggle("on", v); e.currentTarget.textContent = v ? "●" : "○"; });
  $("smute").addEventListener("click", e => { muted = !muted; store.set("tm.mute", muted ? "1" : "0"); e.currentTarget.classList.toggle("on", !muted); e.currentTarget.textContent = !muted ? "●" : "○"; sfx.key(); });
  $("sunit").addEventListener("click", e => { units = units === "mi" ? "km" : "mi"; store.set("tm.units", units); e.currentTarget.previousElementSibling.textContent = units; sfx.key(); });
  $("smode").addEventListener("click", e => { routeMode = routeMode === "foot" ? "car" : "foot"; store.set("tm.mode", routeMode); e.currentTarget.previousElementSibling.textContent = routeMode === "car" ? "ⓓ" : "ⓦ"; rt = null; lastFetch = 0; sfx.key(); if (active) { fetchRoute(); } });
  $("sdm").addEventListener("click", () => { store.set("tm.dotmap", DOTMAP ? "0" : "1"); sfx.key(); location.reload(); });
  $("sout").addEventListener("click", () => { sfx.no(); signOut(auth).then(() => location.reload()).catch(() => location.reload()); });
});

const HELP = [["◎", "type an intention · the machine places a point"], ["➤", "arrow up = straight on"], ["✕", "hold to end"],
  ["◉", "menu · tap the map to hide everything"], ["● ● ●", "calm · strange · uncanny, then ✓ ✕ ⌀"], ["▶ ■", "there: go on from here with the same intention, or end"],
  ["⊕", "everyone's reports on the map"], ["≡", "reports: yours · everyone's"], ["⚙", "settings"]];
function openHelp() {
  if (sheet.classList.contains("open") && sbody.dataset.k === "help") { closeSheet(); return; }
  openSheet(HELP.map(h => '<div class="st hp"><span style="font-size:20px;min-width:3.6em">' + esc(h[0]) + "</span><span>" + esc(h[1]) + "</span></div>").join(""));
  sbody.dataset.k = "help"; sfx.open();
}
$("bhelp").addEventListener("click", openHelp);
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 && !e.target.closest("#map")) e.preventDefault(); }, { passive: false });

/* ---------- session ---------- */
onAuthStateChanged(auth, user => {
  if (!user) { $("app").hidden = true; $("open").hidden = false; busy = false; return; }
  if (hold) return;                              // new random ID: wait until it has been acknowledged
  boot(user);
});
function boot(user) {
  uid = user.uid; agent = user.displayName || pendingId || store.get("tm.id") || "";
  if (!/^\d{4}$/.test(agent)) { signOut(auth); return; }
  store.set("tm.id", agent);
  try { walk = JSON.parse(store.get("tm.walk" + agent) || "[]"); if (!Array.isArray(walk)) walk = []; } catch { walk = []; }
  $("open").classList.add("out");
  setTimeout(() => {
    $("open").hidden = true; $("open").classList.remove("out"); $("app").hidden = false; $("mid").textContent = agent;
    initMap(); startGeo(); subMine(); route(); tickLoop();
    if (!store.get("tm.spun")) $("bspin").classList.add("pulse1");
  }, reduced ? 0 : 480);
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));
</script>
</body>
</html>
