<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css">
<style>
@font-face{font-family:"Dotsies";src:url("DotsiesRect.ttf") format("truetype");font-display:swap}
:root{--k:#000;--w:#fff;--g:#777;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--k);color:var(--w);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
  font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:lowercase}
html[data-dots="1"] body{font-family:"Dotsies",ui-monospace,monospace}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;border-radius:0;text-transform:inherit}
button{cursor:pointer;border:1.5px solid var(--w);user-select:none;-webkit-user-select:none;transition:background .1s,color .1s}
button:active,button.on{background:var(--w);color:var(--k)}
:focus-visible{outline:1px solid var(--w);outline-offset:2px}
[hidden]{display:none!important}
.o{width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center}
.o.xl{width:80px;height:80px;font-size:34px;border-width:2px}
.g{color:var(--g)}

/* map */
#map{position:fixed;inset:0;background:var(--k);animation:wipe .6s steps(8) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.maplibregl-map{background:var(--k);font:inherit}
.maplibregl-canvas{outline:0}
.maplibregl-ctrl-attrib{background:transparent!important;color:var(--g)!important;font:10px/1.3 ui-monospace,monospace!important;text-transform:lowercase;margin:0 4px calc(var(--sab) + 4px)!important}
.maplibregl-ctrl-attrib a{color:var(--g)!important}
.maplibregl-ctrl-attrib-button{background-color:transparent!important;filter:invert(.5)}
.maplibregl-ctrl-bottom-right{z-index:600}
.maplibregl-marker{will-change:transform}
#grid{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.07;
  background:linear-gradient(var(--w) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--w) 1px,transparent 1px) 0 0/48px 48px;
  animation:gridin .9s steps(10) both}
@keyframes gridin{from{clip-path:circle(0 at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
#fx{position:fixed;inset:0;z-index:600;pointer-events:none}
#flash{position:fixed;inset:0;z-index:900;background:var(--w);pointer-events:none}

/* markers */
.mkw{background:none!important;border:0!important;width:0;height:0}
.mk{display:block;width:24px;height:24px;margin:-12px 0 0 -12px;font-size:20px;line-height:24px;text-align:center;font-weight:400;text-shadow:0 0 3px #000,0 0 3px #000}
.mk.o2{opacity:.65}
.mk.drop{animation:drop .5s steps(5) both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.me i,.tgm i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--w)}
.me b,.tgm b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:1px solid var(--w);border-radius:50%;animation:pulse 2s steps(5) infinite}
.tgm i{background:none;border:1px solid var(--w);width:14px;height:14px;left:-7px;top:-7px}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.seg-new{animation:flick .9s steps(1) 1}
@keyframes flick{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}

/* open */
#open{position:fixed;inset:0;z-index:800;background:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#boxes{display:flex;gap:12px;position:relative}
#boxes i{width:52px;height:72px;border:1px solid var(--w);display:grid;place-items:center;font-style:normal;font-size:40px}
#boxes i.cur::after{content:"_";animation:blink 1s steps(1) infinite}
#boxes.busy i{animation:blink .4s steps(1) infinite}
#boxes.inv i{background:var(--w);color:var(--k)}
#boxes.shake{animation:shake .3s steps(3)}
@keyframes blink{50%{opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#idin{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;text-align:center;caret-color:transparent}
#oerr{min-height:1.4em;color:var(--g);font-size:16px}
#obtn{display:flex;gap:18px}
.o.pri{background:var(--w);color:var(--k)}
#last{border:0;color:var(--g);font-size:20px;letter-spacing:.3em;padding:8px 12px}
#last:active{background:none;color:var(--w)}

/* top */
#top{position:fixed;top:0;left:0;right:0;z-index:700;background:var(--k);border-bottom:1px solid var(--w);
  padding:calc(var(--sat) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
#top .sp{flex:1}
#top{gap:6px}
#top .o{width:44px;height:44px;font-size:19px}
#me{font-size:19px}
#me{font-size:20px;letter-spacing:.08em}
#rk{text-transform:none;font-size:18px;min-width:2.2em;text-align:center;border:1px solid var(--w);padding:0 6px}
#rk.flick{animation:inv .9s steps(1) 1}
@keyframes inv{0%,34%,67%{background:var(--w);color:var(--k)}17%,50%,84%,100%{background:none;color:var(--w)}}
#line{position:fixed;top:calc(var(--sat) + 62px);left:12px;right:12px;z-index:650;pointer-events:none;color:var(--w);text-shadow:0 0 3px #000,0 0 3px #000}
#line.dim{color:var(--g)}

/* compass: ring + north tick; the big arrow shows where to walk */
.cmp svg{width:100%;height:100%;display:block}
.cmp .ar{display:none}.cmp.has .ar{display:block}
#cmph{position:fixed;top:calc(var(--sat) + 64px);right:12px;width:68px;height:68px;z-index:650;pointer-events:none;background:rgba(0,0,0,.55);border-radius:50%}

/* dock */
#dockhome{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 22px);z-index:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
#dockhome>*{pointer-events:auto}
#brec{position:absolute;left:20px;bottom:16px}
#bspin.pulse1{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}

/* hide to essentials */
#top,#line,#cmph,#dockhome{transition:opacity .3s ease}
body[data-hide="1"] #top,body[data-hide="1"] #line,body[data-hide="1"] #cmph,body[data-hide="1"] #dockhome{opacity:0;pointer-events:none}
#dot{position:fixed;right:14px;bottom:calc(var(--sab) + 44px);z-index:710;width:36px;height:36px;font-size:14px;opacity:.7}

/* travel: everything at the top */
body[data-st="travel"] #top,body[data-st="travel"] #line,body[data-st="travel"] #cmph{display:none}
#travel{position:fixed;top:0;left:0;right:0;z-index:700;background:var(--k);border-bottom:1.5px solid var(--w);
  padding:calc(var(--sat) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:down .3s ease both}
@keyframes down{from{transform:translateY(-30px);opacity:0}}
#dist{font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
#rinfo{font-size:16px;margin-top:6px;min-height:1.4em}
#travel .tb{display:flex;gap:10px;margin-top:10px}
#travel .cmp{width:116px;height:116px;flex:none}
#tfoot{position:fixed;left:20px;right:20px;bottom:calc(var(--sab) + 22px);z-index:710;display:flex;justify-content:space-between;align-items:center}
.hold{position:relative;isolation:isolate;overflow:hidden}
.hold::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--w);transform:scaleY(0);transform-origin:bottom;transition:transform .15s linear}
.hold.press::before{transform:scaleY(1);transition:transform .9s linear}
.hold.press{color:var(--k)}
body[data-eyes="1"] #map,body[data-eyes="1"] #grid,body[data-eyes="1"] #fx{display:none}
body[data-eyes="1"] #travel{bottom:0;flex-direction:column;justify-content:center;border-bottom:0;gap:20px;text-align:center}
body[data-eyes="1"] #dist{font-size:22vw}
body[data-eyes="1"] #travel .cmp{width:min(76vw,44vh);height:min(76vw,44vh)}
body[data-eyes="1"] #bmode{display:none}
body[data-eyes="1"] #travel .tb{justify-content:center}
.rt-casing{stroke:#000}

/* feedback */
#verd{position:fixed;inset:0;z-index:850;display:grid;place-items:center;font-size:44vw;pointer-events:none;text-shadow:0 0 6px #000;animation:verd .8s ease both}
@keyframes verd{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#open.out{animation:oout .3s ease forwards}
@keyframes oout{to{opacity:0;transform:scale(1.25)}}
#pad,#rep{animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}

/* pad */
#pad,#rep{position:fixed;inset:0 0 auto 0;height:var(--vh,100%);z-index:750;background:var(--k);display:flex;flex-direction:column;gap:12px;
  padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 16px);overflow:auto}
#tbar{height:2px;background:var(--g);margin:-14px -16px 0}
#tbar i{display:block;height:100%;width:0;background:var(--w)}
#tbar.run i{width:100%;transition:width 180s linear}
.info{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}
.int{font-size:20px;text-align:center;letter-spacing:.04em;padding:6px 0}
#cv{width:min(88vw,46vh);height:min(88vw,46vh);align-self:center;border:1px solid var(--w);touch-action:none;cursor:crosshair;background:var(--k)}
textarea{width:100%;border:1px solid var(--w);padding:10px;resize:none;font-size:16px;min-height:64px}
textarea::placeholder{color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.row.c{justify-content:center;gap:32px}
#rep img,#sheet img{max-width:100%;max-height:34vh;display:block;border:1px solid var(--w)}
#rep img.gray,#sheet img.gray{filter:grayscale(1) contrast(1.1)}
#rep .pv{display:flex;gap:12px;align-items:flex-start}
#rep .pv img{width:96px;height:96px;object-fit:cover}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:720;max-height:72vh;overflow:auto;background:var(--k);border-top:1px solid var(--w);
  padding:58px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
#sheet .x{position:absolute;right:10px;top:8px}
#sheet h2{font-size:18px;font-weight:400;margin-bottom:10px}
#sheet .li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #333;cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
#sheet .li:active{background:var(--w);color:var(--k)}
#sheet .bl{display:flex;flex-direction:column;gap:10px}
#sheet .rt{display:flex;gap:12px;align-items:center}
#sheet p{white-space:pre-wrap;word-break:break-word}
#sheet .st{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #333}
#sheet .st.hp{justify-content:flex-start;gap:14px;padding:9px 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-st="home" data-hide="0" data-eyes="0">
<div id="map"></div>
<div id="grid" aria-hidden="true"></div>
<canvas id="fx" hidden aria-hidden="true"></canvas>
<div id="flash" hidden></div>

<section id="open">
  <div id="boxes"><i></i><i></i><i></i><i></i><input id="idin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="ID"></div>
  <div id="obtn">
    <button id="bin" class="o" type="button" aria-label="Sign in">→</button>
    <button id="bnew" class="o" type="button" aria-label="New agent">+</button>
    <button id="dice" class="o" type="button" aria-label="Random new ID">⟳</button>
  </div>
  <button id="ack" class="o xl" type="button" aria-label="Stored" hidden>✓</button>
  <button id="last" type="button" aria-label="Last ID" hidden></button>
  <p id="oerr" role="alert"></p>
</section>

<div id="app" hidden>
  <header id="top">
    <span id="me"></span><span id="rk">I</span>
    <span class="sp"></span>
    <button id="bglobal" class="o" type="button" aria-label="All agents">⊕</button>
    <button id="blist" class="o" type="button" aria-label="Reports">≡</button>
    <button id="bhelp" class="o" type="button" aria-label="Help">?</button>
    <button id="bset" class="o" type="button" aria-label="Settings">⚙</button>
  </header>
  <p id="line" class="dim"></p>

  <div class="cmp" id="cmph"></div>
  <div id="dockhome">
    <button id="brec" class="o" type="button" aria-label="Centre">⌖</button>
    <button id="bspin" class="o xl" type="button" aria-label="Spin">◎</button>
  </div>
  <button id="dot" class="o" type="button" aria-label="Show" hidden>◉</button>

  <section id="travel" hidden>
    <div class="tl">
      <div id="dist">–</div>
      <div id="rinfo" class="g"></div>
      <div class="tb">
        <button id="bmode" class="o" type="button" aria-label="Foot or car">ⓦ</button>
        <button id="bhere" class="o" type="button" aria-label="Here" hidden>⚑</button>
      </div>
    </div>
    <div class="cmp" id="cmpt"></div>
  </section>
  <div id="tfoot" hidden>
    <button id="babort" class="o hold" type="button" aria-label="Hold to abort">✕</button>
    <button id="brec2" class="o" type="button" aria-label="Centre">⌖</button>
  </div>
  <div id="verd" hidden></div>

  <section id="pad" hidden>
    <div id="tbar"><i></i></div>
    <div class="info"><span id="pinfo"></span><span id="psrc" class="g"></span></div>
    <div class="int">benefit of mankind</div>
    <canvas id="cv" width="256" height="256"></canvas>
    <textarea id="btxt" rows="2" maxlength="1000" placeholder="…" spellcheck="false" autocapitalize="off"></textarea>
    <div class="row">
      <button id="pcancel" class="o" type="button" aria-label="Cancel">✕</button>
      <button id="pgo" class="o xl" type="button" aria-label="Go">▶</button>
    </div>
  </section>

  <section id="rep" hidden>
    <div class="info"><span id="rid"></span><span id="rtype"></span></div>
    <div class="pv"><img id="rblind" alt=""><p id="rbtxt" class="g" style="white-space:pre-wrap"></p></div>
    <textarea id="found" rows="3" maxlength="2000" placeholder="…" spellcheck="false" autocapitalize="off"></textarea>
    <div class="pv"><button id="bphoto" class="o" type="button" aria-label="Photo">◫</button><img id="pprev" class="gray" alt="" hidden></div>
    <input id="pfile" type="file" accept="image/*" capture="environment" hidden>
    <div class="row c">
      <button id="bno" class="o xl" type="button" aria-label="Deny">✕</button>
      <button id="bnone" class="o xl" type="button" aria-label="Unreachable">⌀</button>
      <button id="byes" class="o xl" type="button" aria-label="Confirm">✓</button>
    </div>
  </section>

  <section id="sheet"><button id="sx" class="o x" type="button" aria-label="Close">✕</button><div id="sbody"></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, query, where, limit, onSnapshot, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCowfCPxIlo3l8KT1Eg8GIYk9k5A2-UUt4",
  authDomain: "terminal-149ac.firebaseapp.com",
  projectId: "terminal-149ac",
  storageBucket: "terminal-149ac.firebasestorage.app",
  messagingSenderId: "13022361485",
  appId: "1:13022361485:web:a9cd9dc612c9efd583efc4"
};

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} }
};
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad4 = n => String(n).padStart(4, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;

const BUILD = "v6";
const INTENT = "benefit of mankind";
const R = 1000, N = 500, G = 12, ARR = 30;
const TG = { attractor:"◉", void:"◌", anomaly:"◈" };
const LINES = ["go.","report.","spin.","hold it.","see first.","walk.","the machine is ready.","no maps. no names.","trust the pull.",
  "confirm or deny.","again.","go now.","intention first.","draw before you move.","night counts.","rain counts.","short or far.",
  "do not decide.","arrive.","write what is there.","one more.","the point is waiting.","begin.","evolve."];

/* ---------- sound ---------- */
let AC = null, muted = store.get("tm.mute") === "1";
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (AC && AC.state === "suspended") AC.resume(); return AC; };
function tone(f, d = .12, type = "square", g = .05, at = 0, f2) {
  if (muted) return; const a = ac(); if (!a) return; const t = a.currentTime + at;
  const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  key: () => tone(800, .03, "square", .03),
  spin: () => tone(110, .8, "sawtooth", .06, 0, 40),
  lock: () => { tone(1200, .05); tone(600, .08, "square", .05, .06); },
  arrive: () => { tone(660, .15); tone(990, .28, "square", .05, .16); },
  ok: () => { tone(520, .1); tone(780, .2, "square", .05, .1); },
  no: () => { tone(300, .12); tone(160, .28, "square", .05, .12); }
};
addEventListener("pointerdown", () => { ac(); startCompass(); }, { once: true });

/* ---------- dots ---------- */
const setDots = on => { document.documentElement.dataset.dots = on ? "1" : "0"; store.set("tm.dots", on ? "1" : "0"); };
setDots(store.get("tm.dots") === "1");

/* ---------- firebase ---------- */
const app = initializeApp(firebaseConfig);
const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence] });
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch { db = initializeFirestore(app, {}); }

/* ---------- open: 4-digit ID ---------- */
const hex = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const creds = async id => ({ email: (await hex("id:" + id)).slice(0, 24) + "@terminal.iosci.org", password: await hex("pw:" + id) });
const boxes = [...document.querySelectorAll("#boxes i")];
const idin = $("idin");
let busy = false, pendingId = null;

const setDigits = s => {
  boxes.forEach((b, i) => { b.textContent = s[i] || ""; b.classList.toggle("cur", i === s.length && s.length < 4); });
};
setDigits("");
const known = new Map();                       // id -> agent exists
async function exists(id) {
  if (known.has(id)) return known.get(id);
  try { const e = (await getDoc(doc(db, "agents", id))).exists(); known.set(id, e); return e; } catch { return null; }
}
let hseq = 0;
async function hint(s) {                         // highlight the button that fits this ID
  const my = ++hseq; $("bin").classList.remove("pri"); $("bnew").classList.remove("pri");
  if (s.length !== 4) return;
  const e = await exists(s); if (my !== hseq || e == null) return;
  $(e ? "bin" : "bnew").classList.add("pri");
}
const typed = () => idin.value.replace(/\D/g, "").slice(0, 4);
const fillId = s => { idin.value = s; setDigits(s); $("oerr").textContent = ""; hint(s); };
idin.addEventListener("input", () => { const s = typed(); fillId(s); sfx.key(); });

}

$("bset").addEventListener("click", () => {
  if (sheet.classList.contains("open") && sbody.dataset.k === "set") { closeSheet(); return; }
  const on = document.documentElement.dataset.dots === "1";
  openSheet('<div class="st"><span>dots</span><button id="sdots" class="o' + (on ? " on" : "") + '" type="button">' + (on ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>♪</span><button id="smute" class="o' + (!muted ? " on" : "") + '" type="button">' + (!muted ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>⏻</span><button id="sout" class="o" type="button">⏻</button></div>' +
    '<div class="st g"><span>' + BUILD + "</span></div>");
  sbody.dataset.k = "set";
  $("sdots").addEventListener("click", e => { const v = document.documentElement.dataset.dots !== "1"; setDots(v); applyDots(); e.currentTarget.classList.toggle("on", v); e.currentTarget.textContent = v ? "●" : "○"; });
  $("smute").addEventListener("click", e => { muted = !muted; store.set("tm.mute", muted ? "1" : "0"); e.currentTarget.classList.toggle("on", !muted); e.currentTarget.textContent = !muted ? "●" : "○"; sfx.key(); });
  $("sout").addEventListener("click", () => { signOut(auth).then(() => location.reload()).catch(() => location.reload()); });
});

/* ---------- help ---------- */
const HELP = [["⌖", "location on · allow"], ["◎", "spin → a point"], ["✎", "blind view first · draw + write"], ["▶", "go"],
  ["➤", "arrow up = straight on"], ["ⓦ ⓓ", "walk · drive route"], ["✕", "hold to end"], ["◉", "tap map: hide / show"],
  ["✓ ✕ ⌀", "there: write what is · matched / not / can't reach"], ["◎", "again · trail grows"],
  ["⊕", "all agents · ▲ ▼ rate"], ["≡", "your reports"], ["⚙", "dots · sound · exit"], ["◉", "benefit of mankind"]];
function openHelp() {
  if (sheet.classList.contains("open") && sbody.dataset.k === "help") { closeSheet(); return; }
  openSheet(HELP.map(h => '<div class="st hp"><span style="font-size:20px;min-width:3.2em">' + esc(h[0]) + "</span><span>" + esc(h[1]) + "</span></div>").join(""));
  sbody.dataset.k = "help";
}
$("bhelp").addEventListener("click", openHelp);
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 && !e.target.closest("#map")) e.preventDefault(); }, { passive: false });

/* ---------- daily line ---------- */
function daily() {
  const day = Math.floor(Date.now() / 864e5), t = LINES[day % LINES.length], l = $("line"); todayLine = t;
  if (store.get("tm.day") === String(day) || reduced) { l.textContent = t; l.classList.add("dim"); return; }
  store.set("tm.day", String(day)); l.classList.remove("dim"); l.textContent = "";
  [...t].forEach((ch, i) => setTimeout(() => { l.textContent += ch; if (i % 2 === 0) sfx.key(); }, 700 + i * 55));
  setTimeout(() => { if (!$("line").textContent.startsWith("location")) l.classList.add("dim"); }, 700 + t.length * 55 + 5000);
}

/* ---------- session ---------- */
onAuthStateChanged(auth, user => {
  if (!user) { $("app").hidden = true; $("open").hidden = false; busy = false; return; }
  if (hold) return;                              // new random ID: wait until it has been acknowledged
  boot(user);
});
function boot(user) {
  uid = user.uid; agent = user.displayName || pendingId || store.get("tm.id") || "";
  if (!/^\d{4}$/.test(agent)) { signOut(auth); return; }
  store.set("tm.id", agent);
  $("open").classList.add("out");
  setTimeout(() => {
    $("open").hidden = true; $("open").classList.remove("out"); $("app").hidden = false; $("me").textContent = agent;
    $("bmode").textContent = routeMode === "car" ? "ⓓ" : "ⓦ";
    initMap(); startGeo(); subMine(); daily(); route(); tickLoop();
    if (!store.get("tm.help")) { store.set("tm.help", "1"); setTimeout(openHelp, 400); }
    else if (!store.get("tm.spun")) $("bspin").classList.add("pulse1");
  }, reduced ? 0 : 280);
}
if (window.visualViewport) {                    // keep ▶ ✓ ✕ above the keyboard
  const f = () => document.documentElement.style.setProperty("--vh", visualViewport.height + "px");
  visualViewport.addEventListener("resize", f); visualViewport.addEventListener("scroll", f); f();
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));
</script>
</body>
