<title>Diksyonær</title>
<link rel="icon" type="image/png" href="dk-icon-48.png">
<link rel="apple-touch-icon" href="dk-icon-180.png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--fg:#fff;--soft:#d2d2d2;--mid:#8a8a8a;--dim:#5f5f5f;
  --line:#2a2a2a;--line2:#3a3a3a;--panel:#0d0d0d;--raised:#161616;--raised2:#1e1e1e;
  --accent:#b3a6d6;--accent-a:rgba(179,166,214,.16);--accent-b:rgba(179,166,214,.32);
  --ok:#86dcac;--ok-a:rgba(134,220,172,.13);--bad:#ff8f86;--bad-a:rgba(255,143,134,.13);--gold:#f3c969;--gold-a:rgba(243,201,105,.14);
  --r:14px;--r2:20px;--k:1;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --vh:100dvh;
  --on:#000;--onacc:#120f17;--accsh:#6f6690;--prish:#8f8f8f;--kbsh:#000;--fog0:rgba(0,0,0,0);--fog1:rgba(0,0,0,.85);
}
/* light theme: warm paper */
html.light{color-scheme:light;
  --bg:#faf6ee;--fg:#1c1813;--soft:#3e382f;--mid:#6f675b;--dim:#9b9284;
  --line:#e4ddcf;--line2:#d5ccba;--panel:#f3eee3;--raised:#fffdf8;--raised2:#f0eadd;
  --accent:#6b58a6;--accent-a:rgba(107,88,166,.12);--accent-b:rgba(107,88,166,.26);
  --ok:#1d8a50;--ok-a:rgba(29,138,80,.11);--bad:#c43d33;--bad-a:rgba(196,61,51,.1);--gold:#9a6a0a;--gold-a:rgba(190,140,30,.14);
  --on:#fff;--onacc:#fff;--accsh:#463a73;--prish:#5c5448;--kbsh:#cfc6b4;--fog0:rgba(250,246,238,0);--fog1:rgba(250,246,238,.9);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color-scheme:dark}
html.light{color-scheme:light}
body{background:var(--bg);color:var(--fg);font-family:'Libertinus Sans','Trebuchet MS','Segoe UI',Arial,sans-serif;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button,input,textarea{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:none;border:0;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
svg.fl,svg.i.fl{fill:url(#dkg);stroke:none}

/* shell */
#app{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh);display:flex;flex-direction:column;overflow:hidden;overflow:clip}
#top{flex:none;display:flex;align-items:center;gap:.5rem;padding:calc(.45rem + var(--st)) calc(.8rem + var(--sr)) .45rem calc(.8rem + var(--sl));border-bottom:1px solid var(--line);min-height:56px}
#top .ttl{display:flex;align-items:center;gap:.55rem;margin-right:auto;min-width:0}
#top h1{font-size:1.15rem;font-weight:400;white-space:nowrap;letter-spacing:.01em}
#logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
#logo svg.fl{width:36px;height:36px;display:block;filter:drop-shadow(0 1px 3px rgba(243,201,105,.25))}
.rb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:50%;transition:border-color .15s,background .15s,transform .1s;flex:none}
.rb:active{transform:scale(.9)}
@media(hover:hover){.rb:hover{border-color:var(--accent)}}
.pill{display:inline-flex;align-items:center;gap:.3rem;height:34px;padding:0 .7rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.pill svg.i{width:17px;height:17px}
.pill.fire{color:var(--gold)}
.pill.fire.off{color:var(--mid)}
#av{overflow:hidden}
#av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#av .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}

#mid{flex:1;min-height:0;display:flex;flex-direction:column}
#views{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:1fr;position:relative}
.view{min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#tabs{flex:none;display:flex;border-top:1px solid var(--line);padding:0 var(--sr) var(--sb) var(--sl)}
#tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;height:60px;color:var(--mid);font-size:.74rem;letter-spacing:.02em;position:relative;transition:color .15s}
#tabs button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#tabs button[aria-selected=true]{color:var(--fg)}
#tabs button[aria-selected=true]::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:2px}
#tabs svg.i{width:22px;height:22px}
#tabs button:active svg.i,#tabs button:active .x101{transform:scale(.9)}
.x101{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#ff86c0;color:#1b0711;font-family:'Arial Black','Helvetica Neue',Impact,'Segoe UI Black',sans-serif;font-weight:900;font-size:10px;letter-spacing:-.06em;line-height:1;box-shadow:0 2px 0 #b8507f;flex:none;transition:transform .1s}
#tabs button:not([aria-selected=true]) .x101{opacity:.72}
.x101.big{width:76px;height:76px;border-radius:20px;font-size:29px;letter-spacing:-.05em;box-shadow:0 6px 0 #b8507f,0 0 40px rgba(255,134,192,.25)}
body.wide #mid{flex-direction:row}
body.wide #tabs{order:-1;flex-direction:column;justify-content:flex-start;gap:.35rem;width:92px;border-top:0;border-right:1px solid var(--line);padding:.8rem .45rem calc(.8rem + var(--sb)) calc(.45rem + var(--sl))}
body.wide #tabs button{flex:none;height:70px;border-radius:16px}
body.wide #tabs button[aria-selected=true]{background:var(--panel)}
body.wide #tabs button[aria-selected=true]::before{top:22%;bottom:22%;left:-.45rem;right:auto;width:3px;height:auto}

/* learn */
#vLearn{padding:.7rem calc(.9rem + var(--sr)) .7rem calc(.9rem + var(--sl));flex-direction:row;gap:1rem}
.lmain{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.65rem}
.lside{display:none}
body.wide .lside{display:flex;flex-direction:column;gap:.75rem;width:min(360px,40%);flex:none;min-height:0}
body.wide .lmain .acts{display:none}
.lside .next{display:flex;flex-direction:column;gap:.55rem;padding:1rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2)}
.lside .next small{color:var(--mid);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.lside .next .ws{display:flex;flex-wrap:wrap;gap:.35rem}
.lside .next .ws span,.xnext .ws span{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-size:.95rem}
.lside .next .btn{margin-top:.25rem;height:54px}
.lside .week{display:flex;justify-content:space-between;gap:.3rem;padding:.8rem .9rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2)}
.lside .acts{grid-template-columns:1fr auto}
.ldots{display:flex;gap:.35rem}
.ldots i{flex:1;height:6px;border-radius:6px;background:var(--raised2)}
.ldots i.on{background:var(--accent)}
.ldots i.cur{background:var(--fg);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.stats{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.stat{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.stat b{display:block;font-size:1.1rem;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{display:block;color:var(--mid);font-size:.72rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--raised)}
.stat.fire .ic{color:var(--gold);background:var(--gold-a)}
.stat.goal .ic{background:none}
.stat.words .ic{color:var(--accent);background:var(--accent-a)}
.ring{width:30px;height:30px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--raised2)}
.ring .fgc{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}

.unit{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;position:relative}
.uh{flex:none;display:flex;align-items:center;gap:.4rem;padding:.6rem .6rem .5rem}
.uh .nm{flex:1;min-width:0;text-align:center;background:none;border:0;padding:.15rem .3rem;border-radius:10px}
.uh .nm small{display:block;color:var(--accent);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.uh .nm b{display:flex;align-items:center;justify-content:center;gap:.35rem;font-weight:400;font-size:1.15rem;letter-spacing:.02em}
.uh .nm b svg.ck{width:17px;height:17px;color:var(--gold);stroke-width:2.6}
.uh .nm .uw{display:block;color:var(--mid);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uh .rb[disabled]{opacity:.25;pointer-events:none}
.unit.gold{border-color:rgba(243,201,105,.45);box-shadow:inset 0 0 60px rgba(243,201,105,.05)}
.path{flex:1;min-height:0;position:relative}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.25rem;background:none;border:0}
.node .c{width:var(--ns,64px);height:var(--ns,64px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--raised);border:2px solid var(--line2);color:var(--dim);transition:transform .15s;position:relative}
.node .c svg.i{width:calc(var(--ns,64px)*.38);height:calc(var(--ns,64px)*.38)}
.node .c svg.fl{width:calc(var(--ns,64px)*.58);height:calc(var(--ns,64px)*.58)}
.node .c::after{content:'';position:absolute;inset:-2px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.55);z-index:-1}
.node .lb{font-size:.74rem;color:var(--mid);max-width:9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.done .c{background:var(--accent);border-color:var(--accent);color:#141118}
.node.open .c{background:var(--fg);border-color:var(--fg);color:var(--on)}
.node.open .c::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.8s ease-out infinite}
.node:active .c{transform:scale(.92)}
.node.lock .c{opacity:.75}
.node .go{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--on);font-size:.8rem;padding:.25rem .65rem;border-radius:999px;white-space:nowrap;animation:bobx 1.6s ease-in-out infinite}
.node .go::after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--fg)}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes bobx{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.path svg.trail path{fill:none;stroke:var(--line2);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.ulock{position:absolute;left:0;right:0;top:4.6rem;bottom:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--fog0),var(--fog1) 30%,var(--fog1) 70%,var(--fog0));z-index:2}
.ulock .btn{height:54px;padding:0 1.5rem;font-size:1.05rem}
.acts{flex:none;display:grid;grid-template-columns:1fr auto;gap:.5rem}
.btn .dot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:glow 1.4s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:50px;padding:0 1.1rem;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);font-size:1rem;letter-spacing:.01em;transition:transform .1s,background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn small{font-variant-numeric:tabular-nums;color:var(--mid);font-size:.85rem}
.btn.pri{background:var(--fg);color:var(--on);border-color:var(--fg);box-shadow:0 4px 0 var(--prish)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 #8f8f8f}
.btn.pri small{color:#444}
.btn.acc{background:var(--accent);color:var(--onacc);border-color:var(--accent);box-shadow:0 4px 0 var(--accsh)}
.btn.acc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accsh)}
.btn.acc small{color:#3b3550}
.btn.okb{background:var(--ok);color:#06170e;border-color:var(--ok);box-shadow:0 4px 0 #4c8f6a}
.btn.badb{background:var(--bad);color:#200805;border-color:var(--bad);box-shadow:0 4px 0 #a4554f}
.btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
.btn.ghost{background:none}
@media(hover:hover){.btn:not(.pri):not(.acc):not(.okb):not(.badb):hover{border-color:var(--accent)}}
.btn .cnt{display:inline-flex;min-width:1.5rem;height:1.5rem;padding:0 .4rem;border-radius:999px;align-items:center;justify-content:center;background:var(--accent);color:var(--onacc);font-size:.8rem;font-variant-numeric:tabular-nums}
.btn .cnt.z{background:var(--raised2);color:var(--mid)}

/* dictionary */
#vDict{padding:.7rem calc(.9rem + var(--sr)) .55rem calc(.9rem + var(--sl));gap:.5rem}
.sw{position:relative;flex:none}
.sw svg.mag{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--mid);width:18px;height:18px}
#q,#xq{width:100%;height:46px;padding:0 2.8rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:max(16px,1rem);outline:0;-webkit-appearance:none;appearance:none}
#q:focus,#xq:focus{border-color:var(--accent)}
#q::placeholder,#xq::placeholder{color:var(--dim)}
#q::-webkit-search-cancel-button,#xq::-webkit-search-cancel-button{display:none}
#qc{position:absolute;right:5px;top:5px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--mid)}
.chips{flex:none;display:flex;gap:.35rem;flex-wrap:nowrap;overflow:hidden}
.chip{flex:none;height:32px;padding:0 .75rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mid);font-size:.84rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.chip small{font-variant-numeric:tabular-nums;opacity:.7;font-size:.75rem}
.chip.more{margin-left:auto}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:.4rem;overflow:hidden;touch-action:pan-y}
.row{flex:none;display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.55rem .75rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:56px;transition:border-color .15s,transform .1s}
.row:active{transform:scale(.99);border-color:var(--accent)}
@media(hover:hover){.row:hover{border-color:var(--accent)}}
.row .tx{flex:1;min-width:0}
.row .w{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .w .p{font-size:.72rem;color:var(--mid);font-style:italic;margin-left:.4rem}
.row .m{font-size:.86rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sg{flex:none}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:4px;border-radius:1px;background:var(--raised2)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}.bars i:nth-child(5){height:14px}
.bars i.on{background:var(--accent)}
.bars.w1 i.on{background:var(--bad)}.bars.w2 i.on{background:var(--gold)}
.row .st{color:var(--gold);width:16px;height:16px}
.pager{flex:none;display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--mid);font-variant-numeric:tabular-nums;font-size:.88rem;height:40px}
.pager .rb{width:36px;height:36px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.empty svg.i{width:46px;height:46px;stroke-width:1.3}

/* overlays */
.ov{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh);z-index:50;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;overflow:clip}
.ov.dim{background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:calc(1rem + var(--st)) calc(1rem + var(--sr)) calc(1rem + var(--sb)) calc(1rem + var(--sl))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ov.in .card{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.ch{flex:none;display:flex;align-items:center;gap:.4rem;padding:.6rem .6rem .4rem}
.ch h2{flex:1;font-weight:400;font-size:1.1rem;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{flex:1;min-height:0;overflow:hidden;padding:.3rem 1.1rem 1.1rem}

/* entry */
.en .hw{font-size:calc(2rem*var(--k));line-height:1.1;overflow-wrap:anywhere}
.en .fm{color:var(--mid);font-size:calc(.95rem*var(--k));margin-top:.2rem}
.en .ps{display:inline-block;margin-top:.45rem;font-size:calc(.8rem*var(--k));color:var(--accent);border:1px solid var(--accent-b);border-radius:999px;padding:.05rem .55rem;font-style:italic}
.en .ss{margin-top:.8rem;display:flex;flex-direction:column;gap:calc(.65rem*var(--k))}
.en .s{display:flex;gap:.55rem}
.en .s .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:calc(.95rem*var(--k));min-width:1.1rem}
.en .s .g{font-size:calc(1.08rem*var(--k));color:var(--fg)}
.en .x{margin-top:.3rem;padding-left:.7rem;border-left:2px solid var(--line2)}
.en .x .kl{font-size:calc(1rem*var(--k));color:var(--soft)}
.en .x .tr{font-size:calc(.88rem*var(--k));color:var(--mid);margin-top:.1rem}
.en .lv{display:flex;align-items:center;gap:.6rem;margin-top:1rem;padding:.6rem .75rem;background:var(--raised);border-radius:12px;color:var(--mid);font-size:calc(.86rem*var(--k))}
.en .lv .bars{height:16px}
.epg{flex:none;display:flex;justify-content:center;gap:.4rem;padding:0 0 .8rem}
.epg i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.epg i.on{background:var(--accent)}
.tk{cursor:pointer;border-radius:4px;transition:background .15s}
.tk:active,.tk.on{background:var(--accent-a)}
.tk.hl{color:var(--accent)}
#tip{position:fixed;z-index:90;max-width:min(280px,80vw);background:var(--raised2);border:1px solid var(--line2);border-radius:12px;padding:.5rem .7rem;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;animation:pop .15s}
#tip b{font-weight:400;color:var(--accent);margin-right:.35rem}
#tip small{color:var(--mid);font-style:italic;margin-right:.35rem}

/* sheet */
.sheet .cb{display:flex;flex-direction:column;gap:.75rem}
.acct{display:flex;align-items:center;gap:.8rem;padding:.75rem;background:var(--raised);border-radius:var(--r)}
.acct .ph{width:46px;height:46px;border-radius:50%;background:var(--accent-a);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.2rem;overflow:hidden;flex:none}
.acct .ph img{width:100%;height:100%;object-fit:cover}
.acct .nm{flex:1;min-width:0}
.acct .nm b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .nm small{display:block;color:var(--mid);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtn{display:flex;align-items:center;justify-content:center;gap:.65rem;height:50px;border-radius:var(--r);background:var(--fg);color:var(--on);font-size:1rem;width:100%}
.gbtn svg{width:20px;height:20px}
.srow{display:flex;align-items:center;gap:.6rem;min-height:44px}
.srow .lb{flex:1;color:var(--soft)}
.seg{display:flex;gap:.3rem}
.seg button{height:34px;min-width:44px;padding:0 .6rem;border-radius:999px;border:1px solid var(--line);color:var(--mid);font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.tg{width:50px;height:30px;border-radius:999px;background:var(--raised2);border:1px solid var(--line2);position:relative;transition:background .2s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mid);transition:transform .2s,background .2s}
.tg[aria-pressed=true]{background:var(--accent-b)}
.tg[aria-pressed=true]::after{transform:translateX(20px);background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.kv div{background:var(--raised);border-radius:12px;padding:.55rem .6rem;text-align:center}
.kv b{display:block;font-weight:400;font-size:1.15rem;font-variant-numeric:tabular-nums}
.kv small{color:var(--mid);font-size:.72rem}
.lnk{color:var(--mid);font-size:.86rem;text-decoration:underline;text-underline-offset:3px;padding:.3rem;align-self:center}
.lnk.red{color:var(--bad)}

/* unit grid */
.ugrid{display:grid;grid-template-columns:repeat(var(--uc,9),1fr);gap:calc(.3rem*var(--k))}
.ugrid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:calc(.78rem*var(--k));color:var(--mid);font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.ugrid button i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.ugrid button.done{background:var(--accent-a);color:var(--fg);border-color:var(--accent-b)}
.ugrid button.cur{background:var(--fg);color:var(--on);border-color:var(--fg)}
.ugrid button.core{box-shadow:inset 0 0 0 1px var(--accent-b)}
.ugrid button.sel{outline:2px solid var(--accent);outline-offset:1px}

/* player */
#pl{z-index:60}
.ph{flex:none;display:flex;align-items:center;gap:.7rem;padding:calc(.55rem + var(--st)) calc(.9rem + var(--sr)) .4rem calc(.9rem + var(--sl));max-width:760px;width:100%;margin:0 auto}
.pbar{flex:1;height:12px;background:var(--raised2);border-radius:999px;overflow:hidden;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.pbar i::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.combo{display:flex;align-items:center;gap:.2rem;color:var(--gold);font-variant-numeric:tabular-nums;font-size:.9rem;min-width:2.6rem;justify-content:flex-end;transition:transform .2s}
.combo.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.hearts{display:flex;gap:.15rem;color:var(--bad)}
.hearts svg.i{width:20px;height:20px}
.hearts .lost{color:var(--line2)}
.stage{flex:1;min-height:0;width:100%;max-width:760px;margin:0 auto;padding:clamp(.5rem,3.2vh,2rem) calc(1.15rem + var(--sr)) .5rem calc(1.15rem + var(--sl));display:flex;flex-direction:column;justify-content:flex-start;gap:calc(1.05rem*var(--k));overflow:hidden;position:relative}
.stage.mid{justify-content:center}
.stage.enter{animation:slin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slin{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.pf{flex:none;width:100%;max-width:760px;margin:0 auto;padding:.6rem calc(1.1rem + var(--sr)) calc(.9rem + var(--sb)) calc(1.1rem + var(--sl));display:flex;gap:.6rem}
.pf .btn{flex:1;height:54px;font-size:1.05rem}
.fb{position:absolute;left:0;right:0;bottom:0;z-index:5;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;background:var(--raised);border-top:1px solid var(--line)}
.fb.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.fb.ok{background:#0c1d14;border-color:#1f4a33}
.fb.bad{background:#240f0d;border-color:#53241f}
.fb .in{max-width:760px;margin:0 auto;padding:.9rem calc(1.1rem + var(--sr)) calc(.9rem + var(--sb)) calc(1.1rem + var(--sl));display:flex;flex-direction:column;gap:.6rem}
.fb .hd{display:flex;align-items:center;gap:.6rem;font-size:1.2rem}
.fb.ok .hd{color:var(--ok)}
.fb.bad .hd{color:var(--bad)}
.fb .hd .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.fb.ok .hd .ic{background:var(--ok);color:#06170e;animation:pop .3s cubic-bezier(.2,.9,.3,1.4)}
.fb.bad .hd .ic{background:var(--bad);color:#200805}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.fb .ans{font-size:1.08rem;color:var(--fg)}
.fb .ans .df{background:rgba(255,143,134,.28);border-radius:3px}
.fb .ans .dk{background:rgba(134,220,172,.25);border-radius:3px}
.fb .sub{color:var(--mid);font-size:.92rem}
.fb .row2{display:flex;gap:.6rem;align-items:center}
.fb .row2 .btn{flex:1;height:54px}
.fb .lnk{align-self:flex-start;padding:0}

/* exercise parts */
.pr{display:flex;flex-direction:column;gap:calc(.35rem*var(--k))}
.pr .big{font-size:calc(2.6rem*var(--k));line-height:1.1;overflow-wrap:anywhere}
.pr .md{font-size:calc(1.55rem*var(--k));line-height:1.32;overflow-wrap:anywhere}
.pr .sm{font-size:calc(1.05rem*var(--k));color:var(--mid)}
.pr .lg{font-size:calc(1.75rem*var(--k));line-height:1.35;overflow-wrap:anywhere}
.bubble{position:relative;align-self:flex-start;max-width:100%;padding:calc(.9rem*var(--k)) calc(1.15rem*var(--k));border:1px solid var(--line2);border-radius:20px 20px 20px 6px;background:var(--panel)}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:.35rem;font-size:calc(.75rem*var(--k));letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.tag svg.i{width:15px;height:15px}
.newt{color:var(--gold)}
.intro{display:flex;flex-direction:column;gap:calc(.8rem*var(--k));align-items:center;text-align:center}
.intro .hw{font-size:calc(3.6rem*var(--k));line-height:1.05;overflow-wrap:anywhere;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.intro .newt{align-self:center;width:calc(2.4rem*var(--k));height:calc(2.4rem*var(--k));border-radius:50%;background:var(--gold-a);justify-content:center}
.intro .newt svg.i{width:55%;height:55%}
.intro .fm{color:var(--mid);font-size:calc(1rem*var(--k))}
.intro .ps{font-size:calc(.8rem*var(--k));color:var(--accent);border:1px solid var(--accent-b);border-radius:999px;padding:.05rem .6rem;font-style:italic}
.intro .gl{font-size:calc(1.6rem*var(--k));color:var(--soft);line-height:1.3}
.intro .ex{margin-top:calc(.4rem*var(--k));padding:calc(.8rem*var(--k)) calc(1rem*var(--k));border:1px solid var(--line);border-radius:16px;background:var(--panel);max-width:100%}
.intro .ex{width:100%}
.intro .ex .kl{font-size:calc(1.3rem*var(--k))}
.intro .ex .tr{font-size:calc(1.02rem*var(--k));color:var(--mid);margin-top:.3rem}
.ans-line{--lh:calc(3.55rem*var(--k));min-height:calc(var(--lh)*2);display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;column-gap:calc(.45rem*var(--k));row-gap:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 2px),var(--line2) calc(var(--lh) - 2px),var(--line2) var(--lh));transition:background .2s}
.ans-line>*{margin:calc(.3rem*var(--k)) 0}
.ans-line .fxw{font-size:calc(1.3rem*var(--k));color:var(--mid);padding:0 .1rem;line-height:calc(2.95rem*var(--k))}
.bank{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:calc(.55rem*var(--k));min-height:calc(3.2rem*var(--k));margin-top:auto;padding-bottom:calc(.4rem*var(--k))}
.tile{height:calc(2.95rem*var(--k));padding:0 calc(1rem*var(--k));border-radius:13px;border:1px solid var(--line2);background:var(--raised);font-size:calc(1.28rem*var(--k));box-shadow:0 3px 0 var(--line2);transition:transform .1s,opacity .15s,background .15s,border-color .15s;white-space:nowrap;touch-action:none}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.tile.ghost{visibility:hidden}
.tile.used{opacity:0;pointer-events:none}
.tile.drag{position:fixed;z-index:100;pointer-events:none;box-shadow:0 12px 26px rgba(0,0,0,.6);border-color:var(--accent);transform:scale(1.06)}
.ans-line .tile{background:var(--raised2)}
.ans-line.ok .tile{border-color:var(--ok);color:var(--ok)}
.ans-line.bad .tile{border-color:var(--bad)}
.ins{width:3px;height:calc(2.4rem*var(--k));background:var(--accent);border-radius:3px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:calc(.7rem*var(--k));margin:auto 0}
.mt{min-height:calc(4.1rem*var(--k));padding:calc(.45rem*var(--k)) calc(.75rem*var(--k));border-radius:16px;border:1px solid var(--line2);background:var(--raised);font-size:calc(1.12rem*var(--k));color:var(--soft);box-shadow:0 3px 0 var(--line2);transition:transform .12s,background .15s,border-color .15s,opacity .3s,color .15s;line-height:1.2;overflow-wrap:anywhere}
.mt.kl{font-size:calc(1.35rem*var(--k));color:var(--fg)}
.mt.sel{border-color:var(--accent);background:var(--accent-a);color:var(--fg)}
.mt.good{border-color:var(--ok);background:var(--ok-a);color:var(--ok);animation:pop .25s}
.mt.gone{opacity:.25;pointer-events:none;box-shadow:none}
.mt.no{border-color:var(--bad);background:var(--bad-a);animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.field{width:100%;min-height:calc(3.8rem*var(--k));padding:calc(.75rem*var(--k)) 1.1rem;border-radius:16px;border:1px solid var(--line2);background:var(--panel);font-size:max(16px,calc(1.4rem*var(--k)));outline:0;resize:none;line-height:1.35}
.field:focus{border-color:var(--accent)}
.field.ok{border-color:var(--ok);color:var(--ok)}
.field.bad{border-color:var(--bad);color:var(--bad)}
textarea.field{height:calc(6rem*var(--k))}
.akeys{display:flex;flex-wrap:wrap;gap:.38rem;justify-content:center;margin-top:auto}
.akeys button{width:calc(2.55rem*var(--k));height:calc(2.55rem*var(--k));min-width:34px;min-height:34px;border-radius:11px;border:1px solid var(--line);background:var(--raised);font-size:1.12rem;box-shadow:0 2px 0 var(--line)}
.akeys button:active{background:var(--accent-a);border-color:var(--accent)}
.blank{display:inline-block;vertical-align:baseline;min-width:3ch;border:0;border-bottom:2px solid var(--accent);background:var(--accent-a);border-radius:6px 6px 0 0;padding:0 .3rem;font-size:inherit;outline:0;text-align:center;color:var(--fg)}
.blank.ok{border-color:var(--ok);background:var(--ok-a);color:var(--ok)}
.blank.bad{border-color:var(--bad);background:var(--bad-a);color:var(--bad)}
.speak{display:flex;flex-direction:column;align-items:center;gap:calc(1.3rem*var(--k));text-align:center}
.speak .bubble{border-radius:20px}
.mic{width:calc(5.2rem*var(--k));height:calc(5.2rem*var(--k));border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-a);color:var(--accent);position:relative}
.mic svg.i{width:44%;height:44%}
.mic::before,.mic::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent-b);animation:ripple 2.2s ease-out infinite}
.mic::after{animation-delay:1.1s}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0}}
.reveal{animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
.reveal .kl{font-size:calc(1.9rem*var(--k));color:var(--accent);line-height:1.3}

/* results */
.res{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1rem*var(--k));text-align:center}
.res .medal{width:calc(7rem*var(--k));height:calc(7rem*var(--k));border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,var(--accent-b),transparent 70%);animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
.res .medal svg.fl{width:70%;height:70%}
.res .medal.gold{background:radial-gradient(circle,rgba(243,201,105,.45),transparent 70%)}
.res h2{font-weight:400;font-size:calc(1.8rem*var(--k))}
.res .tiles2{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;width:100%;max-width:320px}
.res .tiles2 div{border:2px solid var(--line2);border-radius:16px;padding:calc(.55rem*var(--k)) .4rem;overflow:hidden}
.res .tiles2 small{display:block;font-size:calc(.72rem*var(--k));letter-spacing:.08em;text-transform:uppercase;padding-bottom:.25rem}
.res .tiles2 b{display:block;font-weight:400;font-size:calc(1.45rem*var(--k));font-variant-numeric:tabular-nums}
.res .tiles2 .a{border-color:var(--ok)}.res .tiles2 .a small{color:var(--ok)}
.res .tiles2 .s{border-color:var(--gold)}.res .tiles2 .s small{color:var(--gold)}
.res .wl{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;max-width:540px}
.res .wl .wc{display:inline-flex;align-items:center;gap:.35rem;padding:calc(.3rem*var(--k)) .75rem;border-radius:999px;background:var(--raised);border:1px solid var(--line2);font-size:calc(1rem*var(--k));color:var(--fg)}
.res .wl .wc:active{border-color:var(--accent)}
.res .gm{display:flex;align-items:center;gap:.45rem;color:var(--gold);font-size:calc(1.05rem*var(--k));animation:rise .6s .4s ease-out both}
.res .gm svg.i{width:20px;height:20px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%) translateY(20px);background:var(--raised2);border:1px solid var(--line2);border-radius:999px;padding:.55rem 1rem;font-size:.92rem;opacity:0;transition:opacity .2s,transform .2s;z-index:99;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;background:var(--bg);transition:opacity .35s}
#boot svg.fl{width:96px;height:96px;animation:breathe 1.6s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(243,201,105,.3))}
#boot.out{opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.6}50%{transform:scale(1);opacity:1}}

/* wide layouts */
.week div{display:flex;flex-direction:column;align-items:center;gap:.3rem;font-size:.72rem;color:var(--mid)}
.week i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.week i.on{background:var(--gold);border-color:var(--gold);color:#251a00}
.week i.td{border-color:var(--accent)}
.week i svg.i{width:14px;height:14px;stroke-width:2.6}
body.wide .ov.dim .card{width:min(600px,100%)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:calc(2.7rem*var(--k));height:calc(2.7rem*var(--k));min-width:34px;min-height:34px;border-radius:50%;background:var(--accent-a);color:var(--accent);flex:none;vertical-align:middle;transition:transform .1s,background .15s;border:0;padding:0}
.spk:active{transform:scale(.88);background:var(--accent-b)}
.spk svg.i{width:52%;height:52%}
.spk.sm{width:calc(2.1rem*var(--k));height:calc(2.1rem*var(--k));min-width:30px;min-height:30px}
.spk.fbs{margin-left:.4rem;width:38px;height:38px}
body:not(.tts) .spk{display:none}
.hwrow{display:flex;align-items:center;gap:.7rem;justify-content:center;max-width:100%}
#kbx{flex:none;width:100%}
.kb{max-width:760px;margin:0 auto;padding:.35rem calc(.3rem + var(--sr)) .15rem calc(.3rem + var(--sl));display:flex;flex-direction:column;gap:clamp(4px,.8vh,7px)}
.kb .r{display:flex;gap:clamp(3px,1vw,6px);justify-content:center}
.kb button{flex:1;max-width:50px;height:clamp(34px,5.3vh,46px);border-radius:9px;background:var(--raised2);border:1px solid var(--line2);font-size:1.15rem;box-shadow:0 2px 0 var(--kbsh);color:var(--fg);padding:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.kb .r.acc button{color:var(--accent);background:var(--raised)}
.kb button.wide{max-width:none;flex:6}
.kb button.mid{max-width:none;flex:1.7}
.kb button.ent{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.kb button.dn{background:var(--accent-b);transform:translateY(1px);box-shadow:none}
.kb button svg.i{width:20px;height:20px}
.mic.btnm{cursor:pointer;border:0}
.mic.idle::before,.mic.idle::after{animation:none;opacity:0}
.mic.on{background:var(--bad-a);color:var(--bad)}
.mic.on::before,.mic.on::after{border-color:rgba(255,143,134,.55);animation-duration:1.1s}
.heard{font-size:calc(1.15rem*var(--k));color:var(--mid);min-height:1.5em;font-style:italic}
.heard.bad{color:var(--bad)}
.gate{z-index:80;align-items:center;justify-content:center;padding:1.5rem}
.gc{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;width:min(360px,100%)}
.gc svg.fl{width:104px;height:104px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 0 24px rgba(243,201,105,.3))}
.gc h2{font-weight:400;font-size:1.7rem}
.gc p{color:var(--mid);font-size:1rem}
.gc small{color:var(--bad);min-height:1.2em}
.gc .btn,.gc .gbtn{width:100%}
.gg{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);align-items:center;justify-content:center;font-size:.85rem}
.ov#quit{z-index:95}
.dkb{flex:0 0 auto!important;padding:0 1rem;color:var(--mid);font-size:.95rem!important}
.btn.sq{width:50px;padding:0;color:var(--gold)}
.combo.low{color:var(--bad);animation:bump .5s infinite}
.node.trophy .c{border-radius:30%}
.node.trophy.open .c{background:var(--gold);border-color:var(--gold);color:#2a1f00}
.node.trophy.done .c{background:var(--gold-a);border-color:var(--gold);color:var(--gold)}
.play{display:flex;align-items:center;justify-content:center;gap:1rem;padding:calc(.4rem*var(--k)) 0}
.pbig{width:calc(5.4rem*var(--k));height:calc(5.4rem*var(--k));border-radius:24px;background:var(--accent);color:var(--onacc);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--accsh);transition:transform .1s}
.pbig:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accsh)}
.pbig svg.i{width:46%;height:46%}
.pbig.go{animation:bump .4s}
.pslow{width:calc(3.4rem*var(--k));height:calc(3.4rem*var(--k));border-radius:18px;background:var(--accent-a);color:var(--accent);display:flex;align-items:center;justify-content:center}
.pslow svg.i{width:55%;height:55%}
body:not(.tts) .play{display:none}
.nolisten{align-self:center;display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--soft);font-size:calc(.92rem*var(--k));flex:none}
.nolisten svg.i{width:17px;height:17px}
.fb .ans .ys{margin-top:.2rem;color:var(--mid);text-decoration:line-through;text-decoration-color:rgba(255,143,134,.5);font-size:.95em}

.gmed svg.fl{position:relative;width:62%;height:62%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));animation:fleurin 1.2s .35s cubic-bezier(.2,.9,.3,1.35) both}
.gmed .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);transform:translateX(-120%);animation:shine 1.4s 1.1s ease-in-out both}
.gring{position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(243,201,105,.6);animation:ring 1.6s .5s ease-out infinite}
@keyframes medal{0%{transform:scale(0) rotate(-120deg);opacity:0}60%{transform:scale(1.12) rotate(8deg);opacity:1}100%{transform:none}}

body.wide #vLearn{padding:.8rem calc(.9rem + var(--sr)) .8rem .9rem}
.lmain{position:relative}
.map{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
body.wide .map{border-radius:var(--r2);border:1px solid var(--line)}
.mapin{position:relative;width:100%}
.mbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:.5rem;align-items:center;padding:.6rem calc(.9rem + var(--sr)) .7rem calc(.9rem + var(--sl));background:linear-gradient(transparent,rgba(0,0,0,.75) 45%);pointer-events:none}
.mbar>*{pointer-events:auto}
.mbar .acts{flex:1}
.mbar .here{width:52px;height:52px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--line2);animation:pop .3s}
body.wide .mbar .acts{display:none}
body.wide .mbar{background:none;justify-content:flex-end}
.dist{position:absolute;left:0;right:0;overflow:hidden}
.dist .sky{position:absolute;inset:0}
.dist::after{content:'';position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,var(--nextc,transparent));pointer-events:none}
.dban{position:absolute;left:50%;top:34px;transform:translateX(-50%);min-width:200px;padding:.7rem 1.6rem .8rem;text-align:center;border-radius:18px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:2}
.dban .dn{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dc,#f3c969)}
.dban b{display:block;font-weight:400;font-size:1.65rem;line-height:1.15;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.dban small{display:block;color:rgba(255,255,255,.7);font-size:.85rem}
.dban .seal{position:absolute;right:-14px;top:-14px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d2,#f3c969 45%,#b47c1f);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.dban .seal svg.fl{width:24px;height:24px;fill:#3a2808}
.prop{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));animation:bob 4.2s ease-in-out infinite}
.prop.a1{animation-name:sway;animation-duration:5s}.prop.a2{animation-name:bob;animation-duration:3.6s}.prop.a3{animation-name:drift;animation-duration:7s}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px) rotate(4deg)}}
.dist:not(.live) *,.dist:not(.live)::before{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.dist *,.un *{animation:none!important}}
.road{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible}
.road path{fill:none;stroke-linecap:round}
.road .r0{stroke:rgba(0,0,0,.45);stroke-width:30}
.road .r1{stroke:rgba(255,255,255,.18);stroke-width:22;stroke-dasharray:2 14}
.road .r2{stroke:#f3c969;stroke-width:8;opacity:.85;filter:drop-shadow(0 0 6px rgba(243,201,105,.6))}
.un{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.3rem;-webkit-tap-highlight-color:transparent}
.un .c{position:relative;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1c1c22;border:3px solid rgba(255,255,255,.25);box-shadow:0 7px 0 rgba(0,0,0,.45),0 12px 24px rgba(0,0,0,.35);transition:transform .12s}
.un:active .c{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.un .c img.pic{width:46px;height:46px}
.un .c svg.i{width:28px;height:28px;color:rgba(255,255,255,.55)}
.un .c svg.fl{width:44px;height:44px}
.un .lb{font-size:.74rem;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.5);border-radius:999px;padding:.08rem .55rem;white-space:nowrap}
.un.done .c{background:radial-gradient(circle at 35% 30%,#fff6d2,#f3c969 50%,#b47c1f);border-color:#ffe7a0}
.un.done .ck{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#2a1d06;border:2px solid #f3c969;display:flex;align-items:center;justify-content:center}
.un.done .ck svg.i{width:13px;height:13px;color:#f3c969;stroke-width:3}
.un.open .c{background:var(--fg)}
.un.cur .c{background:#fff;border-color:#fff;width:84px;height:84px}
.un.cur .c img.pic{width:56px;height:56px;animation:bob 2.4s ease-in-out infinite}
.un.cur .pr{position:absolute;top:-10px;left:50%;width:104px;height:104px;transform:translateX(-50%) rotate(-90deg);pointer-events:none}
.un.cur .pr circle{fill:none;stroke-width:5}
.un.cur .pr .b{stroke:rgba(255,255,255,.2)}
.un.cur .pr .f{stroke:#f3c969;stroke-linecap:round;transition:stroke-dashoffset .8s}
.un.cur .go{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-size:.9rem;padding:.3rem .8rem;border-radius:12px;white-space:nowrap;animation:hop 1.5s ease-in-out infinite;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.un.cur .go::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.un.lock .c{background:#141418;border-color:rgba(255,255,255,.12)}
.un.reveal .c{animation:unlockpop .9s cubic-bezier(.2,.9,.3,1.5)}
@keyframes unlockpop{0%{transform:scale(.4);filter:brightness(3)}60%{transform:scale(1.18)}100%{transform:none}}
.fog{position:absolute;left:-10%;right:-10%;height:300px;z-index:4;pointer-events:none;background:linear-gradient(var(--fog0),var(--fog1) 55%,var(--bg) 80%)}
.fog i{position:absolute;width:60%;height:120px;border-radius:50%;background:radial-gradient(ellipse,rgba(200,200,220,.18),transparent 70%);animation:fogm 14s ease-in-out infinite}
.fog i:nth-child(1){left:0;top:70px}.fog i:nth-child(2){left:40%;top:120px;animation-delay:-5s}.fog i:nth-child(3){left:15%;top:170px;animation-delay:-9s}
@keyframes fogm{50%{transform:translateX(12%)}}
.map-king{position:absolute;z-index:3;width:92px;height:115px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));animation:bob 3s ease-in-out infinite}
.map-say{position:absolute;z-index:3;background:#fff;color:#000;font-size:.82rem;line-height:1.3;max-width:min(150px,calc(50% - 60px));font-size:.76rem;cursor:pointer;padding:.45rem .65rem;border-radius:14px 14px 14px 4px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
svg.king{display:block}

/* district scenery */
.d-bayou .sky{background:radial-gradient(ellipse at 20% 0%,rgba(140,220,170,.18),transparent 55%),linear-gradient(#0b2a22,#10382c 40%,#0d3a3a 75%,#0b2e33)}
.d-pleri .sky{background:radial-gradient(circle at 85% 6%,rgba(255,220,120,.45),transparent 30%),linear-gradient(#2a3b14,#4a5a1c 35%,#6b6a20 70%,#3e4a14)}
.d-lavil .sky{background:radial-gradient(ellipse at 50% 0%,rgba(180,120,255,.25),transparent 60%),linear-gradient(#1a0f2e,#2a1546 45%,#3a1a4a 80%,#1f1030)}
.d-lamaer .sky{background:radial-gradient(circle at 80% 4%,rgba(255,250,200,.35),transparent 28%),linear-gradient(#0d3a66,#0f5788 40%,#1b7aa5 70%,#c9b27a 96%)}
.d-kann .sky{background:radial-gradient(circle at 50% 4%,rgba(255,150,80,.5),transparent 35%),linear-gradient(#3a1a1a,#6a2c1c 35%,#3e4a18 70%,#25300f)}
.d-dibwa .sky{background:radial-gradient(ellipse at 30% 0%,rgba(255,170,80,.25),transparent 50%),linear-gradient(#2a1608,#3e2410 40%,#2e3a14 75%,#1d2a0e)}
.d-lafet .sky{background:radial-gradient(circle at 15% 10%,rgba(160,80,220,.45),transparent 35%),radial-gradient(circle at 85% 40%,rgba(80,200,120,.3),transparent 35%),radial-gradient(circle at 30% 80%,rgba(243,201,105,.35),transparent 35%),linear-gradient(#2a0f3a,#1a1030)}
.d-sipri .sky{background:radial-gradient(circle at 78% 5%,rgba(230,235,255,.4),transparent 14%),linear-gradient(#050a1c,#0a1530 45%,#0b2026 80%,#071418)}
.d-riv .sky{background:radial-gradient(circle at 50% 2%,rgba(255,190,90,.6),transparent 30%),linear-gradient(#4a1f2a,#8a3a2c 30%,#3a3a5a 60%,#1c2a4a)}
.d-bayou{--dc:#9be3b5}.d-pleri{--dc:#ffe08a}.d-lavil{--dc:#d6b0ff}.d-lamaer{--dc:#9fe0ff}.d-kann{--dc:#ffb27a}.d-dibwa{--dc:#ffc27a}.d-lafet{--dc:#f3c969}.d-sipri{--dc:#cfd8ff}.d-riv{--dc:#ffcf8a}
.fx{position:absolute;inset:0;pointer-events:none}
.fx i{position:absolute;display:block}
.fx-flies i,.fx-stars i{width:6px;height:6px;border-radius:50%;background:#e9ff9a;box-shadow:0 0 10px 3px rgba(220,255,120,.7);animation:fly 6s ease-in-out infinite;transform:scale(var(--s))}
.fx-stars i{background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.6);width:3px;height:3px;animation:twinkle 3s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0) scale(var(--s));opacity:.2}25%{opacity:1}50%{transform:translate(22px,-18px) scale(var(--s));opacity:.4}75%{transform:translate(-14px,10px) scale(var(--s));opacity:1}}
@keyframes twinkle{50%{opacity:.15}}
.fx-grass i{width:3px;height:26px;border-radius:3px;background:linear-gradient(#e8d070,#8a8a20);transform-origin:bottom;animation:sway 3s ease-in-out infinite;opacity:.6}
.fx-notes i::before{content:'♪';color:rgba(230,200,255,.75);font-size:calc(22px*var(--s))}
.fx-notes i{animation:floatup 5s linear infinite}
.fx-notes i:nth-child(2n)::before{content:'♫'}
@keyframes floatup{0%{transform:translateY(20px);opacity:0}20%{opacity:1}100%{transform:translateY(-90px);opacity:0}}
.fx-waves i{width:120px;height:14px;border-radius:50%;border-top:3px solid rgba(255,255,255,.35);animation:wave 4s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(26px)}}
.fx-smoke i{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(220,200,190,.25),transparent 70%);animation:floatup 7s linear infinite;transform:scale(var(--s))}
.fx-leaves i{width:12px;height:8px;border-radius:0 80% 0 80%;background:#e07a2a;animation:fall 7s linear infinite}
.fx-leaves i:nth-child(3n){background:#c9452a}.fx-leaves i:nth-child(3n+1){background:#f0b030}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(40px,160px) rotate(300deg);opacity:0}}
.fx-confetti i{width:7px;height:11px;border-radius:2px;background:#f3c969;animation:fall 5s linear infinite}
.fx-confetti i:nth-child(3n){background:#9b5de5}.fx-confetti i:nth-child(3n+1){background:#3fbf7f}

/* unit screen and notes */
.unitc,.notec{position:relative;overflow:hidden}
.unitc::before,.notec::before{content:'';position:absolute;inset:0;opacity:.35;pointer-events:none}
.unitc.d-bayou::before,.notec.d-bayou::before{background:linear-gradient(#10382c,transparent 60%)}
.unitc.d-pleri::before,.notec.d-pleri::before{background:linear-gradient(#4a5a1c,transparent 60%)}
.unitc.d-lavil::before,.notec.d-lavil::before{background:linear-gradient(#2a1546,transparent 60%)}
.unitc.d-lamaer::before,.notec.d-lamaer::before{background:linear-gradient(#0f5788,transparent 60%)}
.unitc.d-kann::before,.notec.d-kann::before{background:linear-gradient(#6a2c1c,transparent 60%)}
.unitc.d-dibwa::before,.notec.d-dibwa::before{background:linear-gradient(#3e2410,transparent 60%)}
.unitc.d-lafet::before,.notec.d-lafet::before{background:linear-gradient(#3a1050,transparent 60%)}
.unitc.d-sipri::before,.notec.d-sipri::before{background:linear-gradient(#0a1530,transparent 60%)}
.unitc.d-riv::before,.notec.d-riv::before{background:linear-gradient(#8a3a2c,transparent 60%)}
.ov#unit .card,.ov#notes .card{height:100%}
.ut{flex:1;text-align:center;min-width:0}
.ut small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ut b{display:block;font-weight:400;font-size:1.2rem}
.ch .nb{position:relative}
.ch .nb.has::after{content:'';position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.cb.ub{display:flex;flex-direction:column;gap:.6rem;position:relative}
.uw{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.uw span{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-size:.92rem}
.cb.ub .path{flex:1;min-height:300px}
#uJ{display:flex;justify-content:center}
.ov#unit{z-index:55}
.ov#notes,.ov#listen{z-index:58}
.ov#listen .card{height:100%}
.notec .np{flex:1;min-height:0;padding:.3rem 1rem}
.notec .gnav{padding-bottom:calc(.4rem + var(--sb))}
.gex.kp .r{grid-template-columns:auto minmax(0,1.05fr) minmax(0,1fr);align-items:center}
.gex.kp img.kpi{width:2.4rem;height:2.4rem}
@media (max-width:560px){.gex.kp .r{grid-template-columns:auto 1fr}.gex.kp .e{grid-column:2}}

/* proverbs */
.pvc{display:flex;align-items:center;gap:.8rem;padding:calc(.8rem*var(--k)) .9rem;background:var(--panel);border:1px solid rgba(243,201,105,.3);border-radius:var(--r2)}
.pvc img.pvi{width:calc(3rem*var(--k));height:calc(3rem*var(--k));flex:none}
.pvt{flex:1;min-width:0}
.pvt b{display:block;font-weight:400;font-size:1.1rem;color:var(--gold)}
.pvt .pvsrc{display:block;font-style:normal;color:var(--soft);opacity:.8;font-size:.72rem;line-height:1.25;margin:.05rem 0 .15rem}
.pvt .pvsrc em{font-style:italic}
.pvt small{display:block;color:var(--soft);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvc .btn{height:44px;padding:0 1rem}
.res .pvr{max-width:520px;text-align:center;display:flex;flex-direction:column;gap:.3rem;padding:.8rem 1rem;border:1px solid rgba(243,201,105,.35);border-radius:16px;background:var(--gold-a)}
.res .pvr .k{color:var(--gold);font-size:calc(1.2rem*var(--k))}
.res .pvr .e{color:var(--fg);font-size:calc(1rem*var(--k))}
.res .pvr .m{color:var(--mid);font-size:calc(.9rem*var(--k));font-style:italic}
.story .nt{color:var(--gold);font-style:italic;font-size:calc(.95rem*var(--k));margin-top:.2rem}
.story.one{align-items:center;text-align:center}
.row.pvrow{align-items:flex-start;cursor:default}
.row.pvrow .m2{color:var(--dim);font-size:.82rem;font-style:italic}
.row.pvrow img.pic.xs{width:2rem;height:2rem}
.gc svg.king{width:120px;height:150px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
.gold .gking{position:absolute;z-index:3;width:min(28vw,120px);height:min(35vw,150px);left:6%;bottom:110px;animation:kingin .8s 1.2s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes kingin{from{transform:translateY(60px) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.res.out svg.king{width:90px;height:112px;opacity:.9;filter:grayscale(.3)}
img.pic.li,.pic.li.ph{width:2.1rem;height:2.1rem;flex:none}
.pic.li.ph{display:block;border-radius:50%;background:radial-gradient(circle,rgba(179,166,214,.12),transparent 70%)}

/* badges */
.bdg{position:relative;display:block;width:var(--bs,74px);height:var(--bs,74px);flex:none;filter:grayscale(1);opacity:.42}
.bdg.on{filter:none;opacity:1}
.bdg .ros{position:absolute;inset:0;width:100%;height:100%;fill:url(#bgr)}
.bdg:not(.on) .ros{fill:var(--line2)}
.bdg .disc{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--b1),var(--b2));box-shadow:inset 0 0 0 3px rgba(255,246,210,.55),inset 0 -6px 12px rgba(0,0,0,.35)}
.bdg .bpic{position:absolute;inset:25%;width:50%;height:50%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.bdg .blk{position:absolute;right:2%;bottom:2%;width:26%;height:26%;border-radius:50%;background:var(--raised2);display:flex;align-items:center;justify-content:center;color:var(--mid)}
.bdg .blk svg{width:60%;height:60%}
.bdg.on{animation:none}
.bd-m{--b1:#e7c56a;--b2:#8a6214}
.bd-bayou{--b1:#2f6b4f;--b2:#163b2b}
.bd-pleri{--b1:#9a8a2c;--b2:#4f4512}
.bd-lavil{--b1:#7a3f8f;--b2:#3a1a47}
.bd-lamaer{--b1:#2a6f9a;--b2:#123850}
.bd-kann{--b1:#8f5a2a;--b2:#4a2c12}
.bd-dibwa{--b1:#4f6a2a;--b2:#263612}
.bd-lafet{--b1:#a8456f;--b2:#5a1f39}
.bd-sipri{--b1:#2f3f6a;--b2:#141d38}
.bd-riv{--b1:#2a7a7a;--b2:#123d3d}
.bseg{margin:0 1rem .4rem;display:flex}
.bseg button{flex:1}
.bgrid{flex:1;min-height:0;display:grid;gap:.4rem;padding:.4rem 1rem;align-content:center}
.bgrid.c3{grid-template-columns:repeat(3,1fr);--bs:clamp(64px,22vw,96px)}
.bgrid.c4{grid-template-columns:repeat(4,1fr);--bs:clamp(50px,15.5vw,74px)}
.bcell{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.35rem .1rem;border-radius:14px;text-align:center;min-width:0}
.bcell:active{background:var(--raised)}
.bcell b{font-weight:400;font-size:.86rem;line-height:1.1;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell small{font-size:.7rem;color:var(--mid);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell.on small{color:var(--gold)}
.bcnt{flex:none;text-align:center;color:var(--mid);font-size:.85rem;padding:0 1rem calc(.8rem + var(--sb))}
.nbx{text-align:center}
.nbx .nbb{display:flex;justify-content:center;--bs:150px;margin-bottom:.4rem}
.nbx .nbb .bdg{animation:bpop .7s cubic-bezier(.2,1.6,.4,1)}
.nbx small{color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.75rem}
.nbx h2{font-weight:400;font-size:1.6rem;margin:.15rem 0}
.nbx p{color:var(--soft);margin:0 0 1rem}
.nbf{display:flex;gap:.5rem}
.nbf .btn{flex:1}
@keyframes bpop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.gsh{width:56px;height:56px;padding:0;margin-right:.6rem;flex:none;border-radius:16px;background:rgba(243,201,105,.14);border:1px solid rgba(243,201,105,.45);color:#f3c969;animation:rise .5s 1.3s ease-out both}
.gsh svg{margin:auto}

/* listening */
.lsn .lsb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;padding:1rem}
.lhp{position:relative;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-a);color:var(--accent);flex:none}
.lhp svg{width:46px;height:46px;stroke-width:1.6}
.lhp .lw{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0}
.lhp.on .lw{animation:lwave 1.8s ease-out infinite}
.lhp.on .w2{animation-delay:.9s}
@keyframes lwave{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
.lpic{height:72px;display:flex;align-items:center;justify-content:center}
.lpic .pic{width:72px;height:72px}
.lk{font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.15;max-width:22rem;min-height:1.2em}
.len{color:var(--soft);font-size:1.05rem;max-width:22rem;min-height:1.3em}
.lbar{width:min(260px,80%);height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:.4rem}
.lbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.lcnt{color:var(--mid);font-size:.8rem}
.lctl{flex:none;display:flex;align-items:center;justify-content:center;gap:1.6rem;padding:.4rem 1rem}
.lctl .lg{width:52px;height:52px}
.lplay{width:76px;height:76px;border-radius:50%;background:var(--fg);color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--prish)}
.lplay:active{transform:translateY(3px);box-shadow:0 1px 0 var(--prish)}
.lplay svg{width:30px;height:30px;stroke-width:2.6}
.lfoot{flex:none;display:flex;padding:.6rem 1rem calc(1rem + var(--sb))}
.lfoot .btn{flex:1}

/* golden listening checkpoint */
.node.hp .c{border-radius:50%;background:linear-gradient(145deg,#ffe9a8,#f3c969 45%,#b47c1f);border-color:#f3c969;color:#3a2800}
.node.hp.lock .c{background:var(--raised);border-color:var(--gold);color:var(--gold);opacity:.8}
.node.hp.done .c{background:var(--gold-a);border-color:var(--gold);color:var(--gold)}
.node.hp.open .c::before{border-color:var(--gold)}
.node.hp .lb{color:var(--gold)}
/* hearing cards */
.hear{display:flex;flex-direction:column;align-items:center;gap:.7rem;width:100%;text-align:center}
.hear .hq{margin:.4rem 0 0;color:var(--mid);font-size:.95rem}
.hclaim{font-size:clamp(1.3rem,6vw,1.9rem);line-height:1.25;padding:.9rem 1.1rem;border-radius:18px;background:var(--raised);border:1px solid var(--line);max-width:24rem}
.hopts{display:flex;flex-direction:column;gap:.5rem;width:min(100%,24rem)}
.hopt{padding:.85rem 1rem;border-radius:14px;background:var(--raised);border:2px solid var(--line2);font-size:1.05rem;color:var(--fg);box-shadow:0 3px 0 var(--line2);text-align:center}
.hopt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.hopt.ok{border-color:var(--ok);background:var(--ok-a);color:var(--ok)}
.hopt.bad{border-color:var(--bad);background:var(--bad-a);color:var(--bad)}
.tfb{flex:1;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;border:0;color:#fff}
.tfb svg{width:30px;height:30px;stroke-width:3}
.tfb.no{background:#d9483e;box-shadow:0 5px 0 #8f2820}
.tfb.yes{background:#2ea866;box-shadow:0 5px 0 #1a6b3f}
.tfb:active{transform:translateY(4px);box-shadow:none}
.tfb.ok{outline:4px solid var(--ok);outline-offset:3px}
.tfb.bad{outline:4px solid var(--bad);outline-offset:3px}

/* the two readers */
.avx{display:flex;flex-direction:column;align-items:center;gap:.15rem;flex:none}
.avx svg{width:calc(3.6rem*var(--k));height:calc(3.6rem*var(--k));border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.avx small{font-size:.72rem;color:var(--mid);letter-spacing:.02em}
.avx.big svg{width:96px;height:96px}
.avx.big small{font-size:.85rem}
.play .avx{align-self:flex-end}
.sbub{position:relative;display:flex;align-items:center;gap:.8rem;padding:calc(.7rem*var(--k)) calc(.9rem*var(--k));border-radius:22px;background:var(--raised);border:1px solid var(--line)}
.sbub::before{content:'';position:absolute;left:-9px;bottom:22px;width:16px;height:16px;background:var(--raised);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.play{gap:.7rem}
.vduo{display:flex;justify-content:center;gap:2rem;padding:.6rem 0}
.lhp#lsA{width:auto;height:auto;background:none;border-radius:0;position:relative}
.lhp#lsA .lw{inset:0;width:96px;height:96px;border-color:var(--gold)}
.lbub{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.8rem 1.2rem;border-radius:22px;background:var(--raised);border:1px solid var(--line);position:relative;max-width:min(92%,24rem);margin-top:.4rem}
.lbub::before{content:'';position:absolute;top:-9px;left:50%;margin-left:-8px;width:16px;height:16px;background:var(--raised);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}

/* dialogue stops on the map */
.dlg{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;background:none;border:0;z-index:3}
.dlg .c{position:relative;width:54px;height:54px;border-radius:18px 18px 18px 4px;display:flex;align-items:center;justify-content:center;background:#fff6d2;border:2px solid #f3c969;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.dlg .c .pic,.dlg .c img{width:34px;height:34px}
.dlg.open .c{animation:bob 2.4s ease-in-out infinite}
.dlg.lock .c{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.25);color:#ddd}
.dlg .ck{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}
.dlg .ck svg{width:14px;height:14px;stroke-width:3}
.dlg .lb{font-size:.72rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* dialogue scene */
.dseg{margin:0 1rem .3rem;display:flex}.dseg button{flex:1}
.chat{display:flex;flex-direction:column;gap:.7rem;overflow-y:auto;padding-top:.6rem}
.chat .ln{display:flex;align-items:flex-end;gap:.5rem;max-width:92%;flex:none;cursor:pointer}
.chat .ln.a{flex-direction:row-reverse;align-self:flex-end}
.chat .ln .avx svg{width:40px;height:40px}
.chat .ln .avx small{font-size:.62rem}
.chat .bb{display:flex;flex-direction:column;gap:.2rem;padding:.6rem .85rem;border-radius:18px 18px 18px 4px;background:var(--raised);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.chat .ln.a .bb{border-radius:18px 18px 4px 18px;background:var(--accent-a)}
.chat .kr{font-size:1.08rem;line-height:1.3}
.chat .en{display:none;font-size:.88rem;color:var(--mid);line-height:1.25}
.chat .ln.sh .en{display:block}
.chat .ln.on .bb{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-a)}
.dhint{flex:none;text-align:center;color:var(--dim);font-size:.78rem;margin:.2rem 0 0}

.x101 svg.i{width:66%;height:66%;stroke-width:2.6;fill:currentColor}
.ov#edq{z-index:97}
.edq{text-align:center}
.edq h2{font-weight:400;font-size:1.3rem;margin:.6rem 0 1rem}
.edq{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:1.2rem 1.1rem}
.edq .nbf{display:flex;gap:.5rem;width:100%}.edq .nbf .btn{flex:1}
/* the three unit stops */
.node.big .c{position:relative}
.node .lring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none;overflow:visible}
.node .lring circle{fill:none;stroke-width:6}
.node .lring .b{stroke:var(--line)}
.node .lring .f{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s}
.node.big .lb{font-size:.85rem;max-width:12rem;color:var(--soft)}
.node.big .go{font-size:.9rem}
#pN.auto{position:relative;overflow:hidden}
#pN.auto::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.55);transform-origin:left;animation:autofill 1.5s linear forwards}
@keyframes autofill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.map-king{cursor:pointer;pointer-events:auto}
.map-say.pop{animation:bpop .4s cubic-bezier(.2,1.6,.4,1)}
/* transfer tip card */
.kt{display:flex;align-items:flex-end;gap:.6rem;width:min(100%,28rem)}
.kt .king{width:84px;height:84px;flex:none}
.ktb{position:relative;flex:1;padding:.9rem 1rem;border-radius:20px 20px 20px 4px;background:var(--gold-a);border:1px solid var(--gold)}
.ktb small{color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:.72rem}
.ktb p{margin:.35rem 0 .6rem;font-size:1.02rem;line-height:1.4}
.kte{display:flex;align-items:center;gap:.5rem;font-size:1.2rem}
.kte span{color:var(--mid);font-size:.9rem}
.map-say#kSay{border-radius:4px 14px 14px 14px}

.nw{white-space:nowrap;font-weight:inherit}
html.light .fb.ok{background:#e5f3ea;border-color:#b6dbc4}
html.light .fb.bad{background:#fbeae7;border-color:#efc2bb}
html.light .fb .hd .ic{color:#fff}
.fb.bad .ans{color:var(--fg)}
.fb.bad .ans .dk{color:var(--fg);font-weight:700;background:var(--ok-a);box-shadow:inset 0 -2px 0 var(--ok)}
html.light .fb .row2 .btn.pri,html.light .fb .btn.pri{color:#fff}

</style>
</head>

<script>
/* Diksyonær core: lexicon, lemmatizer, course, exercises, grading, scheduling. No DOM. */
(function (G) {
'use strict';

/* ------------------------------------------------------------------ text */
const C1 = {'\x80':'€','\x8a':'Š','\x8c':'Œ','\x8e':'Ž','\x9a':'š','\x9c':'œ','\x9e':'ž','\x9f':'Ÿ','\x91':'‘','\x92':'’','\x93':'“','\x94':'”','\x96':'-','\x97':'-','\x85':'...'};

const uniq = a => [...new Set(a)];

/* ------------------------------------------------------- part of speech */
const VOC = new Set('n v adj adv prep conj pron det int interj intj interr phr ohr phrn exp aux pvm mod indef ind quant rel prop pl sg m f tr intr imp imperfect past pat part pres fut future cond comp neg negative or noun verb num art sdv av pro place'.split(' '));
const AB = {n:'noun',v:'verb',adj:'adjective',adv:'adverb',prep:'preposition',conj:'conjunction',pron:'pronoun',det:'determiner',int:'interjection',interj:'interjection',intj:'interjection',interr:'interrogative',phr:'phrase',ohr:'phrase',phrn:'phrase',sdv:'adverb',av:'adverb',pro:'pronoun',ind:'indefinite',pat:'past',place:'place name',future:'future',negative:'negative',or:'or',exp:'expression',aux:'auxiliary',pvm:'preverbal marker',mod:'modal',indef:'indefinite',quant:'quantifier',rel:'relative',prop:'proper',pl:'plural',sg:'singular',m:'masculine',f:'feminine',tr:'transitive',intr:'intransitive',imp:'imperfect',imperfect:'imperfect',past:'past',part:'participle',pres:'present',fut:'future',cond:'conditional',comp:'comparative',neg:'negative',num:'numeral',art:'article'};
const CT = {n:'noun',noun:'noun',prop:'noun',v:'verb',verb:'verb',aux:'verb',pvm:'verb',mod:'verb',adj:'adj',adv:'adv',prep:'prep',conj:'conj',pron:'pron',det:'det',quant:'det',art:'det',indef:'det',int:'int',interj:'int',intj:'int',sdv:'adv',av:'adv',pro:'pron',place:'noun',num:'noun'};

const CATS = [['noun','Noun'],['verb','Verb'],['adj','Adjective'],['adv','Adverb'],['prep','Preposition'],['conj','Conjunction'],['pron','Pronoun'],['det','Determiner'],['int','Interjection'],['phrase','Phrase'],['other','Other']];

const expandPos = l => ptoks(l).map(t => AB[t] || t).join(' ');

  const items = [], bySense = {}, cats = new Set();
  inner.split(',').map(x => x.trim()).filter(Boolean).forEach(it => {
    const m = it.match(/^(\d+)(?:\s*-\s*(\d+))?\.\s*(.*)$/);

/* -------------------------------------------------------------- forms */

const segs = s => String(s || '').split(/<br\s*\/?>|\r?\n/i).map(x => dec(x).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim()).filter(Boolean);

/* --------------------------------------------------------- English glosses */
const cutParen = s => s.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();

/* ----------------------------------------------------------- parse TSV */
function parseTSV(text) {
  const rows = String(text || '').replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim()).map(l => l.split('\t'));

const TOKRE = /[\p{L}\p{M}]+(?:['’][\p{L}\p{M}]*)*(?:-[\p{L}\p{M}]+(?:['’][\p{L}\p{M}]*)*)*|\p{N}+/gu;

/* ---------------------------------------------------------- lexicon */
