<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tour">
<meta name="mobile-web-app-capable" content="yes">
<title>tour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/ui/dm-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css">
<style>
@font-face{font-family:"Dotsies";src:url("DotsiesRect.ttf") format("truetype");font-display:swap}
@font-face{font-family:"DM Mono";src:url("fonts/ui/dm-mono-300.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"DM Mono";src:url("fonts/ui/dm-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DM Mono";src:url("fonts/ui/dm-mono-500.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--t1:13px;--t2:16px;--t3:25px;--k:#000;--w:#fff;--g:#777;--c:#4ff3ff;--i:#8a7dff;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;position:fixed;inset:0;width:100%;background:var(--k);color:var(--w);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;
  font:400 var(--t2)/1.45 var(--mono);text-transform:lowercase;letter-spacing:.01em}
html[data-dots="1"] body{font-family:"Dotsies",ui-monospace,monospace;letter-spacing:.2em}   /* the font packs letters edge to edge; a gap of one dot makes words readable */
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;border-radius:0;text-transform:inherit}
button{cursor:pointer;border:1.5px solid var(--w);user-select:none;-webkit-user-select:none;transition:background .18s,color .18s,transform .18s var(--ease),opacity .25s,border-color .25s}
button:active,button.on{background:var(--w);color:var(--k)}
button:active{transform:scale(.94)}
:focus-visible{outline:1px solid var(--w);outline-offset:2px}
[hidden]{display:none!important}
.o{width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center}
.o.sm{width:40px;height:40px;font-size:18px}
.o.xl{width:80px;height:80px;font-size:34px;border-width:2px}
.g{color:var(--g)}
.o,#kp .mut{font-family:var(--mono)!important}   /* symbol buttons stay readable in Dots mode */
/* glass: a hairline edge, a soft top highlight, depth underneath; pressing lights it cyan instead of flipping to white */
.o{border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.025) 55%,rgba(0,0,0,.18));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -10px 16px rgba(0,0,0,.28),0 10px 26px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3)}
.o:active{background:radial-gradient(circle at 50% 40%,rgba(79,243,255,.4),rgba(79,243,255,.07) 70%);color:#fff;border-color:var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 26px rgba(79,243,255,.5)}
.o.on{background:linear-gradient(180deg,#fff,#cfe1ff);color:#000;border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.5)}
.o.xl{border-width:1px}
@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes breathe{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -10px 16px rgba(0,0,0,.28),0 10px 26px rgba(0,0,0,.55),0 0 16px rgba(79,243,255,.12)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -10px 16px rgba(0,0,0,.28),0 10px 26px rgba(0,0,0,.55),0 0 38px rgba(79,243,255,.34)}}
.dw{font-family:"Dotsies",ui-monospace,monospace!important;letter-spacing:.2em;font-size:34px;line-height:1}   /* the word "dots" is always written in Dots */

/* map + layers */
#map{position:fixed;inset:0;background:var(--k);animation:wipe .9s var(--ease) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.maplibregl-map{background:var(--k);font:inherit}
.maplibregl-canvas{outline:0}
.maplibregl-ctrl-attrib{background:transparent!important;color:var(--g)!important;font:10px/1.3 ui-monospace,monospace!important;text-transform:lowercase;margin:0 4px calc(var(--sab) + 4px)!important}
.maplibregl-ctrl-attrib a{color:var(--g)!important}
body:not([data-map="1"]) .maplibregl-ctrl-attrib{opacity:0}      /* the credits sit folded away from the first frame */
.maplibregl-ctrl-attrib-button{background-color:transparent!important;filter:invert(.5)}
.maplibregl-ctrl-bottom-right{z-index:600}
.maplibregl-marker{will-change:transform}
#grid{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.06;
  background:linear-gradient(var(--w) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--w) 1px,transparent 1px) 0 0/48px 48px;
  animation:gridin 1.4s var(--ease) both}
@keyframes gridin{from{clip-path:circle(0 at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
#rcv{position:fixed;inset:0;z-index:610;pointer-events:none;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:620;pointer-events:none}
/* film: bars slide in for the big moments; the map goes soft behind a sheet; a title card on launch */
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:695;pointer-events:none;transition:height 1.1s var(--ease)}
#lbt{top:0}#lbb{bottom:0}
body[data-lb="1"] .lb{height:8vh}
#map,#rcv{transition:filter .8s ease}
body[data-sheet="1"] #map,body[data-sheet="1"] #rcv{filter:blur(3px) brightness(.5)}
#title{position:fixed;inset:0;z-index:890;display:grid;place-items:center;font-family:"Dotsies",ui-monospace,monospace;font-size:min(12vw,64px);text-indent:.4em;color:#fff;pointer-events:none;opacity:0;text-shadow:0 0 26px rgba(79,243,255,.55)}
#title.go{animation:title 3.4s ease both}
@keyframes title{0%{opacity:0;letter-spacing:.12em;filter:blur(10px)}28%{opacity:1;letter-spacing:.4em;filter:blur(0)}62%{opacity:1;letter-spacing:.46em}100%{opacity:0;letter-spacing:1em;filter:blur(12px)}}
#dim{position:fixed;inset:0;z-index:690;pointer-events:none;background:rgba(0,0,0,.55);opacity:0;transition:opacity .5s ease}
body[data-st="intent"] #dim{opacity:1}
#tint{position:fixed;inset:0;z-index:860;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,rgba(var(--tc,255,255,255),0) 25%,rgba(var(--tc,255,255,255),.38) 100%)}
#tint.go{animation:tint 1.1s ease-out}
@keyframes tint{0%{opacity:0}28%{opacity:1}100%{opacity:0}}

/* markers */
.mkw{background:none!important;border:0!important;width:0;height:0}
.mk{display:block;width:24px;height:24px;margin:-12px 0 0 -12px;font-size:20px;line-height:24px;text-align:center;font-weight:400;text-shadow:0 0 4px #000,0 0 4px #000}
.mk.l1{color:var(--i);text-shadow:0 0 8px var(--i),0 0 3px #000}
.mk.l2{color:var(--c);text-shadow:0 0 9px var(--c),0 0 3px #000}
.mk.o2{opacity:.7}
.mk.lr{color:#ff3b4e;text-shadow:0 0 9px #ff3b4e,0 0 3px #000}
.mk.drop{animation:drop .8s var(--ease) both}
@keyframes drop{from{transform:translateY(-34px) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.me i,.tgm i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--w);box-shadow:0 0 10px rgba(255,255,255,.8)}
.me b,.tgm b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:1px solid var(--c);border-radius:50%;animation:pulse 2.4s ease-out infinite}
.tgm i{background:none;border:1.5px solid var(--c);width:16px;height:16px;left:-8px;top:-8px;box-shadow:0 0 12px var(--c)}
.tgm.born i{animation:born 1.2s var(--ease) both}                    /* the spin's lock ring shrinks down into the target */
@keyframes born{from{transform:scale(9);opacity:0;border-width:.4px}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.me em.sw{position:absolute;left:-110px;top:-110px;width:220px;height:220px;border:1px solid var(--c);border-radius:50%;opacity:0;animation:sweep 6s ease-out infinite 2s}
@keyframes sweep{0%{transform:scale(.05);opacity:.5}75%{opacity:0}100%{transform:scale(1);opacity:0}}
.mk.rip{animation:rip .8s var(--ease) both;animation-delay:var(--rd,0ms)}
@keyframes rip{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
.rpl{position:absolute;left:-250px;top:-250px;width:500px;height:500px;border:1.5px solid var(--c);border-radius:50%;animation:rpl 1.9s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes rpl{from{transform:scale(.02);opacity:.9}to{transform:scale(3);opacity:0}}

/* open: sign in */
#open{position:fixed;inset:0;z-index:800;background:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 10px)}
#boxes{display:flex;gap:12px}
#boxes i{width:54px;height:72px;border:1.5px solid var(--w);border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:38px;transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
#boxes i.f{border-color:var(--c);box-shadow:0 0 14px rgba(79,243,255,.3)}
#boxes i.cur::after{content:"_";animation:blink 1.1s ease-in-out infinite}
#boxes.busy i{animation:blink .5s ease-in-out infinite}
#boxes.inv i{background:var(--w);color:var(--k)}
#boxes.shake{animation:shake .42s var(--ease)}
@keyframes blink{50%{opacity:.25}}
@keyframes shake{20%{transform:translateX(-9px)}50%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
#orow{display:flex;gap:18px;align-items:center;margin-top:4px}
#bgo{width:60px;height:60px;font-size:26px;border-width:2px;border-color:var(--c);color:var(--c)}
#bgo:active{background:var(--c);color:var(--k)}
#oerr{min-height:1.4em;color:var(--g);font-size:15px}
#kp{display:grid;grid-template-columns:repeat(3,76px);gap:10px;margin-top:6px}
#kp button{height:58px;border-radius:14px;font-size:26px;border-color:#555}
#kp button:active{background:var(--w);border-color:var(--w)}
#kp .gh{visibility:hidden}
#kp button.mut{font-size:20px;color:var(--g)}
#ack{margin-top:10px}
.o.pri{background:var(--w);color:var(--k)}

/* menu: one button that blooms */
#bm{position:fixed;top:calc(var(--sat) + 12px);right:12px;z-index:730;width:46px;height:46px;border-radius:50%;font-size:20px;display:grid;place-items:center;animation:arrive 1.2s var(--ease) 1.6s backwards}
#bm.on{transform:rotate(90deg)}
#bm.flick{animation:flick 1.2s ease 1}
@keyframes flick{0%,40%,80%{box-shadow:0 0 0 0 var(--c)}20%,60%{box-shadow:0 0 0 12px rgba(79,243,255,0)}}
#mn{position:fixed;top:calc(var(--sat) + 66px);right:12px;z-index:725;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#mn>*{opacity:0;transform:translate(8px,-20px) scale(.5);transform-origin:top right;transition:transform .42s cubic-bezier(.2,1.25,.3,1),opacity .25s;pointer-events:none}
#mn.open>*{opacity:1;transform:none;pointer-events:auto}
#mn.open>*:nth-child(2){transition-delay:.04s}#mn.open>*:nth-child(3){transition-delay:.08s}#mn.open>*:nth-child(4){transition-delay:.12s}
#mid{font-size:var(--t1);letter-spacing:.14em;padding:7px 14px;border:1px solid rgba(255,255,255,.22);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
#mn .o.on{background:var(--w)}
body:not([data-st="home"]) #bm,body:not([data-st="home"]) #mn{display:none}

/* toast: only for problems */
#toast{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 118px);z-index:700;text-align:center;color:#9a9aa8;font-size:var(--t1);letter-spacing:.12em;pointer-events:none;opacity:0;transition:opacity .5s ease}
#toast.on{opacity:1}

/* dock */
#dockhome{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 24px);z-index:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
#dockhome>*{pointer-events:auto}
#brec{position:absolute;left:20px;bottom:18px}
#dockhome{animation:arrive 1.3s var(--ease) 1.9s backwards}
#bspin{animation:breathe 4.4s ease-in-out infinite}
#bspin.pulse1{animation:ring 2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(79,243,255,.6)}100%{box-shadow:0 0 0 30px rgba(79,243,255,0)}}

/* everything that disappears when you tap the map */
#bm,#mn,#dockhome,#toast{transition:opacity .45s ease}
body[data-hide="1"] #bm,body[data-hide="1"] #mn,body[data-hide="1"] #dockhome,body[data-hide="1"] #toast{opacity:0!important;pointer-events:none}
/* idle: after a few quiet seconds the controls sink into the picture; a touch brings them back */
body[data-idle="1"] #bm,body[data-idle="1"] #dockhome,body[data-idle="1"] #tfoot{opacity:.16;transition:opacity 2.2s ease}
body[data-idle="1"] #hud .cmp{opacity:.8}
#tfoot{transition:opacity .5s ease}

/* walking: small, top right, no bar */
.cmp svg{width:100%;height:100%;display:block}
.cmp .ar{display:none}.cmp.has .ar{display:block}
#hud{position:fixed;top:calc(var(--sat) + 12px);right:12px;z-index:700;width:92px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;animation:down .6s var(--ease) both}
@keyframes down{from{transform:translateY(-18px);opacity:0}}
#hud .cmp{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.65));filter:drop-shadow(0 0 8px rgba(79,243,255,.3));transition:filter .5s ease}
#hud .cmp.al{filter:drop-shadow(0 0 16px rgba(79,243,255,.95))}                          /* the ring lights up when the arrow points straight ahead */
.cmp.al circle{stroke:#4ff3ff;transition:stroke .4s}
#dist{font-size:var(--t3);font-weight:400;line-height:1.1;margin-top:8px;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 8px #000,0 0 3px #000}
#rinfo{font-size:var(--t1);font-weight:300;letter-spacing:.14em;color:#c9c9d6;text-shadow:0 0 8px #000,0 0 3px #000}
#tfoot{position:fixed;left:20px;right:20px;bottom:calc(var(--sab) + 24px);z-index:710;display:flex;justify-content:space-between;align-items:center}
.hold{position:relative;isolation:isolate;overflow:hidden}
.hold::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--w);transform:scaleY(0);transform-origin:bottom;transition:transform .15s linear}
.hold.press::before{transform:scaleY(1);transition:transform .9s linear}
.hold.press{color:var(--k)}
body:not([data-st="travel"]) #hud,body:not([data-st="travel"]) #tfoot{display:none}

/* feedback */
#verd{position:fixed;inset:0;z-index:850;display:grid;place-items:center;font-size:44vw;pointer-events:none;text-shadow:0 0 6px #000;animation:verd 1s ease both}
@keyframes verd{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#open.out{animation:oout .5s var(--ease) forwards}
@keyframes oout{to{opacity:0;transform:scale(1.2)}}

/* starting a walk: what kind of walk and how far, as tiles */
#sheet .sg.four{grid-template-columns:repeat(4,1fr)}
#sheet .sg.five{grid-template-columns:repeat(5,1fr);gap:8px}
#sheet .sg.five .o{height:70px;font-size:22px;border-radius:18px;min-width:0;padding:0;overflow:hidden}
#sheet .sg.five .o small{font-size:9px;letter-spacing:0}
#sheet .sg .o small{display:block;font-size:10px;letter-spacing:.1em;opacity:.7;margin-top:3px}
#sheet .sg .o{flex-direction:column;line-height:1.1}
#sheet .go{width:100%;height:64px;border-radius:20px;margin-top:14px;border-color:var(--c);color:var(--c);font-size:26px}

/* walking */
#tnext{margin-top:6px;font-size:var(--t1);letter-spacing:.14em;color:var(--c);text-shadow:0 0 8px #000}
.tgm u{position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;font-size:11px;letter-spacing:.1em;color:#dcdce6;text-shadow:0 0 4px #000,0 0 4px #000}
.stp{display:block;width:20px;height:20px;margin:-10px 0 0 -10px;border:1px solid var(--c);border-radius:50%;font-size:11px;line-height:18px;text-align:center;color:var(--c);background:rgba(0,0,0,.6);box-shadow:0 0 10px rgba(79,243,255,.4)}
.stp.got{opacity:.45}
#dockhome #blook{position:absolute;right:20px;bottom:18px}

/* places with a story: a thin line up from the spot, the name floating above it */
.pt{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;pointer-events:auto;cursor:pointer;animation:ptin .9s var(--ease) both;animation-delay:var(--pd,0ms)}
.pt i{display:block;width:1px;height:46px;background:linear-gradient(to top,rgba(138,125,255,0),rgba(170,160,255,.9))}
.pt span{display:block;max-width:44vw;padding:4px 9px;border:1px solid rgba(170,160,255,.45);border-radius:12px;background:rgba(6,6,16,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  font-size:11px;letter-spacing:.06em;line-height:1.25;color:#e6e4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 14px rgba(138,125,255,.25)}
.pt small{display:block;font-size:9px;letter-spacing:.14em;color:#a49cff}
.pt.h span{opacity:.55}
@keyframes ptin{from{opacity:0;transform:translateX(-50%) translateY(14px)}}
body[data-st="spin"] .pt,body[data-st="res"] .pt{display:none}

/* the card: the place's own words, its facts, its picture, its sources */
#card{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 92px);z-index:745;display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid rgba(170,160,255,.35);border-radius:18px;
  background:rgba(4,4,12,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 24px rgba(138,125,255,.18);max-height:46vh;overflow:auto}
#card.in{animation:cardin .7s var(--ease) both}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.97)}}
#card img{width:86px;height:110px;object-fit:cover;border-radius:10px;flex:none;filter:saturate(.75) contrast(1.05)}
#card .cb{min-width:0;flex:1}
#card .ct{font-size:var(--t2);line-height:1.2;padding-right:34px}
#card .cf{font-size:10px;letter-spacing:.12em;color:#a49cff;margin:4px 0 6px}
#card .cx{font-size:13px;line-height:1.45;color:#d4d4de;text-transform:none}
#card .cs{margin-top:8px;font-size:10px;letter-spacing:.08em;color:var(--g)}
#card .cs a{color:var(--g)}
#cardx{position:absolute;right:8px;top:8px;width:32px;height:32px;font-size:14px}
body[data-st="travel"] #card{bottom:calc(var(--sab) + 96px)}
html[data-dots="1"] #card .cx{font-family:var(--mono);letter-spacing:.01em}

/* a new area: its name sweeps across the street */
#area{position:fixed;left:0;right:0;top:34%;z-index:690;text-align:center;pointer-events:none;opacity:0}
#area b{display:block;font-family:"Dotsies",var(--mono);font-weight:400;font-size:min(13vw,72px);letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 30px rgba(138,125,255,.7)}
#area span{display:block;margin:8px auto 0;max-width:80vw;font-size:12px;letter-spacing:.08em;color:#c9c9d6;text-transform:none;text-shadow:0 0 8px #000}
#area.go{animation:area 6s ease both}
@keyframes area{0%{opacity:0;transform:translateX(18%);filter:blur(8px)}18%{opacity:1;transform:none;filter:none}70%{opacity:1}100%{opacity:0;transform:translateX(-12%);filter:blur(6px)}}
#sync{position:fixed;left:12px;top:calc(var(--sat) + 14px);z-index:735;font-size:16px;color:var(--g);animation:blink 1.6s ease-in-out infinite}
/* the end of a walk */

<script type="module">

/* ---------- sound ---------- */

  if (muted) return; const a = ac(); if (!a) return; const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);

  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
  const v = a.createGain(); v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(g, t + d * .6); v.gain.exponentialRampToValueAtTime(.0001, t + d);

const unlockEv = ["touchend", "click"];
function unlock() { ac(); startCompass(); if (AC && AC.state === "running" && (compassOn || !needsPerm)) unlockEv.forEach(t => removeEventListener(t, unlock, true)); }
unlockEv.forEach(t => addEventListener(t, unlock, true));

/* ---------- dots ---------- */
const setDots = on => { document.documentElement.dataset.dots = on ? "1" : "0"; store.set("tm.dots", on ? "1" : "0"); };
setDots(store.get("tm.dots") === "1");

/* ---------- firebase ---------- */

let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch { db = initializeFirestore(app, {}); }

/* ---------- open: sign in with our own pad ---------- */
const hex = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const creds = async id => ({ email: (await hex("id:" + id)).slice(0, 24) + "@terminal.iosci.org", password: await hex("pw:" + id) });
const boxes = [...document.querySelectorAll("#boxes i")];
let busy = false, pendingId = null, idv = "", omode = "in", hold = false;

const renderId = () => boxes.forEach((b, i) => { b.textContent = idv[i] || ""; b.classList.toggle("cur", i === idv.length && idv.length < 4); b.classList.toggle("f", i < idv.length); });
renderId();
const fillId = s => { idv = s; renderId(); $("oerr").textContent = ""; };
const known = new Map();                       // id -> agent exists
async function exists(id) {

}

{ const l = store.get("tm.last"); if (/^\d{4}$/.test(l || "")) { $("klast").classList.remove("gh"); $("klast").addEventListener("pointerdown", e => { e.preventDefault(); if (!busy && !hold) { fillId(l); sfx.key(); } }); } }

  const c = (e && e.code) || "";
  const m = { taken: "taken", "auth/email-already-in-use": "taken", "auth/network-request-failed": "no net", "auth/too-many-requests": "wait",

/* ---------- geometry + units ---------- */
const rad = d => d * Math.PI / 180;

    '<button id="shelp" class="o" type="button" aria-label="Help">?</button>' +

    '<div class="st g" style="border:0;justify-content:center"><span>' + BUILD + "</span></div>");
  sbody.dataset.k = "set"; sfx.open();
  $("sdots").addEventListener("click", e => { const v = document.documentElement.dataset.dots !== "1"; setDots(v); applyDots(); sfx.key(); e.currentTarget.classList.toggle("on", v); });
  $("smute").addEventListener("click", e => { muted = !muted; store.set("tm.mute", muted ? "1" : "0"); e.currentTarget.classList.toggle("on", !muted); if (muted) setBed(0); sfx.key(); });
  $("sunit").addEventListener("click", e => { units = units === "mi" ? "km" : "mi"; store.set("tm.units", units); e.currentTarget.textContent = units; sfx.key(); });
  $("smode").addEventListener("click", e => { routeMode = routeMode === "foot" ? "car" : "foot"; store.set("tm.mode", routeMode); e.currentTarget.textContent = routeMode === "car" ? "ⓓ" : "ⓦ"; rt = null; lastFetch = 0; sfx.key(); if (active) { fetchRoute(); } });
  $("sdm").addEventListener("click", () => { store.set("tm.dotmap", DOTMAP ? "0" : "1"); sfx.key(); location.reload(); });
  $("shelp").addEventListener("click", openHelp);
  $("sout").addEventListener("click", () => { sfx.no(); signOut(auth).then(() => location.reload()).catch(() => location.reload()); });
});

const HELP = [["◎", "start a walk: a tour of several places, or one place with history, a view or green"], ["◌", "tour: a loop through the most notable real places around you"],
  ["▥ ◭ ♧", "history · view · green: one real place at about that distance"], ["✦", "places with a story float over the map; tap one, or walk past and the guide tells you"],
  ["◉", "look around: the three most interesting things near you"], ["➤", "arrow up = straight on"], ["✓ ■", "arrived · stopped"], ["✕", "hold to stop"],
  ["≡", "your walks · everyone's"], ["⌁", "waiting to sync"], ["⚙", "settings"], ["", "facts: wikipedia · wikidata · photos: wikimedia commons · places: openstreetmap"]];
function openHelp() {
  if (sheet.classList.contains("open") && sbody.dataset.k === "help") { closeSheet(); return; }
  openSheet(HELP.map(h => '<div class="st hp"><span style="font-size:20px;min-width:3.6em">' + esc(h[0]) + "</span><span>" + esc(h[1]) + "</span></div>").join(""));
  sbody.dataset.k = "help"; sfx.open();
}
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 && !e.target.closest("#map")) e.preventDefault(); }, { passive: false });

/* ---------- session ---------- */
onAuthStateChanged(auth, user => {
  if (!user) { $("app").hidden = true; $("open").hidden = false; busy = false; return; }
  if (hold) return;                              // new random ID: wait until it has been acknowledged
  boot(user);
});
function boot(user) {
  uid = user.uid; agent = user.displayName || pendingId || store.get("tm.id") || "";
  if (!/^\d{4}$/.test(agent)) { signOut(auth); return; }
  store.set("tm.id", agent);
  try { walk = JSON.parse(store.get("tm.walk" + agent) || "[]"); if (!Array.isArray(walk)) walk = []; } catch { walk = []; }
  $("open").classList.add("out"); titleCard();          // the pad dissolves straight into the title, the title into the flight
  setTimeout(() => {
    $("open").hidden = true; $("open").classList.remove("out"); $("app").hidden = false; $("mid").textContent = agent;
    loadHeard(); initMap(); startGeo(); subMine(); route();
    if (!store.get("tm.spun")) $("bspin").classList.add("pulse1");
  }, reduced ? 0 : 480);
}

if ("serviceWorker" in navigator && location.hostname !== "localhost") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));   // not while testing locally: it would serve yesterday's files
</script>
</body>
