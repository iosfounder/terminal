<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@font-face{font-family:"Dotsies";src:url("DotsiesRect.ttf") format("truetype");font-display:swap}
:root{--k:#000;--w:#fff;--g:#777;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--k);color:var(--w);overflow:hidden;overscroll-behavior:none;
  font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:lowercase}
html[data-dots="1"] body{font-family:"Dotsies",ui-monospace,monospace}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;border-radius:0;text-transform:inherit}
button{cursor:pointer;border:1px solid var(--w);user-select:none;-webkit-user-select:none}
button:active,button.on{background:var(--w);color:var(--k)}
:focus-visible{outline:1px solid var(--w);outline-offset:2px}
[hidden]{display:none!important}
.o{width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center}
.o.xl{width:80px;height:80px;font-size:34px;border-width:2px}
.g{color:var(--g)}

/* map */
#map{position:fixed;inset:0;background:var(--k);animation:wipe .6s steps(8) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.leaflet-tile-pane{filter:grayscale(1) contrast(2.2) brightness(1.5)}
.leaflet-container{background:var(--k);font:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.7)!important;color:var(--g)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--g)!important}
#grid{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.07;
  background:linear-gradient(var(--w) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--w) 1px,transparent 1px) 0 0/48px 48px;
  animation:gridin .9s steps(10) both}
@keyframes gridin{from{clip-path:circle(0 at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
#fx{position:fixed;inset:0;z-index:600;pointer-events:none}
#flash{position:fixed;inset:0;z-index:900;background:var(--w);pointer-events:none}

/* markers */
.mkw{background:none!important;border:0!important}
.mk{display:block;width:24px;height:24px;margin:-12px 0 0 -12px;font-size:20px;line-height:24px;text-align:center;font-weight:400;text-shadow:0 0 3px #000,0 0 3px #000}
.mk.o2{opacity:.65}
.mk.drop{animation:drop .5s steps(5) both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.me i,.tgm i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--w)}
.me b,.tgm b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:1px solid var(--w);border-radius:50%;animation:pulse 2s steps(5) infinite}
.tgm i{background:none;border:1px solid var(--w);width:14px;height:14px;left:-7px;top:-7px}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.seg-new{animation:flick .9s steps(1) 1}
@keyframes flick{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}

/* open */
#open{position:fixed;inset:0;z-index:800;background:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#boxes{display:flex;gap:12px;position:relative}
#boxes i{width:52px;height:72px;border:1px solid var(--w);display:grid;place-items:center;font-style:normal;font-size:40px}
#boxes i.cur::after{content:"_";animation:blink 1s steps(1) infinite}
#boxes.busy i{animation:blink .4s steps(1) infinite}
#boxes.inv i{background:var(--w);color:var(--k)}
#boxes.shake{animation:shake .3s steps(3)}
@keyframes blink{50%{opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#idin{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;text-align:center;caret-color:transparent}
#oerr{min-height:1.4em;color:var(--g)}

/* top */
#top{position:fixed;top:0;left:0;right:0;z-index:700;background:var(--k);border-bottom:1px solid var(--w);
  padding:calc(var(--sat) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
#top .sp{flex:1}
#me{font-size:20px;letter-spacing:.08em}
#rk{text-transform:none;font-size:18px;min-width:2.2em;text-align:center;border:1px solid var(--w);padding:0 6px}
#rk.flick{animation:inv .9s steps(1) 1}
@keyframes inv{0%,34%,67%{background:var(--w);color:var(--k)}17%,50%,84%,100%{background:none;color:var(--w)}}
#line{position:fixed;top:calc(var(--sat) + 62px);left:12px;right:12px;z-index:650;pointer-events:none;color:var(--w);text-shadow:0 0 3px #000,0 0 3px #000}
#line.dim{color:var(--g)}

/* dock */
#dockhome{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 22px);z-index:700;display:flex;align-items:center;justify-content:space-between;padding:0 20px;pointer-events:none}
#dockhome>*{pointer-events:auto}
#dockhome .cmp{width:80px;height:80px;background:var(--k);border-radius:50%}
.cmp svg{width:100%;height:100%;display:block}
.cmp .tg{display:none}.cmp.has .tg{display:block}

/* travel */
#travel{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--k);border-top:1px solid var(--w);
  padding:16px 20px calc(var(--sab) + 16px);display:flex;align-items:center;justify-content:space-between;gap:12px}
#dist{font-size:44px;line-height:1}
#travel .cmp{width:150px;height:150px}
#travel .cmp .ring{animation:blink var(--bd,2s) steps(1) infinite}

/* pad */
#pad,#rep{position:fixed;inset:0;z-index:750;background:var(--k);display:flex;flex-direction:column;gap:12px;
  padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 16px);overflow:auto}
#tbar{height:2px;background:var(--g);margin:-14px -16px 0}
#tbar i{display:block;height:100%;width:0;background:var(--w)}
#tbar.run i{width:100%;transition:width 180s linear}
.info{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}
.int{font-size:20px;text-align:center;letter-spacing:.04em;padding:6px 0}
#cv{width:min(88vw,46vh);height:min(88vw,46vh);align-self:center;border:1px solid var(--w);touch-action:none;cursor:crosshair;background:var(--k)}
textarea{width:100%;border:1px solid var(--w);padding:10px;resize:none;font-size:16px;min-height:64px}
textarea::placeholder{color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.row.c{justify-content:center;gap:32px}
#rep img,#sheet img{max-width:100%;max-height:34vh;display:block;border:1px solid var(--w)}
#rep img.gray,#sheet img.gray{filter:grayscale(1) contrast(1.1)}
#rep .pv{display:flex;gap:12px;align-items:flex-start}
#rep .pv img{width:96px;height:96px;object-fit:cover}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:720;max-height:72vh;overflow:auto;background:var(--k);border-top:1px solid var(--w);
  padding:58px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .2s steps(4)}
#sheet.open{transform:none}
#sheet .x{position:absolute;right:10px;top:8px}
#sheet h2{font-size:18px;font-weight:400;margin-bottom:10px}
#sheet .li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #333;cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
#sheet .li:active{background:var(--w);color:var(--k)}
#sheet .bl{display:flex;flex-direction:column;gap:10px}
#sheet .rt{display:flex;gap:12px;align-items:center}
#sheet p{white-space:pre-wrap;word-break:break-word}
#sheet .st{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #333}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div id="grid" aria-hidden="true"></div>
<canvas id="fx" hidden aria-hidden="true"></canvas>
<div id="flash" hidden></div>

<section id="open">
  <div id="boxes"><i></i><i></i><i></i><i></i><input id="idin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="ID"></div>
  <button id="dice" class="o" type="button" aria-label="Random ID">⟳</button>
  <p id="oerr" role="alert"></p>
</section>

<div id="app" hidden>
  <header id="top">
    <span id="me"></span><span id="rk">I</span>
    <span class="sp"></span>
    <button id="bglobal" class="o" type="button" aria-label="All agents">⊕</button>
    <button id="blist" class="o" type="button" aria-label="Reports">≡</button>
    <button id="bset" class="o" type="button" aria-label="Settings">⚙</button>
  </header>
  <p id="line" class="dim"></p>

  <div id="dockhome">
    <button id="brec" class="o" type="button" aria-label="Centre">⌖</button>
    <button id="bspin" class="o xl" type="button" aria-label="Spin">◎</button>
    <div class="cmp" id="cmph"></div>
  </div>

  <section id="travel" hidden>
    <div>
      <div id="dist">–</div>
      <div id="ttype" class="g"></div>
      <button id="babort" class="o" type="button" aria-label="Abort" style="margin-top:14px">✕</button>
    </div>
    <div class="cmp" id="cmpt"></div>
  </section>

  <section id="pad" hidden>
    <div id="tbar"><i></i></div>
    <div class="info"><span id="pinfo"></span><span id="psrc" class="g"></span></div>
    <div class="int">evolution of mankind</div>
    <canvas id="cv" width="256" height="256"></canvas>
    <textarea id="btxt" rows="2" maxlength="1000" placeholder="…" spellcheck="false" autocapitalize="off"></textarea>
    <div class="row">
      <button id="pcancel" class="o" type="button" aria-label="Cancel">✕</button>
      <button id="pgo" class="o xl" type="button" aria-label="Go">▶</button>
    </div>
  </section>

  <section id="rep" hidden>
    <div class="info"><span id="rid"></span><span id="rtype"></span></div>
    <div class="pv"><img id="rblind" alt=""><p id="rbtxt" class="g" style="white-space:pre-wrap"></p></div>
    <textarea id="found" rows="3" maxlength="2000" placeholder="…" spellcheck="false" autocapitalize="off"></textarea>
    <div class="pv"><button id="bphoto" class="o" type="button" aria-label="Photo">◫</button><img id="pprev" class="gray" alt="" hidden></div>
    <input id="pfile" type="file" accept="image/*" capture="environment" hidden>
    <div class="row c">
      <button id="bno" class="o xl" type="button" aria-label="Deny">✕</button>
      <button id="byes" class="o xl" type="button" aria-label="Confirm">✓</button>
    </div>
  </section>

  <section id="sheet"><button id="sx" class="o x" type="button" aria-label="Close">✕</button><div id="sbody"></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, query, where, limit, onSnapshot, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCowfCPxIlo3l8KT1Eg8GIYk9k5A2-UUt4",
  authDomain: "terminal-149ac.firebaseapp.com",
  projectId: "terminal-149ac",
  storageBucket: "terminal-149ac.firebasestorage.app",
  messagingSenderId: "13022361485",
  appId: "1:13022361485:web:a9cd9dc612c9efd583efc4"
};

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} }
};
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad4 = n => String(n).padStart(4, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;

const INTENT = "evolution of mankind";
const R = 1000, N = 500, G = 12, ARR = 30;
const TG = { attractor:"◉", void:"◌", anomaly:"◈" };
const LINES = ["go.","report.","spin.","hold it.","see first.","walk.","the machine is ready.","no maps. no names.","trust the pull.",
  "confirm or deny.","again.","go now.","intention first.","draw before you move.","night counts.","rain counts.","short or far.",
  "do not decide.","arrive.","write what is there.","one more.","the point is waiting.","begin.","evolve."];

/* ---------- sound ---------- */
let AC = null, muted = store.get("tm.mute") === "1";
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (AC && AC.state === "suspended") AC.resume(); return AC; };
function tone(f, d = .12, type = "square", g = .05, at = 0, f2) {
  if (muted) return; const a = ac(); if (!a) return; const t = a.currentTime + at;
  const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  key: () => tone(800, .03, "square", .03),
  spin: () => tone(110, .8, "sawtooth", .06, 0, 40),
  lock: () => { tone(1200, .05); tone(600, .08, "square", .05, .06); },
  arrive: () => { tone(660, .15); tone(990, .28, "square", .05, .16); },
  ok: () => { tone(520, .1); tone(780, .2, "square", .05, .1); },
  no: () => { tone(300, .12); tone(160, .28, "square", .05, .12); }
};
addEventListener("pointerdown", () => { ac(); startCompass(); }, { once: true });

/* ---------- dots ---------- */
const setDots = on => { document.documentElement.dataset.dots = on ? "1" : "0"; store.set("tm.dots", on ? "1" : "0"); };
setDots(store.get("tm.dots") === "1");

/* ---------- firebase ---------- */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch { db = initializeFirestore(app, {}); }

/* ---------- open: 4-digit ID ---------- */
const hex = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const creds = async id => ({ email: (await hex("id:" + id)).slice(0, 24) + "@terminal.iosci.org", password: await hex("pw:" + id) });
const boxes = [...document.querySelectorAll("#boxes i")];
const idin = $("idin");
let busy = false, pendingId = null;

const setDigits = s => {
  boxes.forEach((b, i) => { b.textContent = s[i] || ""; b.classList.toggle("cur", i === s.length && s.length < 4); });
};
setDigits("");
idin.addEventListener("input", () => {
  const s = idin.value.replace(/\D/g, "").slice(0, 4); idin.value = s; setDigits(s); sfx.key();
  $("oerr").textContent = "";
  if (s.length === 4) submit(s);
});
$("open").addEventListener("pointerdown", e => { if (e.target.id !== "dice") setTimeout(() => idin.focus(), 0); });

const errText = e => {
  const c = (e && e.code) || "";
  if (c === "auth/network-request-failed") return "no net";
  if (c === "auth/too-many-requests") return "wait";
  return "✕";
};
async function enter(id) {
  const { email, password } = await creds(id);
  pendingId = id;
  try { await signInWithEmailAndPassword(auth, email, password); }
  catch (e) {
    if (!["auth/invalid-credential", "auth/user-not-found", "auth/invalid-login-credentials"].includes(e.code)) throw e;
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      updateProfile(auth.currentUser, { displayName: id }).catch(() => {});
      setDoc(doc(db, "agents", id), { uid: auth.currentUser.uid, at: serverTimestamp() }).catch(() => {});
    } catch (e2) {
      if (e2.code === "auth/email-already-in-use") await signInWithEmailAndPassword(auth, email, password);
      else throw e2;
    }
  }
}
async function submit(id) {
  if (busy) return; busy = true; $("boxes").classList.add("busy"); idin.blur();
  try { await enter(id); $("boxes").classList.remove("busy"); $("boxes").classList.add("inv"); sfx.lock(); }
  catch (e) {
    busy = false; $("boxes").classList.remove("busy"); $("oerr").textContent = errText(e);
    const b = $("boxes"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); sfx.no();
    idin.value = ""; setDigits("");
  }
}
$("dice").addEventListener("click", async () => {
  if (busy) return; busy = true; $("oerr").textContent = ""; idin.blur();
  let id = pad4(rnd(10000));
  for (let t = 0; t < 8; t++) {
    id = pad4(rnd(10000));
    try { if (!(await getDoc(doc(db, "agents", id))).exists()) break; } catch { break; }
  }
  const t0 = performance.now();
  while (performance.now() - t0 < 600) { setDigits(pad4(rnd(10000))); sfx.key(); await sleep(60); }
  setDigits(id); idin.value = id; sfx.lock(); await sleep(900);
  busy = false; submit(id);
});

/* ---------- geometry ---------- */
const rad = d => d * Math.PI / 180;
function hav(a, b) {
  const dLa = rad(b.lat - a.lat), dLo = rad(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
function brg(a, b) {
  const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const fmtD = m => m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1) + " km";
const fmtT = r => { const t = r.at && r.at.toMillis ? r.at.toMillis() : Date.now();
  return new Date(t).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); };

/* ---------- state ---------- */
let uid = null, agent = "", map = null, pos = null, follow = true, heading = 0, hasCompass = false, compassOn = false;
let mine = new Map(), active = null, draft = null, spinning = false, arriving = null;
let showAll = false, allDocs = new Map(), unsubMine = null, unsubAll = null, newRid = null;
const net = new Map(); // rid -> net rating (own reports, lazy)
let gMine, gTrail, gAll, meMk = null, tgMk = null;

const flash = (ms = 100) => { if (reduced) return; const f = $("flash"); f.hidden = false; setTimeout(() => { f.hidden = true; }, ms); };
const note = (t, dim = true) => { const l = $("line"); l.textContent = t; l.classList.toggle("dim", dim); };

/* ---------- compass ---------- */
const CMP = '<svg viewBox="-50 -50 100 100"><g class="ring"><circle r="44" fill="none" stroke="#fff" stroke-width="1"/>' +
  '<path d="M0-44V-33" stroke="#fff" stroke-width="3"/><path d="M0 44V40M44 0H40M-44 0H-40" stroke="#fff" stroke-width="1"/>' +
  '<g class="tg"><path d="M0-31L7-17H-7Z" fill="#fff"/></g></g><circle r="2" fill="#fff"/></svg>';
$("cmph").innerHTML = CMP; $("cmpt").innerHTML = CMP;
function drawCompass() {
  const tb = active && pos ? brg(pos, active) : null;
  document.querySelectorAll(".cmp").forEach(c => {
    c.querySelector(".ring").setAttribute("transform", "rotate(" + (-heading).toFixed(1) + ")");
    const t = c.querySelector(".tg"); c.classList.toggle("has", tb != null);
    if (tb != null) t.setAttribute("transform", "rotate(" + tb.toFixed(1) + ")");
  });
}
function oe(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
  else if (e.type === "deviceorientationabsolute" && e.alpha != null) h = 360 - e.alpha;
  if (h == null) return; hasCompass = true; heading = h; drawCompass();
}
function startCompass() {
  if (compassOn) return; compassOn = true;
  const attach = () => { addEventListener("deviceorientationabsolute", oe, true); addEventListener("deviceorientation", oe, true); };
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function")
    DeviceOrientationEvent.requestPermission().then(r => { if (r === "granted") attach(); }).catch(() => {});
  else attach();
}

/* ---------- map ---------- */
function initMap() {
  if (map) return;
  map = L.map("map", { zoomControl: false, zoomSnap: .5, worldCopyJump: true }).setView([51.5, -0.12], 13);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19, attribution: "Esri · © OpenStreetMap" }).addTo(map);
  gTrail = L.layerGroup().addTo(map); gMine = L.layerGroup().addTo(map); gAll = L.layerGroup();
  map.on("dragstart", () => { follow = false; });
  map.on("click", closeSheet);
}
const mkIcon = (r, mineFlag) => {
  const g = r.status !== "done" ? "○" : r.verdict > 0 ? "●" : "✕";
  const cls = "mk" + (mineFlag ? "" : " o2") + (r.rid === newRid ? " drop" : "");
  return L.divIcon({ className: "mkw", html: '<b class="' + cls + '">' + g + "</b>", iconSize: [0, 0] });
};
function drawMine() {
  if (!map) return;
  gMine.clearLayers(); gTrail.clearLayers();
  const arr = [...mine.values()].sort((a, b) => a.seq - b.seq), done = arr.filter(r => r.status === "done");
  for (let i = 1; i < done.length; i++) {
    const last = i === done.length - 1 && done[i].rid === newRid;
    L.polyline([[done[i - 1].lat, done[i - 1].lng], [done[i].lat, done[i].lng]],
      { color: "#fff", weight: 1, dashArray: "3 7", opacity: .9, className: last ? "seg-new" : "" }).addTo(gTrail);
  }
  arr.forEach(r => L.marker([r.lat, r.lng], { icon: mkIcon(r, true) }).on("click", () => openReport(r)).addTo(gMine));
  newRid = null;
}
function drawAll() {
  if (!map) return; gAll.clearLayers();
  [...allDocs.values()].filter(r => r.uid !== uid).forEach(r =>
    L.marker([r.lat, r.lng], { icon: mkIcon(r, false) }).on("click", () => openReport(r)).addTo(gAll));
}
function setTarget() {
  if (tgMk) { map.removeLayer(tgMk); tgMk = null; }
  if (active) tgMk = L.marker([active.lat, active.lng], { icon: L.divIcon({ className: "mkw", html: '<div class="tgm"><i></i><b></b></div>', iconSize: [0, 0] }), interactive: false }).addTo(map);
}

/* ---------- location ---------- */
function startGeo() {
  if (!navigator.geolocation) { note("location off"); return; }
  navigator.geolocation.watchPosition(onPos, () => note("location off"), { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function onPos(p) {
  const first = !pos;
  pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
  if (!hasCompass && p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > 1) { heading = p.coords.heading; }
  if (!meMk) meMk = L.marker([pos.lat, pos.lng], { icon: L.divIcon({ className: "mkw me", html: "<b></b><i></i>", iconSize: [0, 0] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  else meMk.setLatLng([pos.lat, pos.lng]);
  if (first) { map.setView([pos.lat, pos.lng], 16, { animate: false }); if ($("line").textContent === "location off") note(""); }
  else if (follow && !spinning) map.panTo([pos.lat, pos.lng], { animate: true, duration: .4 });
  updateTravel(); drawCompass();
}
$("brec").addEventListener("click", () => { follow = true; if (pos) map.flyTo([pos.lat, pos.lng], Math.max(map.getZoom(), 15), { duration: .5 }); });

/* ---------- spin (randonautica method) ---------- */
async function rand16(n) {
  const a = new Uint16Array(n); crypto.getRandomValues(a);
  return { arr: a, src: "L" };
}
async function generate(c) {
  const { arr, src } = await rand16(2 * N + 2);
  const pts = []; const cnt = new Array(G * G).fill(0);
  const cs = 2 * R / G, cell = (x, y) => Math.min(G - 1, Math.floor((x + R) / (2 * R) * G)) + Math.min(G - 1, Math.floor((y + R) / (2 * R) * G)) * G;
  for (let i = 0; i < N; i++) {
    const r = R * Math.sqrt(arr[2 * i] / 65536), th = 2 * Math.PI * arr[2 * i + 1] / 65536;
    const x = r * Math.cos(th), y = r * Math.sin(th), k = cell(x, y); cnt[k]++;
    pts.push({ x, y, c: k });
  }
  const mean = N * cs * cs / (Math.PI * R * R);
  const valid = []; const ctr = k => ({ x: ((k % G) + .5) * cs - R, y: (Math.floor(k / G) + .5) * cs - R });
  for (let k = 0; k < G * G; k++) { const q = ctr(k); if (Math.hypot(q.x, q.y) <= R) valid.push(k); }
  const type = arr[2 * N] % 3, jit = () => rnd(1000) / 1e6;
  const score = k => type === 0 ? cnt[k] : type === 1 ? -cnt[k] : Math.abs((cnt[k] - mean) / Math.sqrt(mean));
  let best = valid[0], bs = -Infinity;
  valid.forEach(k => { const s = score(k) + jit(); if (s > bs) { bs = s; best = k; } });
  const mem = pts.filter(p => p.c === best); let tx, ty;
  if (type !== 1 && mem.length && cnt[best] >= mean) { tx = mem.reduce((s, p) => s + p.x, 0) / mem.length; ty = mem.reduce((s, p) => s + p.y, 0) / mem.length; }
  else { const q = ctr(best); tx = q.x; ty = q.y; }
  const ll = (x, y) => ({ lat: c.lat + y / 111320, lng: c.lng + x / (111320 * Math.cos(rad(c.lat))) });
  const t = ll(tx, ty);
  return { type: ["attractor", "void", "anomaly"][type], src, lat: t.lat, lng: t.lng, cell: best, pts: pts.map(p => ({ ...ll(p.x, p.y), c: p.c })), dist: hav(c, t) };
}
function playSpin(g) {
  return new Promise(res => {
    if (reduced) { res(); return; }
    const cv = $("fx"), x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight; cv.hidden = false;
    const P = g.pts.map(p => { const q = map.latLngToContainerPoint([p.lat, p.lng]); return { x: q.x, y: q.y, keep: p.c === g.cell }; });
    const T = map.latLngToContainerPoint([g.lat, g.lng]), t0 = performance.now(); let locked = false;
    const f = now => {
      const t = now - t0; x.clearRect(0, 0, cv.width, cv.height); x.fillStyle = "#fff"; x.strokeStyle = "#fff";
      const show = Math.min(P.length, Math.floor(t / 350 * P.length));
      for (let i = 0; i < show; i++) {
        const p = P[i]; let px = p.x, py = p.y;
        if (t > 900) {
          if (!p.keep) { if (t > 1400 || Math.random() < (t - 900) / 500) continue; }
          else { const k = Math.min(1, Math.max(0, (t - 1300) / 500)); px = p.x + (T.x - p.x) * k; py = p.y + (T.y - p.y) * k; }
        }
        x.fillRect(px - 1, py - 1, 2, 2);
      }
      if (t > 1800) {
        if (!locked) { locked = true; sfx.lock(); }
        x.lineWidth = 1; x.beginPath(); x.arc(T.x, T.y, Math.min(70, (t - 1800) / 400 * 70), 0, 7); x.stroke();
      }
      if (t < 2300) requestAnimationFrame(f); else { x.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; res(); }
    };
    requestAnimationFrame(f);
  });
}
async function spin() {
  if (spinning || draft || active) return;
  if (!pos) { note("location off", false); return; }
  spinning = true; startCompass(); ac(); sfx.spin(); flash(80);
  const c = { lat: pos.lat, lng: pos.lng };
  map.setView([c.lat, c.lng], 14.5, { animate: false });
  const g = await generate(c); g.from = c;
  await playSpin(g);
  draft = g; spinning = false; route();
}
$("bspin").addEventListener("click", spin);

/* ---------- blind view pad ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let drawing = false, lx = 0, ly = 0, inked = false;
const cp = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 256, y: (e.clientY - r.top) / r.height * 256 }; };
cv.addEventListener("pointerdown", e => { drawing = true; const p = cp(e); lx = p.x; ly = p.y; cv.setPointerCapture(e.pointerId); cx.fillStyle = "#fff"; cx.fillRect(lx - 1, ly - 1, 2, 2); inked = true; });
cv.addEventListener("pointermove", e => { if (!drawing) return; const p = cp(e); cx.strokeStyle = "#fff"; cx.lineWidth = 2; cx.lineCap = "round"; cx.beginPath(); cx.moveTo(lx, ly); cx.lineTo(p.x, p.y); cx.stroke(); lx = p.x; ly = p.y; });
const endDraw = () => { drawing = false; };
cv.addEventListener("pointerup", endDraw); cv.addEventListener("pointercancel", endDraw);
function openPad() {
  cx.fillStyle = "#000"; cx.fillRect(0, 0, 256, 256); inked = false; $("btxt").value = "";
  $("pinfo").textContent = TG[draft.type] + " " + draft.type + " · " + fmtD(draft.dist); $("psrc").textContent = draft.src;
  const b = $("tbar"); b.classList.remove("run"); void b.offsetWidth; b.classList.add("run");
}
$("pcancel").addEventListener("click", () => { draft = null; sfx.no(); route(); });
const nextSeq = () => [...mine.values()].reduce((m, r) => Math.max(m, r.seq || 0), 0) + 1;
$("pgo").addEventListener("click", () => {
  if (!draft) return; const n = nextSeq(), rid = agent + "-" + pad4(n), d = draft;
  const data = { uid, agent, seq: n, rid, type: d.type, src: d.src, lat: d.lat, lng: d.lng, fromLat: d.from.lat, fromLng: d.from.lng,
    intention: INTENT, blind: { text: $("btxt").value.trim().slice(0, 1000), img: inked ? cv.toDataURL("image/png") : "" },
    status: "pending", verdict: 0, found: "", photo: "", at: serverTimestamp() };
  draft = null; sfx.lock();
  setDoc(doc(db, "reports", rid), data).catch(() => note("sync ✕", false));
  route();
});

/* ---------- travel ---------- */
function updateTravel() {
  if (!active || !pos || active.status !== "pending") return;
  const d = hav(pos, active); $("dist").textContent = fmtD(d);
  $("travel").querySelector(".cmp").style.setProperty("--bd", Math.max(.15, Math.min(2, d / 500)).toFixed(2) + "s");
  if (d <= Math.max(ARR, Math.min(pos.acc || 0, 60)) && arriving !== active.rid) {
    arriving = active.rid; sfx.arrive(); flash(180);
    updateDoc(doc(db, "reports", active.rid), { status: "arrived", arrivedAt: serverTimestamp() }).catch(() => { arriving = null; });
  }
}
$("babort").addEventListener("click", () => {
  if (!active) return; sfx.no();
  deleteDoc(doc(db, "reports", active.rid)).catch(() => {});
  mine.delete(active.rid); active = null; setTarget(); drawMine(); route();
});

/* ---------- report ---------- */
let photoData = "";
$("bphoto").addEventListener("click", () => $("pfile").click());
$("pfile").addEventListener("change", () => {
  const f = $("pfile").files[0]; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const s = Math.min(1, 720 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    photoData = c.toDataURL("image/jpeg", .55); URL.revokeObjectURL(u); $("pprev").src = photoData; $("pprev").hidden = false;
  };
  img.src = u; $("pfile").value = "";
});
function fillRep() {
  $("rid").textContent = active.rid; $("rtype").textContent = TG[active.type] + " " + active.type;
  $("rblind").src = active.blind && active.blind.img || ""; $("rblind").hidden = !(active.blind && active.blind.img);
  $("rbtxt").textContent = active.blind && active.blind.text || "";
}
function finish(v) {
  if (!active) return; const rid = active.rid;
  const data = { status: "done", verdict: v, found: $("found").value.trim().slice(0, 2000), photo: photoData, doneAt: serverTimestamp() };
  newRid = rid; v > 0 ? sfx.ok() : sfx.no(); flash(60);
  updateDoc(doc(db, "reports", rid), data).catch(() => note("sync ✕", false));
  photoData = ""; $("found").value = ""; $("pprev").hidden = true;
}
$("byes").addEventListener("click", () => finish(1));
$("bno").addEventListener("click", () => finish(-1));

/* ---------- routing ---------- */
let lastRid = null;
function route() {
  const pend = active && active.status === "pending", arr = active && active.status === "arrived";
  $("pad").hidden = !draft; $("rep").hidden = !(arr && !draft); $("travel").hidden = !(pend && !draft);
  $("dockhome").hidden = !!(draft || active);
  if (draft && $("pad").dataset.o !== "1") { $("pad").dataset.o = "1"; openPad(); }
  if (!draft) $("pad").dataset.o = "0";
  if (arr && $("rep").dataset.r !== active.rid) { $("rep").dataset.r = active.rid; fillRep(); }
  if (!arr) $("rep").dataset.r = "";
  const rid = active ? active.rid : null; if (rid !== lastRid) { lastRid = rid; arriving = null; setTarget(); }
  if (pend) updateTravel();
  drawCompass();
}

/* ---------- reports data ---------- */
const RANKS = ["I", "II", "III", "IV", "V"], TH = [0, 3, 8, 20, 50];
let rankLvl = null;
function score() {
  const d = [...mine.values()].filter(r => r.status === "done");
  return d.length + 2 * d.filter(r => r.verdict > 0).length + d.reduce((s, r) => s + (net.get(r.rid) || 0), 0);
}
function updateRank() {
  const s = score(); let l = 0; TH.forEach((t, i) => { if (s >= t) l = i; });
  $("rk").textContent = RANKS[l];
  const saved = parseInt(store.get("tm.rank" + agent), 10);
  if (!isNaN(saved) && l > saved) { const r = $("rk"); r.classList.remove("flick"); void r.offsetWidth; r.classList.add("flick"); sfx.ok(); }
  if (isNaN(saved) || l > saved) store.set("tm.rank" + agent, String(l));
  rankLvl = l;
}
async function loadNet() {
  const done = [...mine.values()].filter(r => r.status === "done").sort((a, b) => b.seq - a.seq).slice(0, 20);
  await Promise.all(done.map(async r => {
    try { const s = await getDocs(collection(db, "reports", r.rid, "ratings")); let n = 0; s.forEach(d => { n += d.data().v || 0; }); net.set(r.rid, n); } catch {}
  }));
  updateRank();
}
function subMine() {
  unsubMine = onSnapshot(query(collection(db, "reports"), where("uid", "==", uid)), snap => {
    mine = new Map(); snap.forEach(d => mine.set(d.id, { ...d.data(), rid: d.id }));
    const cur = [...mine.values()].filter(r => r.status === "pending" || r.status === "arrived").sort((a, b) => b.seq - a.seq)[0] || null;
    active = cur; drawMine(); route(); updateRank();
    if (!subMine.once) { subMine.once = true; loadNet(); }
  }, e => console.error(e));
}
function subAll() {
  if (unsubAll) return;
  unsubAll = onSnapshot(query(collection(db, "reports"), where("status", "==", "done"), limit(400)), snap => {
    allDocs = new Map(); snap.forEach(d => allDocs.set(d.id, { ...d.data(), rid: d.id })); drawAll();
  }, e => console.error(e));
}
$("bglobal").addEventListener("click", () => {
  showAll = !showAll; $("bglobal").classList.toggle("on", showAll); sfx.key();
  if (showAll) { subAll(); gAll.addTo(map); } else map.removeLayer(gAll);
});

/* ---------- sheets ---------- */
const sheet = $("sheet"), sbody = $("sbody");
const openSheet = html => { sbody.innerHTML = html; sheet.classList.add("open"); };
function closeSheet() { sheet.classList.remove("open"); }
$("sx").addEventListener("click", closeSheet);

$("blist").addEventListener("click", () => {
  if (sheet.classList.contains("open") && sbody.dataset.k === "list") { closeSheet(); return; }
  const arr = [...mine.values()].sort((a, b) => b.seq - a.seq);
  openSheet(arr.length ? arr.map(r => '<button class="li" data-r="' + esc(r.rid) + '"><span>' + esc(r.rid) + " " +
    (r.status !== "done" ? "○" : r.verdict > 0 ? "●" : "✕") + " " + TG[r.type] + '</span><span class="g">' + esc(fmtT(r)) + "</span></button>").join("") : '<p class="g">–</p>');
  sbody.dataset.k = "list";
  sbody.querySelectorAll(".li").forEach(b => b.addEventListener("click", () => { const r = mine.get(b.dataset.r); if (r) { map.flyTo([r.lat, r.lng], 16, { duration: .5 }); openReport(r); } }));
});

async function openReport(r) {
  const own = r.uid === uid;
  const head = "<h2>" + esc(r.rid) + " " + (r.status !== "done" ? "○" : r.verdict > 0 ? "●" : "✕") + " " + TG[r.type] + ' <span class="g">' + esc(fmtT(r)) + " · " + esc(r.src || "") + "</span></h2>";
  let b = '<div class="bl">';
  if (r.blind && r.blind.img) b += '<img src="' + esc(r.blind.img) + '" alt="">';
  if (r.blind && r.blind.text) b += "<p>" + esc(r.blind.text) + "</p>";
  if (r.found) b += '<p class="g">' + esc(r.found) + "</p>";
  if (r.photo) b += '<img class="gray" src="' + esc(r.photo) + '" alt="">';
  b += '<div class="rt" id="rt"></div></div>';
  openSheet(head + b); sbody.dataset.k = "rep";
  if (r.status !== "done") return;
  try {
    const s = await getDocs(collection(db, "reports", r.rid, "ratings")); let n = 0, my = 0;
    s.forEach(d => { const v = d.data().v || 0; n += v; if (d.id === uid) my = v; });
    if (own) net.set(r.rid, n);
    const rt = $("rt"); if (!rt || sbody.dataset.k !== "rep") return;
    rt.innerHTML = (own ? "" : '<button class="o' + (my > 0 ? " on" : "") + '" data-v="1" aria-label="Up">▲</button><button class="o' + (my < 0 ? " on" : "") + '" data-v="-1" aria-label="Down">▼</button>') + "<span>" + (n > 0 ? "+" : "") + n + "</span>";
    rt.querySelectorAll("button").forEach(bt => bt.addEventListener("click", async () => {
      const v = parseInt(bt.dataset.v, 10); sfx.key();
      try { await setDoc(doc(db, "reports", r.rid, "ratings", uid), { uid, v }); } catch { note("sync ✕", false); return; }
      openReport(r);
    }));
  } catch {}
}

$("bset").addEventListener("click", () => {
  if (sheet.classList.contains("open") && sbody.dataset.k === "set") { closeSheet(); return; }
  const on = document.documentElement.dataset.dots === "1";
  openSheet('<div class="st"><span>dots</span><button id="sdots" class="o' + (on ? " on" : "") + '" type="button">' + (on ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>♪</span><button id="smute" class="o' + (!muted ? " on" : "") + '" type="button">' + (!muted ? "●" : "○") + '</button></div>' +
    '<div class="st"><span>⏻</span><button id="sout" class="o" type="button">⏻</button></div>');
  sbody.dataset.k = "set";
  $("sdots").addEventListener("click", e => { const v = document.documentElement.dataset.dots !== "1"; setDots(v); e.currentTarget.classList.toggle("on", v); e.currentTarget.textContent = v ? "●" : "○"; });
  $("smute").addEventListener("click", e => { muted = !muted; store.set("tm.mute", muted ? "1" : "0"); e.currentTarget.classList.toggle("on", !muted); e.currentTarget.textContent = !muted ? "●" : "○"; sfx.key(); });
  $("sout").addEventListener("click", () => { signOut(auth).then(() => location.reload()).catch(() => location.reload()); });
});

/* ---------- daily line ---------- */
function daily() {
  const day = Math.floor(Date.now() / 864e5), t = LINES[day % LINES.length], l = $("line");
  if (store.get("tm.day") === String(day) || reduced) { l.textContent = t; l.classList.add("dim"); return; }
  store.set("tm.day", String(day)); l.classList.remove("dim"); l.textContent = "";
  [...t].forEach((ch, i) => setTimeout(() => { l.textContent += ch; if (i % 2 === 0) sfx.key(); }, 700 + i * 55));
  setTimeout(() => { if (!$("line").textContent.startsWith("location")) l.classList.add("dim"); }, 700 + t.length * 55 + 5000);
}

/* ---------- session ---------- */
onAuthStateChanged(auth, user => {
  if (!user) { $("app").hidden = true; $("open").hidden = false; busy = false; return; }
  uid = user.uid; agent = user.displayName || pendingId || store.get("tm.id") || "";
  if (!/^\d{4}$/.test(agent)) { signOut(auth); return; }
  store.set("tm.id", agent);
  setTimeout(() => {
    $("open").hidden = true; $("app").hidden = false; $("me").textContent = agent;
    initMap(); map.invalidateSize(); startGeo(); subMine(); daily(); route();
  }, $("boxes").classList.contains("inv") ? 260 : 0);
});

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));
</script>
