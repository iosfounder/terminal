<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diksyonær">
<title>Diksyonær</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--fg:#fff;--soft:#d2d2d2;--mid:#8a8a8a;--dim:#666;
  --line:#2a2a2a;--panel:#0d0d0d;--raised:#161616;--accent:#b3a6d6;--accent-a:rgba(179,166,214,.16);
  --pad:clamp(.75rem,3.4vw,1.5rem);--radius:clamp(8px,2vw,14px);--fs:1;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color-scheme:dark;font-size:calc(100% * var(--fs))}
html.locked,body.locked{overflow:hidden}
body{min-height:100dvh;background:var(--bg);color:var(--fg);font-family:'Libertinus Sans','Trebuchet MS','Segoe UI',Arial,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg.i{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:clamp(.6rem,2vw,.9rem);padding:calc(.5rem + var(--st)) calc(var(--pad) + var(--sr)) .5rem calc(var(--pad) + var(--sl));background:var(--bg);border-bottom:2px solid var(--fg)}
#hdr h1{font-size:clamp(1rem,3.4vw,1.35rem);font-weight:400;line-height:1.15;white-space:nowrap}
.hl,.hr{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:.35rem}
.hl{left:calc(var(--pad) + var(--sl))}.hr{right:calc(var(--pad) + var(--sr))}
.rb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);border-radius:50%;transition:border-color .15s,background .15s,transform .1s}
.rb[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.rb[aria-pressed=true] svg.i{fill:currentColor}
@media(hover:hover){.rb:hover{border-color:var(--accent);background:var(--raised)}}
.rb:active{transform:scale(.9);background:var(--raised);box-shadow:inset 0 2px 6px rgba(0,0,0,.75)}
#rnd{position:relative;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;border-radius:50%}
#rnd img{display:block;height:clamp(2.2rem,5.5vw,3.2rem);width:auto;aspect-ratio:1;object-fit:contain}
@media(pointer:coarse){.rb::after,#rnd::after{content:'';position:absolute;inset:-6px;border-radius:50%}}

/* toolbar */
#tb{position:sticky;top:var(--hh,56px);z-index:15;background:var(--bg);padding:.65rem calc(var(--pad) + var(--sr)) .45rem calc(var(--pad) + var(--sl));border-bottom:1px solid var(--line)}
.in{max-width:820px;margin:0 auto}
.sw{position:relative}
.sw .mag{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--mid);width:18px;height:18px}
#q{width:100%;height:46px;padding:0 2.9rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:max(16px,1rem);outline:0;-webkit-appearance:none;appearance:none;transition:border-color .15s}
#q::placeholder{color:var(--dim)}
#q:focus{border-color:var(--accent)}
#q::-webkit-search-cancel-button{display:none}
#qc{position:absolute;right:5px;top:5px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:50%;color:var(--mid)}
#qc svg{width:16px;height:16px}
.chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding-top:.55rem;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.28rem .72rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mid);font-size:.8rem;white-space:nowrap;transition:border-color .15s,color .15s}
.chip small{opacity:.6;margin-left:.3em;font-size:.72rem;font-variant-numeric:tabular-nums}
@media(hover:hover){.chip:hover{border-color:var(--accent);color:var(--fg)}}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#000}
.sep{flex:none;width:1px;background:var(--line);margin:0 .15rem}

/* list */
main{max-width:820px;margin:0 auto;padding:0 calc(var(--pad) + var(--sr)) calc(2rem + var(--sb)) calc(var(--pad) + var(--sl))}
body.rail main{padding-right:calc(var(--pad) + var(--sr) + 1.3rem)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mid);padding:.55rem 0 .5rem;font-variant-numeric:tabular-nums}
.lk{background:none;border:0;color:var(--accent);font-size:.8rem;display:inline-flex;gap:.3rem;align-items:center}
.lk svg{width:14px;height:14px}
.lh{position:sticky;top:var(--sh,120px);z-index:5;background:var(--bg);padding:.45rem .1rem .3rem;color:var(--accent);font-size:.85rem;font-weight:400;letter-spacing:.1em}
.e{display:block;width:100%;text-align:left;padding:.8rem .95rem;margin-bottom:.5rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);position:relative;transition:border-color .15s,transform .1s;content-visibility:auto;contain-intrinsic-size:auto 92px}
@media(hover:hover){.e:hover{border-color:var(--accent)}}
.e:active,.e:focus-visible{border-color:var(--accent);transform:scale(.99)}
.e .w{font-weight:500;font-size:1.12rem;overflow-wrap:anywhere}
.o{color:var(--dim);font-weight:400}
.p{display:inline-block;margin-left:.4rem;padding:0 .45rem;border:1px solid var(--line);border-radius:999px;font-size:.72rem;color:var(--mid);font-style:italic;vertical-align:middle;line-height:1.5;white-space:nowrap}
.e .m{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--soft);font-size:.92rem;margin-top:.18rem}
.e .m b{color:var(--dim);font-weight:400;font-size:.8em;margin-right:.15em}
.e .x{display:block;color:var(--mid);font-size:.85rem;font-style:italic;margin-top:.22rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .s{display:none;position:absolute;right:.75rem;top:.8rem;width:14px;height:14px;color:var(--accent)}
.e.on .s{display:block}.e.on{padding-right:2rem}
mark{background:var(--accent-a);color:inherit;border-radius:3px;box-shadow:0 0 0 1px rgba(179,166,214,.35)}
.msg{padding:1.6rem 0;color:var(--mid);font-size:.9rem;text-align:center}
.sug{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;margin-top:.7rem}
.wotd{margin:.2rem 0 1.1rem}
.lrn{margin:.2rem 0 1rem;padding:.9rem 1rem;border:1px solid rgba(179,166,214,.45);border-radius:calc(var(--radius) + 2px);background:linear-gradient(180deg,rgba(179,166,214,.09),var(--panel) 75%)}
.lrn-t{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.lrn-t b{display:block;font-weight:500;font-size:1.02rem;color:var(--fg)}
.lrn-t span{color:var(--mid);font-size:.85rem}
.lrn-t .btn{padding:.6rem 1.2rem;white-space:nowrap}
.lrn-p{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.6rem;margin-top:.75rem;font-size:.76rem;color:var(--mid)}
.lrn-p .bg{height:4px;background:var(--raised);border-radius:2px;overflow:hidden}
.lrn-p .bg i{display:block;height:100%;background:var(--accent);transition:width .3s}
a.rb{color:inherit;text-decoration:none}
.lrn-b{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.75rem}
.lrn-b .btn{padding:.6rem .3rem;white-space:nowrap;font-size:.86rem}
.lrn-b .btn small{font-size:.7rem;opacity:.75}
.play{display:flex;align-items:center;gap:1rem;width:100%;margin:.8rem 0 1rem;padding:1.2rem 1.1rem;font:inherit;color:var(--fg);text-align:left;background:linear-gradient(180deg,rgba(179,166,214,.13),var(--panel) 80%);border:1px solid rgba(179,166,214,.5);border-radius:calc(var(--radius) + 4px);cursor:pointer}
.play:active{transform:scale(.99)}
.playb{flex:0 0 auto;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center}
.playb svg{width:1.6rem;height:1.6rem}.playb svg path{transform:translateX(1px)}
.pt b{display:block;font-size:1.3rem;font-weight:500}.pt span{display:block;color:var(--mid);font-size:.85rem;margin-top:.15rem}
body.idle #ch,body.idle .meta,body.idle #rail,body.idle #sn{display:none!important}
.card.rul{min-height:auto;flex-shrink:0;align-items:stretch;justify-content:flex-start;text-align:left;gap:.5rem;cursor:default}
.rul .nw{align-self:flex-start}
.rul h3{font-size:1.25rem;font-weight:500;margin:.1rem 0 .2rem}
.rul p{color:var(--soft);line-height:1.55;font-size:.95rem;text-align:left}
.rul .brg{color:var(--mid);font-size:.85rem;border-left:2px solid var(--accent);padding-left:.6rem;margin-top:.6rem}
.rex{display:flex;flex-direction:column;gap:.4rem;margin-top:.8rem}
.rx{display:flex;flex-direction:column;align-items:flex-start;font:inherit;text-align:left;padding:.55rem .75rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.rx .rk{font-size:1rem}.rx .re{font-size:.8rem;color:var(--mid)}
.mi.pu .pn{min-width:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.mi.pu small{display:block;color:var(--mid);font-size:.78rem}
.mi.pu.nxt{background:var(--accent-a)}
.card.sp{min-height:auto;gap:.9rem;cursor:default}
.sp .en{font-size:clamp(1.1rem,4.4vw,1.35rem);line-height:1.45;color:var(--fg)}
.sp .kr{font-size:clamp(1.15rem,4.6vw,1.45rem);line-height:1.45;color:var(--accent)}
.sp .kr.ok{color:#8fd19e}.sp .kr.no{color:#e59a9a}
.bld{min-height:3.2rem;width:100%;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;align-items:center;padding:.6rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bld .ph{color:var(--dim);font-size:.85rem}
.bank{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;width:100%;max-width:520px}
.tile{font:inherit;font-size:1.02rem;padding:.5rem .8rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-bottom-width:2px;border-radius:10px;cursor:pointer}
.tile.on{border-color:rgba(179,166,214,.6)}
.tile.gone{visibility:hidden}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.opt{font:inherit;font-size:.98rem;text-align:left;padding:.75rem .9rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt.ok{border-color:#8fd19e;color:#8fd19e}.opt.no{border-color:#e59a9a;color:#e59a9a;opacity:.7}
.lin{width:100%;font:inherit;font-size:1.05rem;margin-top:.8rem;padding:.7rem .9rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px}
.snd{display:flex;gap:.5rem;justify-content:center;margin:.4rem 0}.snd .btn{flex:0 1 auto;padding:.6rem 1.1rem}
.vnote{color:var(--dim);font-size:.75rem;text-align:center;margin-top:.6rem}
.tip{width:100%;max-width:520px;font-size:.85rem;line-height:1.45;color:var(--soft);padding:.7rem .9rem;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);background:var(--panel)}
.tip b{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:.2rem}
.gn{padding:.7rem .8rem;border-bottom:1px solid var(--line);font-size:.92rem;line-height:1.45;color:var(--soft)}
.pg{color:var(--dim);font-size:.85em}
.nw{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ctl .btn small{display:block;font-size:.7rem;opacity:.6;margin-top:.15rem;font-weight:400}
.wotd .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .4rem .2rem;display:flex;justify-content:space-between}
.wotd .e{border-color:rgba(179,166,214,.45);background:linear-gradient(180deg,rgba(179,166,214,.07),var(--panel) 70%)}
.sp{padding:1.4rem 1.2rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-size:.9rem;line-height:1.6;color:var(--mid);margin-top:1rem}
.sp h3{color:var(--accent);font-weight:500;margin-bottom:.8rem;font-size:1rem}
.sp p{margin-bottom:.7rem}
.sp code{background:#000;padding:.1rem .4rem;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;color:#ddd}
.sp .err{color:#e29a9a;font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border:1px solid var(--line);background:var(--raised);border-radius:999px;font-size:.88rem;transition:border-color .15s,background .15s}
@media(hover:hover){.btn:hover{border-color:var(--accent)}}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#000}
.btn:disabled{opacity:.35}

/* letter rail */
#rail{position:fixed;right:calc(.25rem + var(--sr));top:calc(var(--sh,120px) + .5rem);bottom:calc(.75rem + var(--sb));z-index:12;display:flex;flex-direction:column;justify-content:space-around;align-items:center;width:1.3rem;touch-action:none;user-select:none;-webkit-user-select:none}
#rail span{font-size:.62rem;color:var(--mid);line-height:1;padding:1px 0;width:100%;text-align:center}
#rail span.on{color:var(--accent)}
#bubble{position:fixed;right:2.6rem;z-index:30;width:3rem;height:3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#000;font-size:1.4rem;pointer-events:none;transform:translateY(-50%)}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#000;height:100dvh;overscroll-behavior:contain}
.ov.open{display:flex}
.ov.op{animation:fi .35s ease-out both}
.ov.op .body{animation:fs .5s .06s cubic-bezier(.22,1,.36,1) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fs{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.bar{flex:none;display:flex;align-items:center;gap:.15rem;padding:calc(.35rem + var(--st)) calc(.6rem + var(--sr)) .35rem calc(.6rem + var(--sl));border-bottom:1px solid var(--line)}
.bar .t{flex:1;min-width:0;font-size:.85rem;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;padding-left:.4rem}
.bb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:none;border:1px solid transparent;border-radius:50%;transition:background .15s,border-color .15s}
.bb:disabled{opacity:.28;cursor:default}
.bb[aria-pressed=true]{color:var(--accent)}
.bb[aria-pressed=true] svg.i{fill:currentColor}
@media(hover:hover){.bb:hover:not(:disabled){background:var(--raised);border-color:var(--line)}}
.bb:active:not(:disabled){background:var(--raised)}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:.9rem calc(var(--pad) + var(--sr)) calc(2.5rem + var(--sb)) calc(var(--pad) + var(--sl))}
.d{max-width:760px;margin:0 auto}
.d h2{font-size:clamp(2rem,8.5vw,3rem);font-weight:400;line-height:1.1;overflow-wrap:anywhere}
.tags{margin:.7rem 0 .2rem;display:flex;flex-wrap:wrap;gap:.35rem}
.tags .p{margin:0;font-size:.8rem;padding:.08rem .6rem}
.tags .p i{font-style:normal;color:var(--dim);margin-left:.3em}
.forms{color:var(--mid);font-size:.88rem;margin-top:.5rem}
.forms b{font-weight:500;color:var(--soft)}
.l{margin:1.5rem 0 .6rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:400;display:flex;align-items:center;gap:.6rem}
.l::after{content:'';flex:1;height:1px;background:var(--line)}
.sense{display:grid;grid-template-columns:1.6rem 1fr;gap:0 .2rem;margin-bottom:1rem}
.sense .n{color:var(--dim);font-variant-numeric:tabular-nums;padding-top:.1rem}
.sense .g{font-size:1.1rem;line-height:1.35}
.sense .g .p{margin-left:.45rem}
.sense.one{grid-template-columns:1fr}.sense.one .n{display:none}
.gw{cursor:pointer;border-radius:3px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
@media(hover:hover){.gw:hover{text-decoration-color:var(--dim)}}
.ex{border-left:2px solid var(--accent);padding:.1rem 0 .1rem .9rem;margin:.55rem 0 .2rem}
.ex p{font-size:1rem}
.ex .tr{color:var(--mid);font-size:.94rem;margin-top:.15rem}
.ex .src{font-size:.78rem;color:var(--dim);margin-top:.25rem}
.ex .src button{background:none;border:0;color:var(--accent);font-size:inherit;padding:0}
.ww{cursor:pointer;border-radius:3px;transition:background .12s}
@media(hover:hover){.ww:hover{background:var(--raised)}}
.ww.h{color:var(--accent)}
.rel{display:flex;flex-wrap:wrap;gap:.4rem}
.rel button{padding:.35rem .75rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:.88rem;text-align:left;max-width:100%;transition:border-color .15s}
.rel button span{color:var(--mid);margin-left:.4em;font-size:.82em}
@media(hover:hover){.rel button:hover{border-color:var(--accent)}}
.more{margin-top:.5rem}

/* sheet */
#M{background:rgba(0,0,0,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);justify-content:flex-end;align-items:center}
#M .sheet{width:100%;max-width:560px;max-height:86dvh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
@media(min-width:640px){#M{justify-content:center}#M .sheet{border-bottom:1px solid var(--line);border-radius:var(--radius)}}
#M .bar{border-bottom:1px solid var(--line);padding-top:.35rem}
#M .body{padding:.6rem .6rem calc(1rem + var(--sb))}
.mi{display:flex;align-items:center;gap:.85rem;width:100%;padding:.75rem .8rem;background:none;border:0;border-radius:10px;text-align:left;font-size:.98rem}
.mi svg.i{color:var(--accent);flex:none}
.mi .r{margin-left:auto;color:var(--mid);font-size:.82rem;font-variant-numeric:tabular-nums}
@media(hover:hover){.mi:hover{background:var(--raised)}}
.mi:active{background:var(--raised)}
.hr2{height:1px;background:var(--line);margin:.35rem .8rem}
.seg{display:flex;gap:.3rem;padding:.2rem .8rem .7rem;flex-wrap:wrap}
.seg .chip{font-size:.85rem;padding:.35rem .85rem}
.sl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);padding:.8rem .8rem .45rem}
.stat{display:grid;grid-template-columns:7.5rem 1fr 3rem;gap:.45rem;align-items:center;padding:.25rem .8rem;font-size:.88rem}
.stat .bg{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.stat .bg i{display:block;height:100%;background:var(--accent);border-radius:3px}
.stat .v{text-align:right;color:var(--mid);font-variant-numeric:tabular-nums}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1rem;padding:.4rem .8rem;font-size:.88rem;color:var(--soft)}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.05rem .4rem;background:#000;color:var(--fg);white-space:nowrap}

/* study */
#S .body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.1rem}
#S .body>.prog{flex:none;margin-bottom:.2rem}
#S .body>.prog+*{margin-top:auto}
#S .body>.ctl:last-child{margin-top:auto}
#S .body>.done{margin:auto 0}

  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(['recent','stats','keys','grammar'].includes(a)) return sheet(a);
  if(a==='starred'){ S.star = true; $('fv').setAttribute('aria-pressed', true); dirty = true; closeTop(); }
  else if(a==='random'){ openV(randomPick()); }
  else if(a==='clearhist'){ hist=[]; ls.s(K.hist, hist); sheet('recent'); }
  else if(a==='export'){
    const rows = all.filter(e => stars.has(e.key));
    if(!rows.length){ toast('No starred entries'); return; }
    const blob = new Blob(['﻿'+rows.map(e => e.row.join('\t')).join('\n')], { type:'text/tab-separated-values' });
    const u = URL.createObjectURL(blob), aEl = document.createElement('a');
    aEl.href = u; aEl.download = 'diksyonaer-starred.tsv'; document.body.appendChild(aEl); aEl.click(); aEl.remove();
    setTimeout(() => URL.revokeObjectURL(u), 2000); toast(rows.length+' entries exported');
  }
  else if(a==='signin'){ signInG(); }
  else if(a==='reset'){ if(!resetArm){ resetArm = true; sheet('home'); setTimeout(() => { if(resetArm){ resetArm = false; if(mview==='home') sheet('home'); } }, 4000); } else { resetArm = false; resetAll(); closeTop(); toast('Progress reset'); } }
  else if(a==='signout'){ try{ firebase.auth().signOut(); }catch(_){} sheet('home'); }
});

addEventListener('keydown', ev => {
  const top = stack[stack.length-1];
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(top==='S' && study){
    const s = study, st = s.st, k = ev.key, go = k===' ' || k==='Enter';
    if(k==='Escape') return closeTop();
    if(typing) return; /* the answer box handles its own Enter */
    if(!st){ if(go){ ev.preventDefault(); const b = SB.querySelector('.btn.pri'); if(b) b.click(); } return; }
    if(st.k==='rule'){ if(go){ ev.preventDefault(); SB.querySelector('[data-sact="prule"]').click(); } return; }
    if(s.ph!=='ask'){ if(go){ ev.preventDefault(); nextStep(); } return; }
    if(st.k==='build'){
      if(k==='Backspace'){ ev.preventDefault(); s.pick.pop(); drawPlay(); }
      else if(/^[1-9]$/.test(k)){ const i = +k - 1; if(i < st.x.toks.length && !s.pick.includes(i)){ s.pick.push(i); drawPlay(); if(s.pick.length===st.x.toks.length) setTimeout(checkTiles, 200); } }
      else if(k===' '){ ev.preventDefault(); replay(); }
      return;
    }
    if(/^[1-4]$/.test(k)) pickOpt(+k - 1);
    else if(k===' '){ ev.preventDefault(); replay(); }
    return;
  }
  if(top==='M'){ if(ev.key==='Escape') closeTop(); return; }
  if(top==='v'){
    if(ev.key==='Escape') closeTop();
    else if(ev.key==='ArrowLeft') nav(-1);
    else if(ev.key==='ArrowRight') nav(1);
    else if(ev.key==='s' || ev.key==='S') $('sb').click();
    else if(ev.key==='Backspace' && trail.length){ ev.preventDefault(); $('vbk').click(); }
    return;
  }
  if(typing) return;
  const kk = ev.key.toLowerCase();
  if(top==='M') return;
  if(ev.key==='/'){ ev.preventDefault(); q.focus(); q.select(); }
  else if(kk==='r') $('rnd').click();
  else if(kk==='p') startPlay();
  else if(kk==='m') openMenu();
  else if(ev.key==='?') openMenu('keys');
});

async function fetchT(){
  let err = null;
  for(const n of TSV_NAMES){
    const u = encodeURIComponent(n);
    try{
      const r = await fetch(u, { cache:'no-cache' });
      if(!r.ok){ err = new Error('HTTP '+r.status+' for '+n); continue; }
      const t = await r.text();
      if((r.headers.get('content-type')||'').toLowerCase().includes('text/html') || /^\s*<(!doctype|html)/i.test(t)){ err = new Error('Not found: '+n); continue; }
      try{ const r2 = await fetch('tiliv.tsv', { cache:'no-cache' }); if(r2.ok){ const x = await r2.text(); if(!/^\s*</.test(x)) return t.replace(/\s+$/,'') + '\n' + x; } }catch(_){}
      return t;
    }catch(e){ err = e; }
  }
  throw err || new Error('TSV not found');
}
async function loadCore(){
  try{
    const r = await fetch('essential-500.tsv', { cache:'no-cache' });
    if(!r.ok) return;
    const t = await r.text();
    CORE = new Set(t.split(/\r?\n/).filter(Boolean).map(l => l.split('\t').slice(0,2).map(x => x.trim().normalize('NFC')).join('|')));
    all.forEach(e => { e.core = CORE.has(e.key); });
    const byKey = new Map(all.map(e => [e.key, e]));
    coreArr = [...CORE].map(k => byKey.get(k)).filter(Boolean);
    try{ const rb = await fetch('tiliv-sentences.tsv', { cache:'no-cache' }); if(rb.ok) BOOK = (await rb.text()).split(/\r?\n/).map(l => l.split('\t')).filter(c => c.length > 1 && c[0] && c[1]); }catch(_){}
    try{ const rp = await fetch('tiliv-path.json', { cache:'no-cache' }); if(rp.ok) PATH = await rp.json(); }catch(_){}
    sents = null;
  }catch(_){}
}
function ingest(t, cache){
  build(tsv(t));
  if(!all.length) throw new Error('The file has no rows.');
  loaded = true;
  if(cache) ls.s(K.tsv, t);
  loadCore().then(() => { chips(); render(); });
  chips(); render();
  openFromHash();
}
function openFromHash(){
  const h = decodeURIComponent(location.hash.slice(1)); if(!h) return;
  const [w, id] = h.split('~');
  let e = id!=null && all[+id] && all[+id].base===w ? all[+id] : all.find(x => x.base===w);
  if(!e){ const ids = lookupIds(w); e = ids.length ? all[ids[0]] : null; }
  if(e){ try{ history.replaceState({ d:0 }, '', location.pathname + location.search); }catch(x){} openV(e); }
}
function setup(){
  loaded = false; all = []; res = []; $('cnt').textContent=''; $('srt').querySelector('span').textContent='';
  $('ch').innerHTML = ''; L.innerHTML = '';
}
(async () => {
  try{ history.replaceState({ d:0 }, '', location.href); }catch(e){}
  L.innerHTML = '<p class="msg">Loading…</p>';
  const cached = ls.g(K.tsv, null);
  try{ ingest(await fetchT(), true); }
  catch(e){
    if(cached){ try{ ingest(cached, false); toast('Offline: using saved copy'); return; }catch(x){} }
    setup(e);
  }
})();
