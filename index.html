<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>KV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="dk-icon-48.png">
<link rel="apple-touch-icon" href="dk-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KV">
<style>:root{
  --bg:#faf7f1;--card:#fff;--soft:#f1ece2;--line:#e6dfd2;--fg:#1d1a16;--mid:#6c6458;--dim:#857c6e;
  --acc:#6b5ce7;--acc-a:rgba(107,92,231,.1);--ok:#1d8a50;--bad:#c43d33;--gold:#d39b14;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e0e10;--card:#18181b;--soft:#202024;--line:#2a2a2f;--fg:#f2f0ec;--mid:#a29d95;--dim:#85807a;
  --acc:#a497ff;--acc-a:rgba(164,151,255,.13);--ok:#6fd49c;--bad:#ff8f86;--gold:#f3c969;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0 0 calc(58px + var(--sb)) 0;display:flex;flex-direction:column;padding-top:var(--st)}
body.typing #app{bottom:0}
body.typing #nav{display:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:680px;margin:0 auto;padding:.7rem 1rem 0}
.view[hidden]{display:none}
.top{display:flex;justify-content:center;flex:none;margin-bottom:.6rem}
.dir{display:flex;align-items:center;gap:.7rem;padding:.45rem 1rem;border-radius:999px;background:var(--soft);font-weight:700;letter-spacing:.06em;font-size:.95rem}
.dir .i{width:18px;height:18px;color:var(--acc);transition:transform .25s}
.dir:active .i{transform:rotate(180deg)}
.inp{position:relative;flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:.75rem 2.6rem .5rem .9rem}
.inp textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;color:var(--fg);font:inherit;font-size:1.15rem;line-height:1.4;min-height:2.8em;max-height:9em}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--mid)}
.ib:active{background:var(--soft)}
.clr{position:absolute;top:.4rem;right:.35rem}
.clr[hidden]{display:none}
.acc{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;margin-top:.35rem}
.acc::-webkit-scrollbar{display:none}
.acc:empty{display:none}
.acc button{flex:none;min-width:32px;height:32px;border-radius:9px;background:var(--soft);font-size:1.02rem}
.out{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.9rem 0 1rem;display:flex;flex-direction:column;gap:1.1rem}
.empty{margin:auto;color:var(--line);text-align:center}
.empty .i{width:64px;height:64px;stroke-width:1.3}
.sn{display:flex;flex-direction:column;gap:.45rem}
.ch{display:flex;flex-wrap:wrap;gap:.35rem;align-items:flex-start}
.w{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.06rem;padding:.32rem .55rem .36rem;border-radius:11px;background:var(--card);border:1px solid var(--line);text-align:left;max-width:100%}
.w b{font-weight:600;font-size:1.04rem}
.w small{font-size:.76rem;color:var(--mid);line-height:1.2;max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w small.o{color:var(--dim);font-size:.7rem}
.w.kv small:first-of-type{color:var(--acc);font-weight:600;font-size:.86rem}
.w.ph{border-color:var(--acc);background:var(--acc-a)}
.w.unk{border-style:dashed;border-color:var(--bad)}
.w.unk small{color:var(--bad)}
.w.nm{background:none;border-color:transparent}
.w.st{box-shadow:inset 0 0 0 1.5px var(--gold)}
.w:active{transform:scale(.97)}
.sp{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc-a);color:var(--acc);align-self:center}
.sp .i{width:18px;height:18px}
.tl{display:flex;align-items:flex-start;gap:.5rem;margin:0;padding:.15rem 0 .15rem .7rem;border-left:3px solid var(--acc);font-size:1rem;line-height:1.35}
.tl p{margin:0;flex:1}
.tl.ap{border-left-color:var(--line);color:var(--mid)}
.tl .sym{flex:none;color:var(--acc);font-weight:700}
.tl.ap .sym{color:var(--dim)}
.ft{display:flex;justify-content:flex-end;gap:.25rem;color:var(--dim);font-size:.8rem;align-items:center;border-top:1px solid var(--line);padding-top:.4rem}
.ft span{margin-right:auto;display:flex;gap:.7rem;align-items:center}
.ft span i{font-style:normal;display:inline-flex;align-items:center;gap:.2rem}
.ft span .i{width:14px;height:14px}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(58px + var(--sb));padding-bottom:var(--sb);display:flex;justify-content:center;gap:2.6rem;border-top:1px solid var(--line);background:var(--bg)}
#nav button{position:relative;display:grid;place-items:center;width:64px;color:var(--dim)}
#nav button[aria-current=true]{color:var(--fg)}
#nav button[aria-current=true]::after{content:'';position:absolute;top:-1px;left:18px;right:18px;height:2px;border-radius:2px;background:var(--acc)}
#nav .i{width:25px;height:25px}
.n{position:absolute;top:8px;left:38px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--soft);color:var(--mid);font-size:.68rem;font-weight:700;line-height:18px;text-align:center}
.n.hot{background:var(--acc);color:#fff}
.n:empty{display:none}
/* sheet */
.sh{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.35);animation:fd .18s}
.sh .pn{background:var(--bg);border-radius:22px 22px 0 0;max-height:86%;display:flex;flex-direction:column;padding:.4rem 1rem calc(1rem + var(--sb));animation:up .22s cubic-bezier(.2,.9,.3,1);width:100%;max-width:680px;margin:0 auto}
.sh .gr{width:38px;height:4px;border-radius:2px;background:var(--line);margin:.2rem auto .5rem;flex:none}
.sh .bd{overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(40%)}}
.en{display:flex;flex-direction:column;gap:.45rem}
.en+.en{border-top:1px solid var(--line);padding-top:1rem}
.eh{display:flex;align-items:center;gap:.35rem}
.eh h2{margin:0;font-size:1.55rem;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.eh .alt{color:var(--mid);font-weight:400;font-size:1rem}
.ps{font-size:.78rem;color:var(--dim);letter-spacing:.03em}
.ss{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem}
.ss li{line-height:1.35}
.ex{display:flex;gap:.45rem;align-items:flex-start;margin-top:.3rem;padding:.45rem .55rem;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:.92rem}
.ex div{flex:1}
.ex small{display:block;color:var(--mid);margin-top:.1rem}
.ex .sp{width:30px;height:30px}
.stb{color:var(--dim)}
.stb.on{color:var(--gold)}
.stb.on .i{fill:currentColor}
/* saved list */
.hd{display:flex;align-items:center;gap:.5rem;flex:none;margin-bottom:.5rem;min-height:40px}
.hd .big{font-size:1.4rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.hd .big .i{color:var(--gold);fill:var(--gold)}
.lst{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:1rem}
.row{display:flex;align-items:center;gap:.6rem;padding:.6rem .1rem;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:1.05rem}
.row .tx small{display:block;color:var(--mid);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.dots.new i:first-child{background:var(--acc)}
/* learn */
.lrn{flex:1;min-height:0;display:flex;flex-direction:column;gap:.9rem;padding-bottom:1rem}
.prog{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cd{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.2rem;text-align:center;position:relative;overflow-y:auto}
.cd .fr{font-size:2rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.cd .fr.en{font-size:1.5rem;font-weight:600}
.cd .bk{display:flex;flex-direction:column;gap:.5rem;align-items:center;width:100%;border-top:1px solid var(--line);padding-top:.8rem}
.cd .bk .m{font-size:1.15rem}
.cd .bk .k{font-size:1.5rem;font-weight:700;color:var(--acc)}
.cd .bk .ex{text-align:left;width:100%}
.cd .side{position:absolute;top:.7rem;left:.9rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.gb{display:flex;gap:.6rem;flex:none}
.gb button{flex:1;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--soft)}
.gb button .i{width:26px;height:26px}
.gb .g0{color:var(--bad)}
.gb .g1{color:var(--gold)}
.gb .g2{color:#fff;background:var(--ok)}
.gb .rv{background:var(--acc);color:#fff}
.big1{margin:auto;display:flex;flex-direction:column;align-items:center;gap:.8rem;color:var(--mid);font-size:1.05rem}
.big1 .i{width:72px;height:72px;stroke-width:1.3;color:var(--line)}
.big1 .i.ok{color:var(--ok)}
.big1 .meta{display:flex;gap:1rem;align-items:center}
.big1 .meta span{display:flex;align-items:center;gap:.3rem}
.big1 .meta .i{width:18px;height:18px;stroke-width:1.8;color:var(--dim)}
.go{height:52px;padding:0 2rem;border-radius:16px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:.5rem}
.go .i{width:24px;height:24px}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;color:var(--acc);transition:opacity .3s}
#boot .i{width:56px;height:56px;stroke-width:1.4;animation:pl 1.2s ease-in-out infinite}
#boot.off{opacity:0;pointer-events:none}
@keyframes pl{50%{opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sb));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:.45rem .8rem;display:flex;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
#toast .i{width:20px;height:20px}
@media (min-width:700px){.view{padding-top:1.4rem}.cd .fr{font-size:2.4rem}}
.row .tx{text-align:left}
</style>
</head>

<main id="app">
  <section id="vT" class="view">
    <div class="top">
      <button type="button" id="dir" class="dir" aria-label="Swap direction"><b id="dA">KV</b><svg class="i"><use href="#i-swap"/></svg><b id="dB">EN</b></button>

<script>/* Diksyonær core: lexicon, lemmatizer, course, exercises, grading, scheduling. No DOM. */
(function (G) {
'use strict';

/* ------------------------------------------------------------------ text */
const C1 = {'\x80':'€','\x8a':'Š','\x8c':'Œ','\x8e':'Ž','\x9a':'š','\x9c':'œ','\x9e':'ž','\x9f':'Ÿ','\x91':'‘','\x92':'’','\x93':'“','\x94':'”','\x96':'-','\x97':'-','\x85':'...'};
const dec = s => String(s || '').replace(/[\x80-\x9f]/g, c => C1[c] || '').replace(/&nbsp;/gi, ' ').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#39;/g, "'").replace(/&amp;/gi, '&');
const SP = {'æ':'ae','œ':'oe','ß':'ss','ø':'o','đ':'d','ð':'d','ł':'l','þ':'th','ı':'i'};
const memo = f => { const m = new Map(); return s => { s = String(s); let v = m.get(s); if (v === undefined) { v = f(s); if (m.size > 60000) m.clear(); m.set(s, v); } return v; }; };
const fold = memo(s => s.toLowerCase().replace(/[‘’ʼ`´]/g, "'").normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[æœßøđðłþı]/g, c => SP[c]));
const loose = memo(s => fold(s).replace(/ae|oe/g, 'e').replace(/en/g, 'in'));
const uniq = a => [...new Set(a)];
const low = memo(s => s.toLowerCase().replace(/[‘’ʼ`´]/g, "'").normalize('NFC'));

/* ------------------------------------------------------- part of speech */
const VOC = new Set('n v adj adv prep conj pron det int interj intj interr phr ohr phrn exp aux pvm mod indef ind quant rel prop pl sg m f tr intr imp imperfect past pat part pres fut future cond comp neg negative or noun verb num art sdv av pro place'.split(' '));
const AB = {n:'noun',v:'verb',adj:'adjective',adv:'adverb',prep:'preposition',conj:'conjunction',pron:'pronoun',det:'determiner',int:'interjection',interj:'interjection',intj:'interjection',interr:'interrogative',phr:'phrase',ohr:'phrase',phrn:'phrase',sdv:'adverb',av:'adverb',pro:'pronoun',ind:'indefinite',pat:'past',place:'place name',future:'future',negative:'negative',or:'or',exp:'expression',aux:'auxiliary',pvm:'preverbal marker',mod:'modal',indef:'indefinite',quant:'quantifier',rel:'relative',prop:'proper',pl:'plural',sg:'singular',m:'masculine',f:'feminine',tr:'transitive',intr:'intransitive',imp:'imperfect',imperfect:'imperfect',past:'past',part:'participle',pres:'present',fut:'future',cond:'conditional',comp:'comparative',neg:'negative',num:'numeral',art:'article'};
const CT = {n:'noun',noun:'noun',prop:'noun',v:'verb',verb:'verb',aux:'verb',pvm:'verb',mod:'verb',adj:'adj',adv:'adv',prep:'prep',conj:'conj',pron:'pron',det:'det',quant:'det',art:'det',indef:'det',int:'int',interj:'int',intj:'int',sdv:'adv',av:'adv',pro:'pron',place:'noun',num:'noun'};
const VF = new Set('past pat pres part fut future cond imp imperfect tr intr'.split(' '));
const CATS = [['noun','Noun'],['verb','Verb'],['adj','Adjective'],['adv','Adverb'],['prep','Preposition'],['conj','Conjunction'],['pron','Pronoun'],['det','Determiner'],['int','Interjection'],['phrase','Phrase'],['other','Other']];
const ptoks = s => s.toLowerCase().split(/[^a-z]+/).filter(Boolean);
const posLike = s => !/[^a-zA-Z0-9.,\s\-\/]/.test(s) && ptoks(s).length > 0 && ptoks(s).every(x => VOC.has(x));
const expandPos = l => ptoks(l).map(t => AB[t] || t).join(' ');
function parsePos(inner) {
  const items = [], bySense = {}, cats = new Set();
  inner.split(',').map(x => x.trim()).filter(Boolean).forEach(it => {
    const m = it.match(/^(\d+)(?:\s*-\s*(\d+))?\.\s*(.*)$/);
    const label = (m ? m[3] : it).replace(/^\.\s*/, '').trim();
    if (!label) return;
    const t = ptoks(label);
    let c = t.some(x => x === 'phr' || x === 'ohr' || x === 'phrn' || x === 'exp') ? ['phrase'] : uniq(t.map(x => CT[x]).filter(Boolean));
    if (!c.length && t.some(x => VF.has(x))) c = ['verb'];
    c.forEach(x => cats.add(x));
    if (m) { const a = +m[1], b = m[2] ? +m[2] : a; for (let i = a; i <= b; i++) bySense[i] = label; }
    if (!items.includes(label)) items.push(label);
  });
  return { items, bySense, cats };
}

/* -------------------------------------------------------------- forms */
function splitTop(s) { const o = []; let d = 0, c = ''; for (const ch of s) { if (ch === '(') d++; else if (ch === ')') d = Math.max(0, d - 1); if ((ch === ',' || ch === ';') && !d) { o.push(c); c = ''; } else c += ch; } o.push(c); return o.map(x => x.trim()).filter(Boolean); }
function expand(w, depth = 0) {
  const i = w.indexOf('('), j = i < 0 ? -1 : w.indexOf(')', i);
  if (i < 0 || j < 0 || depth > 6) return [w.replace(/\s+/g, ' ').trim()];
  const b = w.slice(0, i), c = w.slice(i + 1, j).trim(), a = w.slice(j + 1);
  if (/\./.test(c) || posLike(c)) return expand(b + a, depth + 1);

  tx.onblur = () => setTimeout(() => { if (document.activeElement !== tx) document.body.classList.remove('typing'); }, 120);
  $('clr').onclick = () => { tx.value = ''; ST.t = ''; save(); grow(); drawT(); tx.focus(); };
  $('acc').addEventListener('pointerdown', ev => { if (ev.target.closest('[data-c]')) ev.preventDefault(); });
  $('acc').addEventListener('click', ev => { const b = ev.target.closest('[data-c]'); if (!b) return; const a = tx.selectionStart || 0, z = tx.selectionEnd || 0, c = b.dataset.c; tx.value = tx.value.slice(0, a) + c + tx.value.slice(z); tx.selectionStart = tx.selectionEnd = a + c.length; tx.focus(); tx.oninput(); });
  $('dir').onclick = () => {
    const cur = splitS(tx.value);
    /* swapping carries a known translation across when there is one */
    if (cur.length) { const m = cur.map(s => (ST.d === 'kv' ? kvLine(s) : enLine(s)).match).filter(Boolean); if (m.length === cur.length) tx.value = m.map(x => x.t).join(' '); }
    ST.d = ST.d === 'kv' ? 'en' : 'kv'; ST.t = tx.value; save(); drawDir(); grow(); drawT();
  };
  drawDir(); grow();
}

async function getText(name) {
  try { const r = await fetch(SRC + name, { cache: 'no-cache', mode: 'cors' }); if (r.ok) return await r.text(); } catch (e) {}
  const r = await fetch(name); return r.ok ? r.text() : '';
}
(async () => {
  const [tsv, pv, dl] = await Promise.all([getText('diksyonaer.tsv'), getText('proverbs.tsv').catch(() => ''), getText('dialogues.json').catch(() => '[]')]);
  let dlg = []; try { dlg = JSON.parse(dl || '[]'); } catch (e) {}
  const pvr = String(pv || '').split(/\r?\n/).map(l => l.split('\t').map(x => (x || '').trim().normalize('NFC'))).filter(c => c[0] && c[1]);
  build(tsv, pvr, dlg);
  wire(); badges(); setView('T');
  $('boot').classList.add('off'); setTimeout(() => $('boot').remove(), 400);
  window.__kv = { E, I, kvLine, enLine, ST, setView, openWords, toggleStar, grade: g => grade(g) };
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
